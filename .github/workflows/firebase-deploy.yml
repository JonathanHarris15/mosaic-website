name: Deploy Firebase (hosting + publicForm)

# Production Hosting + the documented functions set + firestore:rules
# (MS-545 option B, widened again by MS-565 then MS-598). Agents must not
# `firebase deploy` from the box (AGENTS.md). Standing ship path after
# dry_run green + Maintain CLEAR live:
#   - push to `main` deploys for real
#   - workflow_dispatch can still plan only:
#       gh workflow run "Deploy Firebase (hosting + publicForm)" --ref <branch> -f dry_run=true
#
# Standing --only targets (do not one-off around this list):
#   hosting,functions:publicForm,functions:answerLink,functions:onAttendanceCreated,functions:syncAccountRankToPerson,functions:sendPrayerRequestNow,functions:sendPrayerRequestTexts,functions:notifyEldersOnPrayerComplete,functions:mcp,functions:notificationOverview,functions:notificationHistory,functions:notificationRevokeToken,functions:notificationTestPush,functions:translateLiturgy,functions:oosUpdateLiturgy,firestore:rules
# Documented at: docs/ops/ms-545-functions-deploy-set.md
#
# The runtime this ships on comes from functions/package.json `engines.node`,
# not from the node-version below — that only picks the runner's node. MS-683
# moved both to 22 because nodejs20 is decommissioned 2026-10-30, after which
# this job fails outright rather than warning. Keep them equal:
# test/functions-node-runtime.test.js fails if they drift.
#
# App Check stays **monitor**. This job writes PUBLIC_FORM_APP_CHECK_MODE=monitor
# for the deploy (gitignored .env, never committed) and never passes enforce.
# It also writes MCP_ISSUER_URL (mosaic-hymn-mcp hosting origin, no trailing
# slash) because firebase deploy loads the whole functions codebase.
# Enforce is an Atlas-escalated param flip:
# docs/ops/ms-508-app-check-break-glass.md

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Plan only — do not ship (firebase deploy --dry-run)
        type: boolean
        default: false
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: firebase-deploy-mosaic-hymn-database
  cancel-in-progress: false

jobs:
  deploy:
    name: Hosting + documented functions set + Firestore rules
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # firebase.json: CLI analysis of functions/index.js can exceed the
      # default 10s since MS-278 pulled in the MCP surface.
      FUNCTIONS_DISCOVERY_TIMEOUT: "120"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Install root dependencies
        run: npm ci --no-audit --no-fund

      - name: Install functions dependencies
        run: npm ci --prefix functions --no-audit --no-fund

      - name: Refuse church deploy outside main or from ghost-main
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "::error::Church production deploy on push is only allowed from main."
            exit 1
          fi
          if [ "${{ github.ref_name }}" = "ghost-main" ]; then
            echo "::error::ghost-main must never run the church deploy workflow."
            exit 1
          fi

      - name: Load Firebase service account
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_SERVICE_ACCOUNT_MOSAIC_HYMN_DATABASE: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MOSAIC_HYMN_DATABASE }}
        run: |
          set -euo pipefail
          # Do not echo the JSON. GitHub masks secret values in logs; still
          # never print, never commit.
          SA_JSON=""
          USED=""
          if [ -n "${FIREBASE_SERVICE_ACCOUNT}" ]; then
            SA_JSON="${FIREBASE_SERVICE_ACCOUNT}"
            USED="FIREBASE_SERVICE_ACCOUNT"
          elif [ -n "${FIREBASE_SERVICE_ACCOUNT_MOSAIC_HYMN_DATABASE}" ]; then
            SA_JSON="${FIREBASE_SERVICE_ACCOUNT_MOSAIC_HYMN_DATABASE}"
            USED="FIREBASE_SERVICE_ACCOUNT_MOSAIC_HYMN_DATABASE"
          else
            echo "::error::No Firebase service account secret. Add FIREBASE_SERVICE_ACCOUNT (preferred) or FIREBASE_SERVICE_ACCOUNT_MOSAIC_HYMN_DATABASE."
            exit 1
          fi
          echo "Using GitHub Actions secret ${USED}"
          umask 077
          printf '%s' "${SA_JSON}" > "${RUNNER_TEMP}/firebase-sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=${RUNNER_TEMP}/firebase-sa.json" >> "${GITHUB_ENV}"

      - name: Write functions dotenv for deploy
        run: |
          set -euo pipefail
          # Runner-only. functions/.env.* is gitignored. Forces monitor so a
          # leftover remote param cannot silently enforce on this deploy.
          # MCP_ISSUER_URL is required in non-interactive mode: deploying
          # any named function still loads functions/index.js, which
          # defineString-s the MCP issuer.
          printf '%s\n' \
            'PUBLIC_FORM_APP_CHECK_MODE=monitor' \
            'MCP_ISSUER_URL=https://mosaic-hymn-mcp.web.app' \
            > functions/.env.mosaic-hymn-database

      - name: Refuse a deploy whose config is not the church project
        run: node scripts/check-firebase-deploy.js --project mosaic-hymn-database --i-mean-prod

      - name: Guard resolved project id against branch
        run: |
          set -euo pipefail
          RESOLVED="$(node -e 'process.stdout.write(require("./functions/firebase-project.json").projectId)')"
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            if [ "${RESOLVED}" != "mosaic-hymn-database" ]; then
              echo "::error::main push resolved ${RESOLVED}; expected mosaic-hymn-database."
              exit 1
            fi
          fi
          if [ "${RESOLVED}" = "mosaic-manager-ghost" ]; then
            echo "::error::Church workflow refuses the ghost project id."
            exit 1
          fi
          if [ "${RESOLVED}" != "mosaic-hymn-database" ]; then
            echo "::error::Church workflow expected mosaic-hymn-database, got ${RESOLVED}."
            exit 1
          fi

      - name: Deploy hosting + documented functions set + firestore:rules
        run: |
          set -euo pipefail
          # Pinned. Do not read .firebaserc default — flipping that alias
          # would retarget this job at whatever project the alias named.
          PROJECT_ID="mosaic-hymn-database"
          echo "project=${PROJECT_ID}"
          echo "sha=${GITHUB_SHA}"
          echo "targets=hosting,functions:publicForm,functions:answerLink,functions:onAttendanceCreated,functions:syncAccountRankToPerson,functions:sendPrayerRequestNow,functions:sendPrayerRequestTexts,functions:notifyEldersOnPrayerComplete,functions:mcp,functions:notificationOverview,functions:notificationHistory,functions:notificationRevokeToken,functions:notificationTestPush,functions:translateLiturgy,functions:oosUpdateLiturgy,firestore:rules"
          echo "PUBLIC_FORM_APP_CHECK_MODE=monitor"
          echo "MCP_ISSUER_URL=https://mosaic-hymn-mcp.web.app"
          EXTRA=()
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            EXTRA+=(--dry-run)
            echo "dry_run=true"
          fi
          npx firebase deploy \
            --only hosting,functions:publicForm,functions:answerLink,functions:onAttendanceCreated,functions:syncAccountRankToPerson,functions:sendPrayerRequestNow,functions:sendPrayerRequestTexts,functions:notifyEldersOnPrayerComplete,functions:mcp,functions:notificationOverview,functions:notificationHistory,functions:notificationRevokeToken,functions:notificationTestPush,functions:translateLiturgy,functions:oosUpdateLiturgy,firestore:rules \
            --project "${PROJECT_ID}" \
            --non-interactive \
            "${EXTRA[@]}"
