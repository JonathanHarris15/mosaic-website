name: PR CI

# The two commands agents already run: `npm test` and `npm run lint --prefix functions`.
# Both are green on main after MS-543 / PR #65. The old red baseline is recorded in
# docs/ops/ms-543-ci-baseline-inventory.md (landed with #65). This workflow still
# runs them so every PR has the same signal; do not weaken eslint or skip the jobs.

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Install root dependencies
        run: npm ci --no-audit --no-fund

      - name: Unit tests
        run: npm test

  lint:
    name: Lint functions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install functions dependencies
        run: npm ci --prefix functions --no-audit --no-fund

      - name: Lint functions
        run: npm run lint --prefix functions
