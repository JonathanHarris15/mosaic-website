name: PR CI

# The two commands agents already run: `npm test` and `npm run lint --prefix functions`.
# Runs on pull requests targeting `main` or `ghost-main` (design sandbox).
#
# node-version must be the runtime the functions actually ship on, which is
# functions/package.json `engines.node` (MS-683 moved both to 22). Testing on a
# different major than Cloud Functions runs is a green CI that proves nothing.
# test/functions-node-runtime.test.js fails if the two drift apart.

on:
  pull_request:
    branches:
      - main
      - ghost-main

permissions:
  contents: read

concurrency:
  group: pr-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Install root dependencies
        run: npm ci --no-audit --no-fund

      - name: Unit tests
        run: npm test

  lint:
    name: Lint functions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install functions dependencies
        run: npm ci --prefix functions --no-audit --no-fund

      - name: Lint functions
        run: npm run lint --prefix functions
