<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hymn Manager - Mosaic Church</title>

    <!-- Mobile shell: adapt this page when opened inside the Capacitor WebView.
         The mobile Hymn Directory routes here — "Manage Hymn" (?edit=<id>) and
         the add-a-hymn FAB (?new=1) — so there is no separate mobile manager. -->
    <script src="mobile-shell.js"></script>
    <link rel="stylesheet" href="mobile-shell.css" />
    <script>window.MOBILE_HEADER = { title: new URLSearchParams(location.search).get('edit') ? 'Edit Hymn' : 'New Hymn', back: 'mobile.html#/hymnDirectory' };</script>
    <script src="person-photo-core.js"></script>
    <script src="mobile-shell-header.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            if (window.MOSAIC_SHELL === 'mobile') {
                var h = document.getElementById('shell-home-link');
                if (h) h.setAttribute('href', 'mobile.html#/home');
            }
        });
    </script>

    <link rel="stylesheet" href="mosaic.css" />
    <link rel="stylesheet" href="fonts.css" />



    <link rel="stylesheet" href="manager.css">

    <!-- ============================================================
         Mobile shell: the desktop catalog list must NOT be reachable on the
         phone. When opened in-shell (always via ?edit=<id> or ?new=1, which
         auto-open the form), hide the toolbar + catalog and present just the
         edit/create form as a full-screen page. Close / Cancel / Save exit to
         the app's Hymn Directory (manager.js closeForm/exitToApp). Desktop is
         untouched. Colours are the theme hexes (no --token vars on this page).
         ============================================================ -->
    <style>
        html.shell-mobile #mgr-list-area { display: none; }

        /* Turn the centred modal into a full-bleed page: the card fills the fixed
           overlay via absolute-inset (independent of the flex centring / Alpine's
           inline display on the overlay). */
        html.shell-mobile #mgr-modal { padding: 0; background: transparent; backdrop-filter: none; }
        html.shell-mobile #mgr-modal-card {
            position: absolute; inset: 0;
            max-width: none; width: 100%; max-height: none; height: 100%;
            border: none; border-radius: 0; box-shadow: none;
        }
        html.shell-mobile #mgr-modal-body { padding: 16px; }
        html.shell-mobile #mgr-modal-foot { padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 12px); }
        /* Standardized back-arrow header (mobile-shell-header.js) replaces the
           modal's own head (icon + X) and the foot Cancel; offset the full-bleed
           modal below the fixed header. Save stays. */
        html.shell-mobile #mgr-modal { top: var(--msh-height, 62px); }
        html.shell-mobile #mgr-modal-head { display: none; }
        html.shell-mobile #mgr-cancel-btn { display: none; }
    </style>
    
    <!-- Firebase SDKs -->
    <script src="vendor/firebase/firebase-app-compat.js"></script>
    <script src="vendor/firebase/firebase-auth-compat.js"></script>
    <script src="vendor/firebase/firebase-firestore-compat.js"></script>
    <script src="vendor/firebase/firebase-storage-compat.js"></script>
    <script src="vendor/firebase/firebase-functions-compat.js"></script>
    
    <!-- On-device cache for the phone app (no-op on the web). Must load before
         auth.js, which builds the Firestore handle persistence attaches to. -->
    <script src="local-cache.js"></script>
    <script src="auth.js"></script>
    <script defer src="vendor/alpine-3.15.12.min.js"></script>
    
</head>
<!-- x-data is on the body, not on <main>. The search box and the Add button are
     in the header now, and the header is not inside <main> — a component scoped
     there would leave both of them bound to nothing, silently. -->
<body class="bg-background text-on-background font-body-md antialiased h-screen flex flex-col relative overflow-hidden" x-data="hymnManager()">
    <!-- Architectural accent lines (Modern Minimalism) -->
    <div class="absolute right-0 top-0 h-96 w-1/3 bg-gradient-to-l from-surface-container-high to-transparent opacity-30 pointer-events-none"></div>
    
    <!-- A Tool Bar: this is a page you sit in and work. The seal has gone, and
         the second sticky toolbar that used to carry the title, the search and
         the Add button has been folded up into this one row (MS-187). -->
    <header class="m-header m-header--tool">
        <div class="m-header__inner">
            <div class="m-header__lead">
                <a id="shell-home-link" href="index.html" class="m-back">
                    <span class="material-symbols-outlined">chevron_left</span>
                    <span class="m-back__label">Home</span>
                </a>
                <div class="m-header__titles">
                    <h1 class="m-header__title">Hymn Catalog</h1>
                </div>
            </div>
            <div class="m-header__actions">
                <label class="m-search" style="width: 260px">
                    <span class="material-symbols-outlined">search</span>
                    <input type="text" x-model="searchQuery" placeholder="Search hymns, writers, tags…">
                    <button type="button" x-show="searchQuery" @click="searchQuery = ''" title="Clear search">
                        <span class="material-symbols-outlined">close</span>
                    </button>
                </label>
                <button @click="startCreateHymn()" class="m-btn m-btn--primary m-btn--sm">
                    <span class="material-symbols-outlined">add</span>
                    <span class="m-btn__label">Add New Hymn</span>
                </button>
            </div>
            <div class="m-header__rule"></div>
            <div class="m-header__auth" id="auth-container"></div>
        </div>
    </header>
    
    <main class="flex-1 flex flex-col w-full max-w-[1280px] mx-auto relative z-10 overflow-hidden">
        <!-- The sticky action bar is gone: its title, its search and its Add
             button are the header's now, which is what stopped this page
             drawing two bars with two hairlines 70px apart (MS-187). -->

        <!-- Scrollable List Area -->
        <div id="mgr-list-area" class="flex-1 overflow-y-auto px-gutter py-md scrollbar-thin">
            <div class="bg-surface-container-lowest border border-outline-variant/30 rounded-xl shadow-sm overflow-hidden">
                <div class="p-md border-b border-surface-variant/30 flex justify-between items-center bg-surface-container-low/50">
                    <span class="font-label-md text-xs text-on-surface-variant uppercase tracking-widest" x-text="searchQuery ? filteredHymns.length + ' of ' + hymns.length + ' Hymns' : hymns.length + ' Total Hymns'"></span>
                </div>
                
                <!-- Column headers (desktop only) -->
                <div class="hidden md:grid md:grid-cols-[2.2fr_1.5fr_1.5fr_2.2fr_72px_72px] md:gap-4 px-md py-2 border-b border-surface-variant/30 bg-surface-container-low/30">
                    <span class="m-label">Hymn</span>
                    <span class="m-label">Lyrics</span>
                    <span class="m-label">Music</span>
                    <span class="m-label">Tags</span>
                    <span class="font-label-md text-[10px] uppercase tracking-widest text-on-surface-variant text-center">Versions</span>
                    <span class="font-label-md text-[10px] uppercase tracking-widest text-on-surface-variant text-right">Actions</span>
                </div>

                <div id="hymn-list" class="divide-y divide-surface-variant/20" @click.away="selectedHymnId = null">
                    <template x-for="hymn in filteredHymns" :key="hymn.id">
                        <div class="group px-md py-3 transition-all cursor-pointer flex flex-col gap-1.5 md:grid md:grid-cols-[2.2fr_1.5fr_1.5fr_2.2fr_72px_72px] md:gap-4 md:items-center"
                             :class="selectedHymnId === hymn.id ? 'bg-secondary/10' : 'hover:bg-surface-container-low'"
                             @click="selectedHymnId = (selectedHymnId === hymn.id ? null : hymn.id)">

                            <!-- Hymn name (+ mobile subline) -->
                            <div class="flex flex-col gap-0.5 min-w-0">
                                <strong class="font-body-lg text-on-surface truncate transition-colors"
                                        :class="selectedHymnId === hymn.id ? 'text-primary font-bold' : ''"
                                        x-text="hymn.hymn_name"></strong>
                                <span class="md:hidden font-label-md text-[10px] text-on-surface-variant uppercase tracking-wider truncate" x-text="hymn.music_writer || hymn.lyrics_writer || ''"></span>
                            </div>

                            <!-- Lyrics writer (desktop) -->
                            <span class="hidden md:block text-sm text-on-surface-variant truncate min-w-0" x-text="hymn.lyrics_writer || '—'"></span>

                            <!-- Music writer (desktop) -->
                            <span class="hidden md:block text-sm text-on-surface-variant truncate min-w-0" x-text="hymn.music_writer || '—'"></span>

                            <!-- Theological tags (desktop) -->
                            <div class="hidden md:flex flex-wrap gap-1 items-center min-w-0">
                                <template x-for="tag in (hymn.tags || []).slice(0, 3)" :key="tag">
                                    <span class="bg-secondary-container text-on-secondary-container px-2 py-0.5 rounded-sm font-label-md text-[10px] truncate max-w-[110px]" x-text="tag"></span>
                                </template>
                                <span x-show="(hymn.tags || []).length > 3" class="text-[10px] text-on-surface-variant" x-text="'+' + ((hymn.tags || []).length - 3)"></span>
                                <span x-show="!(hymn.tags || []).length" class="text-[11px] text-on-surface-variant/40">—</span>
                            </div>

                            <!-- Musical versions count (desktop) -->
                            <div class="hidden md:flex items-center justify-center gap-1 text-on-surface-variant" :title="(hymn.versions || []).length + ' musical arrangement(s)'">
                                <span class="material-symbols-outlined text-[16px]">queue_music</span>
                                <span class="text-sm font-medium" x-text="(hymn.versions || []).length"></span>
                            </div>

                            <!-- Actions -->
                            <div class="flex gap-1 md:justify-end transition-opacity duration-200"
                                 :class="selectedHymnId === hymn.id ? 'opacity-100 pointer-events-auto' : 'opacity-0 pointer-events-none group-hover:opacity-100 group-hover:pointer-events-auto'">
                                <button type="button" class="p-2 text-secondary hover:text-primary hover:bg-surface-container rounded-full transition-all" @click.stop="startEditHymn(hymn)" title="Edit">
                                    <span class="material-symbols-outlined text-sm">edit</span>
                                </button>
                                <button type="button" class="p-2 text-error/60 hover:text-error hover:bg-error-container/30 rounded-full transition-all" @click.stop="deleteHymn(hymn)" title="Delete">
                                    <span class="material-symbols-outlined text-sm">delete</span>
                                </button>
                            </div>
                        </div>
                    </template>
                </div>
                <div x-show="searchQuery && filteredHymns.length === 0" class="px-md py-12 text-center">
                    <span class="material-symbols-outlined text-[28px] text-on-surface-variant/40">search_off</span>
                    <p class="font-body-md text-sm text-on-surface-variant mt-2">No hymns match “<span class="font-medium text-on-surface" x-text="searchQuery"></span>”.</p>
                </div>
            </div>
        </div>

        <!-- Modal Overlay -->
        <div x-show="showFormModal" 
             x-cloak
             id="mgr-modal"
             class="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-primary/20 backdrop-blur-sm"
             x-transition:enter="transition ease-out duration-300"
             x-transition:enter-start="opacity-0"
             x-transition:enter-end="opacity-100"
             x-transition:leave="transition ease-in duration-200"
             x-transition:leave-start="opacity-100"
             x-transition:leave-end="opacity-0">
            
            <!-- The crop modal is a sibling of this card, not a child (the card
                 is overflow-hidden and could not contain it), so a click inside
                 the cropper reads as a click AWAY from the card. Without the
                 cropModal.open guard the first drag on the crop box closes the
                 hymn form underneath and resets formData, leaving the cropper
                 holding indexes into versions[] that no longer exist. -->
            <div id="mgr-modal-card" class="bg-surface-container-lowest border border-outline-variant/30 rounded-2xl shadow-2xl max-w-4xl w-full max-h-[90vh] flex flex-col overflow-hidden relative"
                 @click.away="!isSubmitting && !cropModal.open && closeForm()">

                <div id="mgr-modal-head" class="flex items-center justify-between p-md border-b border-outline-variant/20 bg-surface-container-low/50">
                    <div class="flex items-center gap-3">
                        <span class="material-symbols-outlined text-primary" x-text="isEditing ? 'edit_note' : 'add_circle'"></span>
                        <h2 class="font-headline-md text-xl text-primary tracking-tight" x-text="isEditing ? 'Edit Hymn Details' : 'Register New Hymn'"></h2>
                    </div>
                    <button @click="closeForm()" class="text-on-surface-variant hover:text-error transition-colors" :disabled="isSubmitting">
                        <span class="material-symbols-outlined">close</span>
                    </button>
                </div>

                <div id="mgr-modal-body" class="flex-1 overflow-y-auto p-lg scrollbar-thin">
                    <form id="add-hymn-form" @submit.prevent="handleSubmit" class="space-y-md">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-md">
                            <div class="flex flex-col gap-xs">
                                <label class="font-label-md text-[11px] uppercase tracking-widest text-on-surface-variant">Hymn Name</label>
                                <input type="text" x-model="formData.hymn_name" placeholder="Title of the hymn" required class="w-full py-2.5 px-4 bg-surface-container-low border border-outline-variant/50 rounded-lg focus:ring-1 focus:ring-tertiary-container transition-all outline-none font-body-md">
                            </div>
                            <div class="flex flex-col gap-xs">
                                <label class="font-label-md text-[11px] uppercase tracking-widest text-on-surface-variant">Music Writer</label>
                                <input type="text" x-model="formData.music_writer" placeholder="Composer" required class="w-full py-2.5 px-4 bg-surface-container-low border border-outline-variant/50 rounded-lg focus:ring-1 focus:ring-tertiary-container transition-all outline-none font-body-md">
                            </div>
                            <div class="flex flex-col gap-xs">
                                <label class="font-label-md text-[11px] uppercase tracking-widest text-on-surface-variant">Lyrics Writer</label>
                                <input type="text" x-model="formData.lyrics_writer" placeholder="Author/Lyricist" required class="w-full py-2.5 px-4 bg-surface-container-low border border-outline-variant/50 rounded-lg focus:ring-1 focus:ring-tertiary-container transition-all outline-none font-body-md">
                            </div>
                            <div class="flex flex-col gap-xs">
                                <label class="font-label-md text-[11px] uppercase tracking-widest text-on-surface-variant">Attribution</label>
                                <input type="text" x-model="formData.attribution" placeholder="e.g. Public Domain" required class="w-full py-2.5 px-4 bg-surface-container-low border border-outline-variant/50 rounded-lg focus:ring-1 focus:ring-tertiary-container transition-all outline-none font-body-md">
                            </div>
                        </div>
                        
                        <div class="flex flex-col gap-xs">
                            <label class="font-label-md text-[11px] uppercase tracking-widest text-on-surface-variant">Theological Tags</label>
                            <div class="tag-wrapper relative">
                                <div class="tag-container min-h-[48px] p-2 bg-surface-container-low border border-outline-variant/50 rounded-lg flex flex-wrap gap-2 items-center cursor-text transition-all focus-within:ring-1 focus-within:ring-tertiary-container" @click="$refs.tagInput.focus()">
                                    <template x-for="tag in formData.tags" :key="tag">
                                        <span class="bg-secondary-container text-on-secondary-container px-3 py-1 rounded-sm font-label-md text-xs flex items-center gap-2 group transition-all">
                                            <span x-text="tag"></span>
                                            <span class="material-symbols-outlined text-sm cursor-pointer hover:text-error transition-colors" @click.stop="removeTag(tag)">close</span>
                                        </span>
                                    </template>
                                    <input type="text" id="tag-input" x-ref="tagInput" x-model="tagInput" @input="updateSuggestions" @keydown.enter.prevent="addTag" @keydown.backspace="handleBackspace" placeholder="Type and press enter..." class="flex-1 bg-transparent border-none focus:ring-0 font-body-md p-1 min-w-[120px]" @click.away="suggestions = []">
                                </div>
                                <div class="suggestions-list absolute top-full left-0 w-full mt-1 bg-surface-container-lowest border border-outline-variant/30 rounded-lg shadow-lg z-50 max-h-48 overflow-y-auto" x-show="suggestions.length > 0" style="display: none;">
                                    <template x-for="suggestion in suggestions" :key="suggestion">
                                        <div class="p-3 hover:bg-surface-container-low cursor-pointer transition-colors font-body-md border-b border-surface-variant/10 last:border-0" x-text="suggestion" @click="addTagFromSuggestion(suggestion)"></div>
                                    </template>
                                </div>
                            </div>
                        </div>
                        
                        <div id="versions-container" class="space-y-md pt-md">
                            <div class="flex justify-between items-center border-b border-surface-variant/20 pb-base">
                                <h3 class="font-headline-md text-lg text-primary tracking-tight">Musical Versions</h3>
                                <button type="button" id="add-version" @click="addVersion" class="text-secondary hover:text-primary font-label-md text-xs uppercase tracking-widest flex items-center gap-1 transition-colors">
                                    <span class="material-symbols-outlined text-sm">add</span>
                                    Add New Arrangement
                                </button>
                            </div>

                            <template x-for="(version, vIndex) in formData.versions" :key="version.id">
                                <div class="bg-surface-container-low/50 border border-outline-variant/20 rounded-xl p-md space-y-md relative overflow-hidden">
                                    <div class="flex justify-between items-center">
                                        <div class="flex items-center gap-2">
                                            <span class="w-6 h-6 rounded-full bg-primary text-on-primary flex items-center justify-center font-label-md text-[10px]" x-text="vIndex + 1"></span>
                                            <input type="text" class="bg-transparent border-none focus:ring-0 font-headline-md text-primary p-0 text-lg placeholder:opacity-40" x-model="version.name" placeholder="Version Name (e.g. Traditional SATB)" required>
                                        </div>
                                        <button type="button" class="text-error/60 hover:text-error transition-colors p-1" @click="removeVersion(vIndex)">
                                            <span class="material-symbols-outlined text-sm">delete_sweep</span>
                                        </button>
                                    </div>

                                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-md">
                                        <template x-for="(page, pIndex) in version.pages" :key="page.id">
                                            <div class="bg-surface-container-lowest border border-outline-variant/30 rounded-lg p-md flex flex-col gap-md shadow-sm relative group">
                                                <div class="flex justify-between items-center">
                                                    <span class="m-label" x-text="'Sheet Page ' + (pIndex + 1)"></span>
                                                    <button type="button" class="text-error/40 hover:text-error transition-colors" @click="removePage(vIndex, pIndex)">
                                                        <span class="material-symbols-outlined text-sm">close</span>
                                                    </button>
                                                </div>

                                                <template x-if="page.url">
                                                    <div class="relative aspect-[3/4] bg-surface-container-low rounded border border-outline-variant/10 overflow-hidden group/img">
                                                        <img :src="page.url" class="w-full h-full object-cover">
                                                        <div class="absolute inset-0 bg-primary/40 opacity-0 group-hover/img:opacity-100 transition-opacity flex items-center justify-center">
                                                            <a :href="page.url" target="_blank" class="bg-surface-container-lowest text-primary p-2 rounded-full shadow-lg">
                                                                <span class="material-symbols-outlined">visibility</span>
                                                            </a>
                                                        </div>
                                                    </div>
                                                </template>

                                                <button type="button" x-show="page.url" @click="openCropper(vIndex, pIndex)"
                                                        class="flex items-center justify-center gap-1 border border-outline-variant/30 rounded-sm py-1 text-[10px] font-label-md uppercase tracking-widest text-on-surface-variant hover:text-primary hover:border-primary/40 transition-colors">
                                                    <span class="material-symbols-outlined text-sm">crop</span> Crop
                                                </button>

                                                <div class="flex flex-col gap-1">
                                                    <label class="font-label-md text-[9px] uppercase tracking-widest text-on-surface-variant" x-text="page.url ? 'Replace Sheet' : 'Upload Sheet'"></label>
                                                    <input type="file" class="text-[11px] file:mr-4 file:py-1 file:px-3 file:rounded-sm file:border-0 file:text-[10px] file:font-label-md file:bg-surface-container file:text-on-surface-variant hover:file:bg-surface-container-high cursor-pointer transition-all" accept="image/*" @change="handleFileChange($event, vIndex, pIndex)" :required="!page.url">
                                                </div>
                                            </div>
                                        </template>
                                        
                                        <!-- Add Page Button -->
                                        <button type="button" @click="addPage(vIndex)" class="border-2 border-dashed border-outline-variant/30 rounded-lg flex flex-col items-center justify-center gap-2 p-md hover:bg-surface-container-low hover:border-primary/20 transition-all text-on-surface-variant hover:text-primary min-h-[160px]">
                                            <span class="material-symbols-outlined text-2xl">add_photo_alternate</span>
                                            <span class="font-label-md text-[10px] uppercase tracking-widest">Add Page</span>
                                        </button>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </form>
                </div>

                <div id="mgr-modal-foot" class="p-md border-t border-surface-variant/20 bg-surface-container-low/50 flex justify-end items-center gap-md">
                    <button type="button" id="mgr-cancel-btn" @click="closeForm()" class="text-secondary hover:text-error font-label-md text-xs uppercase tracking-widest transition-colors" :disabled="isSubmitting">
                        Cancel
                    </button>
                    <button type="button" @click="handleSubmit()" :disabled="isSubmitting" class="bg-primary text-on-primary font-label-md text-label-md px-lg py-3 rounded-lg hover:bg-primary-container transition-all shadow-sm active:scale-[0.98] disabled:opacity-50 disabled:cursor-not-allowed flex items-center gap-2">
                        <span x-show="isSubmitting" class="w-4 h-4 border-2 border-on-primary/30 border-t-on-primary rounded-full animate-spin"></span>
                        <span x-text="isSubmitting ? (isEditing ? 'Syncing Changes...' : 'Creating Hymn...') : (isEditing ? 'Update Hymn' : 'Register Hymn')"></span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Crop modal: a box starting over the whole image, dragged inward
             by its corner handles (or moved by its middle) to select what to
             keep. Everything outside it is darkened to show what will be cut. -->
        <div x-show="cropModal.open" x-cloak @click.stop @mousedown.stop
             class="fixed inset-0 bg-primary/20 backdrop-blur-sm z-[110] flex items-center justify-center p-md">
            <div class="bg-surface-container-lowest rounded-xl shadow-2xl p-md flex flex-col gap-md max-w-[90vw]">
                <div class="flex justify-between items-center">
                    <h3 class="font-headline-md text-primary text-lg">Crop Sheet Page</h3>
                    <button type="button" @click="cancelCrop()" class="text-on-surface-variant hover:text-error transition-colors">
                        <span class="material-symbols-outlined">close</span>
                    </button>
                </div>
                <p class="font-body-sm text-on-surface-variant text-xs">Drag a handle to trim an edge, or drag inside the box to move it.</p>
                <div class="relative inline-block select-none" @mousemove.window="cropDragMove($event)" @mouseup.window="cropDragEnd()">
                    <img id="crop-target-img" :src="cropModal.imgSrc" @load="cropImageLoaded($event)"
                         draggable="false" class="block max-w-[80vw] max-h-[65vh]">
                    <template x-if="cropModal.rect">
                        <div class="absolute inset-0">
                            <!-- darkened mask outside the box, in four strips -->
                            <div class="absolute bg-black/60 pointer-events-none"
                                 :style="`left:0; top:0; right:0; height:${cropModal.rect.y}px;`"></div>
                            <div class="absolute bg-black/60 pointer-events-none"
                                 :style="`left:0; right:0; bottom:0; top:${cropModal.rect.y + cropModal.rect.h}px;`"></div>
                            <div class="absolute bg-black/60 pointer-events-none"
                                 :style="`left:0; top:${cropModal.rect.y}px; width:${cropModal.rect.x}px; height:${cropModal.rect.h}px;`"></div>
                            <div class="absolute bg-black/60 pointer-events-none"
                                 :style="`left:${cropModal.rect.x + cropModal.rect.w}px; top:${cropModal.rect.y}px; right:0; height:${cropModal.rect.h}px;`"></div>

                            <!-- the box: draggable to move, bordered so the kept area reads clearly -->
                            <div class="absolute border-2 border-white cursor-move"
                                 :style="`left:${cropModal.rect.x}px; top:${cropModal.rect.y}px; width:${cropModal.rect.w}px; height:${cropModal.rect.h}px;`"
                                 @mousedown="cropDragStart('move', $event)"></div>

                            <!-- corner handles -->
                            <template x-for="corner in ['nw', 'ne', 'sw', 'se']" :key="corner">
                                <div class="absolute w-3 h-3 rounded-full bg-white border-2 border-primary"
                                     :class="(corner === 'nw' || corner === 'se') ? 'cursor-nwse-resize' : 'cursor-nesw-resize'"
                                     :style="`left:${cropModal.rect.x + (corner.indexOf('e') !== -1 ? cropModal.rect.w : 0) - 6}px;
                                              top:${cropModal.rect.y + (corner.indexOf('s') !== -1 ? cropModal.rect.h : 0) - 6}px;`"
                                     @mousedown.stop="cropDragStart(corner, $event)"></div>
                            </template>
                        </div>
                    </template>
                </div>
                <div class="flex justify-end gap-md">
                    <button type="button" @click="cancelCrop()" class="text-secondary hover:text-error font-label-md text-xs uppercase tracking-widest transition-colors">
                        Cancel
                    </button>
                    <button type="button" @click="applyCrop()" :disabled="!cropModal.rect || cropModal.rect.w < 4"
                            class="bg-primary text-on-primary font-label-md text-label-md px-lg py-2 rounded-lg hover:bg-primary-container transition-all shadow-sm disabled:opacity-50 disabled:cursor-not-allowed">
                        Apply Crop
                    </button>
                </div>
            </div>
        </div>
    </main>
    <script src="manager.js"></script>
</body>
</html>
