<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Liturgy Orders · Mosaic</title>
    <link rel="stylesheet" href="mosaic.css" />
    <link rel="stylesheet" href="fonts.css" />

    <script src="mobile-shell.js"></script>
    <link rel="stylesheet" href="mobile-shell.css" />
    <script src="permission-catalog.js"></script>
    <script src="account-levels-core.js"></script>
    <script src="access-core.js"></script>
    <script src="mobile/destinations.js"></script>
    <script>window.MOBILE_HEADER = { title: 'Liturgy Orders', menu: false, back: '#back' };</script>
    <script src="person-photo-core.js"></script>
    <script src="mobile-shell-header.js"></script>
    <style>[x-cloak] { display: none !important; }</style>
</head>

<!-- Liturgy Orders (ADR-0080). The congregation's Liturgy Elements and the
     orders made of them, on one page. A Sunday picks its order on the Order
     of Service; this page decides what the orders are. -->
<body class="m-page m-page--tool lo-page" x-data="liturgyOrdersPage()" x-init="init()" x-cloak>

    <header class="m-header lo-header">
        <div class="m-header__inner">
            <div class="m-header__lead">
                <a class="m-back" id="back" :href="backHref">
                    <span class="material-symbols-outlined">chevron_left</span>
                    <span class="m-back__label" x-text="backLabel">Services</span>
                </a>
                <div class="m-header__titles"><h1 class="m-header__title">Liturgy Orders</h1></div>
            </div>
            <div class="m-header__actions" x-show="editing">
                <span class="lo-unsaved" x-show="dirty">Unsaved changes</span>
                <button type="button" class="m-btn m-btn--quiet m-btn--sm" x-show="dirty" @click="discard()">
                    <span class="m-btn__label">Discard</span>
                </button>
                <button type="button" id="liturgy-orders-save" class="m-btn m-btn--primary m-btn--sm" :disabled="!dirty || saving" @click="save()">
                    <span class="material-symbols-outlined" x-text="saving ? 'progress_activity' : 'save'"></span>
                    <span class="m-btn__label" x-text="saving ? 'Saving…' : 'Save'"></span>
                </button>
            </div>
            <div class="m-header__rule"></div>
            <div class="m-header__auth" id="auth-container"></div>
        </div>
    </header>

    <nav class="lo-tabs" aria-label="Liturgy orders" x-show="!loading && !problem">
        <template x-for="o in orders" :key="o.id">
            <button type="button" class="lo-tab"
                    :class="{ 'lo-tab--on': o.id === selectedOrderId }"
                    @click="selectOrder(o.id)"
                    x-text="o.name"></button>
        </template>
        <button type="button" class="lo-tab lo-tab--new" x-show="editing" @click="addOrder()">
            <span class="material-symbols-outlined" aria-hidden="true">add</span>
            <span>New order</span>
        </button>
    </nav>

    <main class="m-page__body lo-body">

        <div class="m-loading" x-show="loading"><span class="m-spinner m-spinner--lg"></span></div>

        <div class="m-notice m-notice--error" role="alert" x-show="!loading && problem">
            <span class="material-symbols-outlined m-notice__icon">error</span>
            <div class="m-notice__body"><span class="m-notice__text" x-text="problem"></span></div>
            <div class="m-notice__acts">
                <button type="button" class="m-btn m-btn--secondary m-btn--sm" @click="load()">Try again</button>
            </div>
        </div>

        <div class="lo-workspace" x-show="!loading">

            <div class="m-notice m-notice--error" role="alert" x-show="editProblem">
                <span class="material-symbols-outlined m-notice__icon">error</span>
                <div class="m-notice__body"><span class="m-notice__text" x-text="editProblem"></span></div>
            </div>

            <div class="m-notice m-notice--info" x-show="!canEdit && !problem">
                <span class="material-symbols-outlined m-notice__icon">visibility</span>
                <div class="m-notice__body"><span class="m-notice__text">Only an editor can change the liturgy orders.</span></div>
            </div>

            <aside class="lo-palette" aria-labelledby="palette-title" x-show="!problem">
                <h2 class="m-label lo-palette__title" id="palette-title" x-text="placeHint">Add to the end</h2>
                <div class="lo-palette__kinds">
                    <template x-for="kind in kinds" :key="kind">
                        <button type="button" class="lo-kind-btn" :disabled="!editing"
                                @click="placeKind(kind)"
                                :aria-label="'Add ' + kindLabel(kind) + ' after the selected element'">
                            <span class="material-symbols-outlined" aria-hidden="true" x-text="kindIcon(kind)"></span>
                            <span x-text="kindLabel(kind)"></span>
                        </button>
                    </template>
                </div>
            </aside>

            <section class="lo-canvas" aria-labelledby="order-canvas-title">
                <div class="lo-canvas__head">
                    <div class="lo-canvas__titles">
                        <input id="order-name" class="lo-order-name" type="text" maxlength="60"
                               x-model="orderName" @change="renameOrder()" @keydown.enter.prevent="$el.blur()"
                               :disabled="!editing" aria-labelledby="order-canvas-title" />
                        <p class="lo-order-sub" id="order-canvas-title" x-text="orderSubtitle()"></p>
                    </div>
                    <button type="button" class="m-btn m-btn--quiet m-btn--sm" x-show="editing && !isStandard" @click="deleteOrder()">
                        <span class="material-symbols-outlined">delete</span>
                        <span class="m-btn__label">Delete order</span>
                    </button>
                </div>

                <div class="lo-list" id="order-elements">
                    <div class="m-empty lo-list__empty" x-show="!orderElements.length">
                        <span class="material-symbols-outlined">list_alt</span>
                        <p>Add an element from the left.</p>
                    </div>
                    <template x-for="(el, index) in orderElements" :key="el.id">
                        <div class="lo-row" :data-order-row="el.id" :data-element-id="el.id"
                             :class="{ 'lo-row--on': inspectorElement && inspectorElement.id === el.id }"
                             @click="selectElement(el.id)">
                            <span class="material-symbols-outlined lo-row__handle" x-show="editing" title="Drag to move" aria-hidden="true">drag_indicator</span>
                            <span class="lo-row__num" x-text="index + 1"></span>
                            <span class="material-symbols-outlined lo-row__icon" aria-hidden="true" x-text="kindIcon(el.kind)"></span>
                            <span class="lo-row__main">
                                <span class="lo-row__name" x-text="el.name"></span>
                                <span class="lo-row__meta" x-show="elementMeta(el)" x-text="elementMeta(el)"></span>
                            </span>
                            <span class="lo-row__badge" x-text="kindLabel(el.kind)"></span>
                            <span class="material-symbols-outlined lo-row__note" x-show="el.hasNote" title="Takes a note on the Sunday">sticky_note_2</span>
                        </div>
                    </template>
                </div>
            </section>

            <aside class="lo-inspector" aria-labelledby="inspector-title">
                <div class="lo-inspector__scroll">
                    <div class="m-empty lo-inspector__empty" x-show="!inspectorElement">
                        <span class="material-symbols-outlined">touch_app</span>
                        <p>Pick an element to set it up.</p>
                    </div>

                    <template x-if="inspectorElement">
                        <div class="lo-inspector__panel">
                            <div class="lo-inspector__head">
                                <span class="lo-inspector__glyph">
                                    <span class="material-symbols-outlined" x-text="kindIcon(inspectorElement.kind)"></span>
                                </span>
                                <div class="lo-inspector__lead">
                                    <span class="m-label" id="inspector-title"
                                          x-text="kindLabel(inspectorElement.kind) + ' · No. ' + (inspectorIndex + 1)"></span>
                                    <span class="lo-inspector__title" x-text="inspectorElement.name"></span>
                                </div>
                                <span class="lo-inspector__acts" x-show="editing">
                                    <button type="button" class="m-icon-btn m-icon-btn--sm m-icon-btn--ghost"
                                            :disabled="inspectorIndex === 0" @click="move(inspectorIndex, -1, $event)"
                                            data-move="up" :aria-label="'Move ' + inspectorElement.name + ' up'">
                                        <span class="material-symbols-outlined">arrow_upward</span>
                                    </button>
                                    <button type="button" class="m-icon-btn m-icon-btn--sm m-icon-btn--ghost"
                                            :disabled="inspectorIndex >= orderElements.length - 1" @click="move(inspectorIndex, 1, $event)"
                                            data-move="down" :aria-label="'Move ' + inspectorElement.name + ' down'">
                                        <span class="material-symbols-outlined">arrow_downward</span>
                                    </button>
                                    <button type="button" class="m-icon-btn m-icon-btn--sm m-icon-btn--ghost"
                                            @click="removeFromOrder(inspectorElement.id)"
                                            :aria-label="'Take ' + inspectorElement.name + ' out of this order'">
                                        <span class="material-symbols-outlined">remove_circle_outline</span>
                                    </button>
                                </span>
                            </div>

                            <template x-if="takesName(inspectorElement.kind)">
                                <label class="m-field">
                                    <span class="m-label">Name</span>
                                    <input class="m-input" type="text" maxlength="60" :value="inspectorElement.name"
                                           :disabled="!editing" :aria-label="'Name of this ' + kindLabel(inspectorElement.kind)"
                                           @change="renameElement(inspectorElement.id, $event)" @keydown.enter.prevent="$el.blur()" />
                                </label>
                            </template>
                            <p class="lo-hint" x-show="inspectorElement.kind === 'hymn'">A hymn takes no name here. The Sunday picks it from the book.</p>

                            <label class="m-check">
                                <input type="checkbox" :checked="inspectorElement.hasNote" :disabled="!editing"
                                       @change="updateElement(inspectorElement.id, { hasNote: $event.target.checked })" />
                                <span>Takes a note on the Sunday</span>
                            </label>

                            <template x-if="inspectorElement.kind === 'prayer'">
                                <div class="lo-prayer">
                                    <span class="m-label">Who prays, and for whom</span>
                                    <label class="m-check">
                                        <input type="checkbox" :checked="!!inspectorElement.prayedByOther" :disabled="!editing"
                                               @change="updateElement(inspectorElement.id, { prayedByOther: $event.target.checked })" />
                                        <span>Someone other than the service leader may pray it</span>
                                    </label>
                                    <label class="m-check">
                                        <input type="checkbox" :checked="!!inspectorElement.requests" :disabled="!editing"
                                               @change="toggleRequests(inspectorElement, $event.target.checked)" />
                                        <span>Send prayer requests</span>
                                    </label>

                                    <template x-if="inspectorElement.requests">
                                        <div class="lo-person">
                                            <template x-for="(person, pindex) in inspectorElement.requests.people" :key="inspectorElement.id + '-' + pindex">
                                                <div class="lo-person__line">
                                                    <span class="lo-person__n" x-text="'Person ' + (pindex + 1)"></span>
                                                    <div class="m-seg m-seg--fill" role="group" :aria-label="'Who person ' + (pindex + 1) + ' is for ' + inspectorElement.name">
                                                        <template x-for="opt in whoOptions" :key="opt.value">
                                                            <button type="button" class="m-seg__opt" :disabled="!editing"
                                                                    @click="setPersonWho(inspectorElement, pindex, opt.value)"
                                                                    :aria-pressed="person.who === opt.value"
                                                                    x-text="opt.label"></button>
                                                        </template>
                                                    </div>
                                                    <button type="button" class="m-icon-btn m-icon-btn--sm m-icon-btn--ghost"
                                                            :disabled="!editing || inspectorElement.requests.people.length <= 1"
                                                            @click="removePerson(inspectorElement, pindex)"
                                                            :aria-label="'Remove person ' + (pindex + 1)">
                                                        <span class="material-symbols-outlined">close</span>
                                                    </button>
                                                </div>
                                            </template>
                                            <button type="button" class="lo-person__add" x-show="editing"
                                                    @click="addPerson(inspectorElement)"
                                                    :disabled="inspectorElement.requests.people.length >= 12">
                                                <span class="material-symbols-outlined" aria-hidden="true">add</span>
                                                Add a person
                                            </button>
                                        </div>

                                        <div class="lo-days">
                                            <span class="m-label">Days before the Sunday</span>
                                            <div class="lo-days__list">
                                                <template x-for="day in (inspectorElement.noticeDays || []).slice().sort((a,b)=>b-a)" :key="day">
                                                    <span class="m-token">
                                                        <span x-text="day"></span>
                                                        <button type="button" class="m-icon-btn m-icon-btn--sm m-icon-btn--ghost" x-show="editing"
                                                                @click="removeDay(inspectorElement, day)"
                                                                :aria-label="'Take day ' + day + ' off ' + inspectorElement.name">
                                                            <span class="material-symbols-outlined">close</span>
                                                        </button>
                                                    </span>
                                                </template>
                                                <input class="m-input lo-days__input" type="number" min="1" max="30" inputmode="numeric"
                                                       placeholder="Day" :disabled="!editing"
                                                       :aria-label="'Add a day for ' + inspectorElement.name"
                                                       :value="dayDrafts[inspectorElement.id] || ''"
                                                       @input="dayDrafts[inspectorElement.id] = $event.target.value"
                                                       @keydown.enter.prevent="addDay(inspectorElement)" />
                                                <button type="button" class="m-btn m-btn--quiet m-btn--sm" x-show="editing" @click="addDay(inspectorElement)">
                                                    <span class="m-btn__label">Add</span>
                                                </button>
                                            </div>
                                            <span class="lo-hint">A text or a push goes out on each day. No days, nothing goes out.</span>
                                        </div>

                                        <label class="m-field">
                                            <span class="m-label">Message</span>
                                            <textarea id="prayer-message" class="m-input lo-textarea" rows="4" maxlength="1000"
                                                      :value="inspectorElement.message || ''"
                                                      :disabled="!editing"
                                                      placeholder="Blank uses the built-in message"
                                                      @change="updateElement(inspectorElement.id, { message: $event.target.value })"></textarea>
                                            <span class="lo-hint">{name} is their first name. {link} is where they answer.</span>
                                        </label>
                                        <label class="m-field">
                                            <span class="m-label">Response</span>
                                            <textarea id="prayer-response" class="m-input lo-textarea" rows="3" maxlength="1000"
                                                      :value="inspectorElement.response || ''"
                                                      :disabled="!editing"
                                                      placeholder="Blank uses the built-in thank-you"
                                                      @change="updateElement(inspectorElement.id, { response: $event.target.value })"></textarea>
                                            <span class="lo-hint">Sent back when they reply.</span>
                                        </label>
                                    </template>
                                </div>
                            </template>
                        </div>
                    </template>
                </div>
            </aside>
        </div>

        <div class="m-toast lo-toast" role="status" x-show="toast" x-transition x-text="toast"></div>
    </main>

    <script src="vendor/firebase/firebase-app-compat.js"></script>
    <script src="vendor/firebase/firebase-auth-compat.js"></script>
    <script src="vendor/firebase/firebase-firestore-compat.js"></script>
    <script src="local-cache.js"></script>
    <script src="firebase-config.js"></script>
    <script src="auth.js"></script>

    <script src="dashboard-nav.js"></script>
    <script src="drawer-who.js"></script>
    <script src="desktop-drawer.js"></script>
    <script src="desktop-header-lead.js"></script>
    <script src="desktop-nav-boot.js"></script>
    <script src="vendor/sortable-1.15.0.min.js"></script>
    <script src="liturgy-order-core.js"></script>
    <script src="liturgy-order-store.js"></script>
    <script src="liturgy-orders.js"></script>
    <script defer src="vendor/alpine-3.15.12.min.js"></script>

    <style>
        .lo-page.m-page--tool { --lo-header-h: 64px; }
        .lo-page .m-page__body { flex: 1 1 auto; min-height: 0; overflow: hidden; display: flex; flex-direction: column; padding: 0; }
        .lo-header .m-header__title { font-family: var(--font-display); letter-spacing: .02em; color: var(--primary); }
        .lo-unsaved { font-size: 13px; color: var(--on-surface-variant); margin-right: var(--space-xs); }
        .lo-tabs {
            flex: 0 0 auto; display: flex; align-items: flex-end; gap: 4px; padding: 0 var(--space-lg);
            background: var(--surface-container-lowest); border-bottom: 1px solid var(--outline-variant);
        }
        .lo-tab {
            height: 46px; padding: 0 16px; border: 0; border-bottom: 2px solid transparent;
            background: transparent; font-family: var(--font-serif); font-size: 17px;
            color: var(--on-surface-variant); cursor: pointer;
        }
        .lo-tab--on { color: var(--primary); border-bottom-color: var(--primary); font-weight: 600; }
        .lo-tab--new {
            display: inline-flex; align-items: center; gap: 4px; padding: 0 12px;
            font-family: var(--font-sans); font-size: 12px; font-weight: 600; letter-spacing: .14em;
            text-transform: uppercase; color: var(--secondary);
        }
        .lo-tab--new .material-symbols-outlined { font-size: 18px; }
        .lo-body { position: relative; flex: 1 1 auto; min-height: 0; }
        .lo-workspace {
            flex: 1 1 auto; min-height: 0; display: grid;
            grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr);
            gap: 0; overflow: hidden;
        }
        .lo-workspace > .m-notice { margin: var(--space-sm) var(--space-lg) 0; }
        .lo-palette {
            display: none;
        }
        .lo-canvas {
            min-height: 0; display: flex; flex-direction: column; gap: var(--space-md);
            padding: var(--space-lg) var(--space-lg) 0; overflow: hidden;
        }
        .lo-canvas__head { display: flex; align-items: flex-end; gap: var(--space-sm); }
        .lo-canvas__titles { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
        .lo-order-name {
            width: 100%; border: 0; border-bottom: 1px solid transparent; background: transparent; padding: 0;
            font-family: var(--font-serif); font-size: 28px; color: var(--on-surface); outline: none;
        }
        .lo-order-name:focus { border-bottom-color: var(--outline-variant); }
        .lo-order-name:disabled { opacity: 1; }
        .lo-order-sub { margin: 0; font-size: 13px; color: var(--on-surface-variant); }
        .lo-list {
            flex: 1 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain;
            border: 1px solid var(--outline-variant); border-radius: var(--radius);
            background: var(--surface-container-lowest); margin-bottom: var(--space-lg);
        }
        .lo-list__empty { padding: 48px 0; }
        .lo-row {
            display: flex; align-items: center; gap: 12px; min-height: 52px;
            padding: 6px 14px 6px 8px; border-bottom: 1px solid var(--outline-variant);
            cursor: pointer; background: transparent;
        }
        .lo-row:last-child { border-bottom: 0; }
        .lo-row--on { background: var(--secondary-container); }
        .lo-row__handle { font-size: 18px; color: var(--outline); cursor: grab; flex: 0 0 auto; }
        .lo-row__handle:active { cursor: grabbing; }
        .lo-row__num { width: 20px; text-align: right; font-size: 13px; color: var(--on-surface-variant); font-variant-numeric: tabular-nums; flex: 0 0 auto; }
        .lo-row__icon { font-size: 18px; color: var(--secondary); flex: 0 0 auto; }
        .lo-row__main { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; }
        .lo-row__name { font-family: var(--font-serif); font-size: 18px; line-height: 1.25; color: var(--on-surface); }
        .lo-row__meta { font-size: 12.5px; color: var(--on-surface-variant); }
        .lo-row__badge {
            font-size: 11px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase;
            color: var(--on-surface-variant); flex: 0 0 auto;
        }
        .lo-row__note { font-size: 17px; color: var(--secondary); flex: 0 0 auto; }
        .lo-inspector {
            min-height: 0; display: flex; flex-direction: column;
            border-top: 1px solid var(--outline-variant); background: var(--surface-container-lowest);
        }
        .lo-inspector__scroll { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 22px var(--space-lg); }
        .lo-inspector__empty { padding-top: 48px; }
        .lo-inspector__panel { display: flex; flex-direction: column; gap: 18px; }
        .lo-inspector__head { display: flex; align-items: center; gap: 12px; }
        .lo-inspector__glyph {
            flex: 0 0 38px; height: 38px; border-radius: var(--radius);
            background: var(--secondary-container); color: var(--on-secondary-container);
            display: grid; place-items: center;
        }
        .lo-inspector__glyph .material-symbols-outlined { font-size: 20px; }
        .lo-inspector__lead { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; }
        .lo-inspector__title { font-family: var(--font-serif); font-size: 22px; color: var(--on-surface); }
        .lo-inspector__acts { display: flex; align-items: center; gap: 2px; flex: 0 0 auto; }
        .lo-hint { display: block; margin-top: var(--space-xs); font-size: 12.5px; line-height: 1.45; color: var(--on-surface-variant); white-space: normal; }
        .lo-textarea { height: auto; padding-top: 10px; resize: vertical; }
        .lo-prayer { display: flex; flex-direction: column; gap: 12px; padding-top: 16px; border-top: 1px solid var(--outline-variant); }
        .lo-person { display: flex; flex-direction: column; gap: 8px; }
        .lo-person__line { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .lo-person__n {
            flex: 0 0 64px; font-size: 12px; font-weight: 600; letter-spacing: .1em;
            text-transform: uppercase; color: var(--on-surface-variant);
        }
        .lo-person__line .m-seg { flex: 1 1 180px; }
        .lo-person__add {
            align-self: flex-start; display: inline-flex; align-items: center; gap: var(--space-xs);
            min-height: 36px; padding: 0 var(--space-sm); background: transparent; border: 0;
            color: var(--secondary); font-family: var(--font-sans); font-size: 13px; font-weight: 600; cursor: pointer;
        }
        .lo-person__add:disabled { opacity: .4; cursor: default; }
        .lo-days { display: flex; flex-direction: column; gap: 8px; }
        .lo-days__list { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
        .lo-days__input { width: 76px; height: 36px; font-size: 14px; }
        .lo-palette__title { padding: 0 4px; }
        .lo-palette__kinds { display: flex; flex-direction: column; gap: 6px; }
        .lo-kind-btn {
            display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 12px;
            border: 1px solid var(--outline-variant); border-radius: var(--radius-sm);
            background: var(--surface-container-lowest); color: var(--on-surface);
            font: 500 13.5px var(--font-sans); cursor: pointer; text-align: left;
        }
        .lo-kind-btn .material-symbols-outlined { font-size: 18px; color: var(--secondary); }
        .lo-kind-btn:disabled { opacity: .55; cursor: default; }
        .lo-toast { position: absolute; left: 50%; bottom: 24px; transform: translateX(-50%); }
        .sortable-ghost { opacity: .4; }
        @media (min-width: 1024px) {
            .lo-workspace {
                grid-template-columns: 200px minmax(0, 1fr) 380px;
                grid-template-rows: minmax(0, 1fr);
            }
            .lo-workspace > .m-notice { grid-column: 1 / -1; }
            .lo-palette {
                display: flex; flex-direction: column; gap: 10px; padding: 20px 14px;
                border-right: 1px solid var(--outline-variant); background: var(--surface-container-low);
