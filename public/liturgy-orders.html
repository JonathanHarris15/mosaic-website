<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Liturgy Orders · Mosaic</title>
    <link rel="stylesheet" href="mosaic.css" />
    <link rel="stylesheet" href="fonts.css" />

    <script src="mobile-shell.js"></script>
    <link rel="stylesheet" href="mobile-shell.css" />
    <script src="permission-catalog.js"></script>
    <script src="account-levels-core.js"></script>
    <script src="access-core.js"></script>
    <script src="mobile/destinations.js"></script>
    <script>window.MOBILE_HEADER = { title: 'Liturgy Orders', menu: false, back: '#back' };</script>
    <script src="person-photo-core.js"></script>
    <script src="mobile-shell-header.js"></script>
    <style>[x-cloak] { display: none !important; }</style>
</head>

<!-- Liturgy Orders (ADR-0080). The congregation's Liturgy Elements and the
     orders made of them, on one page. A Sunday picks its order on the Order
     of Service; this page decides what the orders are. -->
<body class="m-page m-page--tool" x-data="liturgyOrdersPage()" x-init="init()" x-cloak>

    <header class="m-header">
        <div class="m-header__inner">
            <div class="m-header__lead">
                <a class="m-back" :href="backHref">
                    <span class="material-symbols-outlined">chevron_left</span>
                    <span class="m-back__label" x-text="backLabel">Services</span>
                </a>
                <div class="m-header__titles"><h1 class="m-header__title">Liturgy Orders</h1></div>
            </div>
            <div class="m-header__actions" x-show="editing">
                <button type="button" class="m-btn m-btn--quiet m-btn--sm" x-show="dirty" @click="discard()">
                    <span class="m-btn__label">Discard</span>
                </button>
                <button type="button" id="liturgy-orders-save" class="m-btn m-btn--primary m-btn--sm" :disabled="!dirty || saving" @click="save()">
                    <span class="material-symbols-outlined" x-text="saving ? 'progress_activity' : 'save'"></span>
                    <span class="m-btn__label" x-text="saving ? 'Saving…' : 'Save'"></span>
                </button>
            </div>
            <div class="m-header__rule"></div>
            <div class="m-header__auth" id="auth-container"></div>
        </div>
    </header>

    <main class="m-page__body">

        <div class="m-loading" x-show="loading"><span class="m-spinner m-spinner--lg"></span></div>

        <div class="m-notice m-notice--error" role="alert" x-show="!loading && problem">
            <span class="material-symbols-outlined m-notice__icon">error</span>
            <div class="m-notice__body"><span class="m-notice__text" x-text="problem"></span></div>
            <div class="m-notice__acts">
                <button type="button" class="m-btn m-btn--secondary m-btn--sm" @click="load()">Try again</button>
            </div>
        </div>

        <div class="lo-stack" x-show="!loading">

            <div class="m-notice m-notice--error" role="alert" x-show="editProblem">
                <span class="material-symbols-outlined m-notice__icon">error</span>
                <div class="m-notice__body"><span class="m-notice__text" x-text="editProblem"></span></div>
            </div>

            <div class="m-notice m-notice--info" x-show="!canEdit && !problem">
                <span class="material-symbols-outlined m-notice__icon">visibility</span>
                <div class="m-notice__body"><span class="m-notice__text">Only an editor can change the liturgy orders.</span></div>
            </div>

            <div class="lo-grid">

                <!-- ── Elements: the five kinds, to the left of the order ── -->
                <section class="m-section lo-kinds" aria-labelledby="elements-title">
                    <div class="m-section__head">
                        <h2 class="m-section__title" id="elements-title">Elements</h2>
                    </div>

                    <div class="m-card-list" id="element-library" :class="editing ? 'lo-library--drag' : ''">
                        <template x-for="kind in kinds" :key="kind">
                            <div class="m-row" data-library-item :data-kind="kind">
                                <span class="material-symbols-outlined m-row__handle" x-show="editing" title="Drag into the order" aria-hidden="true">drag_indicator</span>
                                <span class="m-row__main">
                                    <span class="m-row__title" x-text="kindLabel(kind)"></span>
                                    <span class="m-row__sub" x-text="kind === 'hymn' ? 'A hymn from the book, on the Sunday' : kind === 'scripture' ? 'A name here, and a reference on the Sunday' : kind === 'prayer' ? 'A name here. Prayer requests are optional.' : kind === 'person' ? 'A name here, and a person on the Sunday' : 'A name here, and nothing on the Sunday'"></span>
                                </span>
                                <button type="button" class="m-btn m-btn--secondary m-btn--sm" x-show="editing" @click="placeKind(kind)"
                                        :aria-label="'Add ' + kindLabel(kind) + ' to ' + selectedOrder.name">
                                    <span class="m-btn__label">Add</span>
                                </button>
                            </div>
                        </template>
                    </div>
                </section>

                <!-- ── The order being edited ──────────────────────────── -->
                <section class="m-section lo-order" aria-labelledby="order-title">
                    <div class="m-section__head">
                        <h2 class="m-section__title" id="order-title">Order</h2>
                    </div>

                    <div class="lo-order-bar">
                        <span class="m-select-wrap">
                            <select id="order-picker" class="m-select" aria-labelledby="order-title"
                                    :value="selectedOrderId" @change="selectOrder($event.target.value)">
                                <template x-for="o in orders" :key="o.id">
                                    <option :value="o.id" x-text="o.id === 'standard' ? o.name + ' (default)' : o.name"></option>
                                </template>
                            </select>
                        </span>
                        <button type="button" class="m-icon-btn m-icon-btn--lg m-icon-btn--outline" x-show="editing" @click="addOrder()" aria-label="New order">
                            <span class="material-symbols-outlined" aria-hidden="true">add</span>
                        </button>
                    </div>

                    <div class="m-card lo-form">
                        <label class="m-field">
                            <span class="m-label">Name</span>
                            <input id="order-name" class="m-input" type="text" maxlength="60" x-model="orderName" @change="renameOrder()" @keydown.enter.prevent="$el.blur()" :disabled="!editing" />
                        </label>
                    </div>

                    <div class="m-card-list" id="order-elements">
                        <div class="m-empty" x-show="!orderElements.length">
                            <span class="material-symbols-outlined">list_alt</span>
                            <p>Drag an element here, or add one.</p>
                        </div>
                        <template x-for="(el, index) in orderElements" :key="el.id">
                            <div class="m-row" :data-order-row="el.id" :data-element-id="el.id">
                                <span class="material-symbols-outlined m-row__handle" x-show="editing" title="Drag to move" aria-hidden="true">drag_indicator</span>
                                <span class="lo-num" x-text="index + 1"></span>
                                <span class="m-row__main">
                                    <template x-if="takesName(el.kind)">
                                        <input class="m-input lo-element__name" type="text" maxlength="60" :value="el.name"
                                               :aria-label="'Name of this ' + kindLabel(el.kind)" :disabled="!editing"
                                               @change="renameElement(el.id, $event)" @keydown.enter.prevent="$el.blur()" />
                                    </template>
                                    <span class="m-row__title" x-show="!takesName(el.kind)" x-text="el.name"></span>
                                    <span class="m-row__sub" x-text="kindLabel(el.kind) + (el.hasNote ? ' · note' : '')"></span>
                                    <label class="m-check" x-show="editing && el.kind === 'prayer'">
                                        <input type="checkbox" :checked="!!el.prayedByOther" @change="updateElement(el.id, { prayedByOther: $event.target.checked })" />
                                        <span>Prayed by someone other than the service leader</span>
                                    </label>
                                    <label class="m-check" x-show="editing && el.kind === 'prayer'">
                                        <input type="checkbox" :checked="!!el.requests" @change="updateElement(el.id, { requests: $event.target.checked ? { count: 1, who: 'either' } : null })" />
                                        <span>Send prayer requests</span>
                                    </label>
                                    <template x-if="editing && el.kind === 'prayer' && el.requests">
                                        <span class="lo-prayer">
                                            <label class="m-field">
                                                <span class="m-label">How many</span>
                                                <input class="m-input" type="number" min="1" max="12"
                                                       :aria-label="'How many people for ' + el.name"
                                                       x-model.number="el.requests.count" @change="clampRequests(el)" />
                                            </label>
                                            <label class="m-field">
                                                <span class="m-label">Who</span>
                                                <span class="m-select-wrap">
                                                    <select class="m-select" :aria-label="'Who ' + el.name + ' asks'"
                                                        :value="el.requests.who"
                                                        @change="updateElement(el.id, { requests: { count: el.requests.count, who: $event.target.value } })">
                                                    <option value="either">Either</option>
                                                    <option value="male">Male</option>
                                                    <option value="female">Female</option>
                                                </select>
                                                </span>
                                            </label>
                                        </span>
                                    </template>
                                </span>
                                <label class="m-check" x-show="editing">
                                    <input type="checkbox" :checked="el.hasNote" @change="updateElement(el.id, { hasNote: $event.target.checked })" />
                                    <span>Note</span>
                                </label>
                                <span class="lo-acts" x-show="editing">
                                    <button type="button" class="m-icon-btn m-icon-btn--sm m-icon-btn--ghost" data-move="up"
                                            :disabled="index === 0" @click="move(index, -1, $event)"
                                            :aria-label="'Move ' + el.name + ' up'">
                                        <span class="material-symbols-outlined">arrow_upward</span>
                                    </button>
                                    <button type="button" class="m-icon-btn m-icon-btn--sm m-icon-btn--ghost" data-move="down"
                                            :disabled="index === orderElements.length - 1" @click="move(index, 1, $event)"
                                            :aria-label="'Move ' + el.name + ' down'">
                                        <span class="material-symbols-outlined">arrow_downward</span>
                                    </button>
                                    <button type="button" class="m-icon-btn m-icon-btn--sm m-icon-btn--ghost" @click="removeFromOrder(el.id)"
                                            :aria-label="'Take ' + el.name + ' out of this order'" title="Take out of this order">
                                        <span class="material-symbols-outlined">remove_circle_outline</span>
                                    </button>
                                </span>
                            </div>
                        </template>
                    </div>

                    <div x-show="editing && !isStandard">
                        <button type="button" class="m-btn m-btn--danger-outline m-btn--sm" @click="deleteOrder()">
                            <span class="material-symbols-outlined">delete</span>
                            <span class="m-btn__label">Delete this order</span>
                        </button>
                    </div>
                </section>
            </div>

        </div>

        <div class="m-toast" role="status" x-show="toast" x-transition x-text="toast"></div>
    </main>

    <script src="vendor/firebase/firebase-app-compat.js"></script>
    <script src="vendor/firebase/firebase-auth-compat.js"></script>
    <script src="vendor/firebase/firebase-firestore-compat.js"></script>
    <script src="local-cache.js"></script>
    <script src="firebase-config.js"></script>
    <script src="auth.js"></script>

    <script src="dashboard-nav.js"></script>
        <script src="drawer-who.js"></script>
<script src="desktop-drawer.js"></script>
    <script src="desktop-header-lead.js"></script>
    <script src="desktop-nav-boot.js"></script>
    <script src="vendor/sortable-1.15.0.min.js"></script>
    <script src="liturgy-order-core.js"></script>
    <script src="liturgy-order-store.js"></script>
    <script src="liturgy-orders.js"></script>
    <script defer src="vendor/alpine-3.15.12.min.js"></script>

    <style>
        .m-page--tool .m-page__body { flex: 1 1 auto; min-height: 0; overflow: hidden; }
        .lo-stack { display: flex; flex-direction: column; gap: var(--space-lg); flex: 1 1 auto; min-height: 0; overflow: hidden; }
        .lo-grid {
            display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr);
            gap: var(--space-lg); align-items: stretch; flex: 1 1 auto; min-height: 0; overflow: hidden;
        }
        @media (min-width: 1024px) {
            .lo-grid { grid-template-columns: 280px minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); }
        }
        .lo-kinds { min-height: 0; overflow: hidden; }
        .lo-order { min-height: 0; height: 100%; overflow: hidden; }
        #order-elements { flex: 1 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain; }
        .lo-order-bar { display: flex; align-items: flex-end; gap: var(--space-sm); }
        .lo-order-bar > .m-select-wrap { flex: 1 1 auto; min-width: 0; }
        .lo-library--drag [data-library-item] { cursor: grab; }
        .lo-library--drag [data-library-item]:active { cursor: grabbing; }
        .lo-form { display: flex; flex-direction: column; gap: var(--space-sm); }
        .lo-form--row { flex-direction: row; flex-wrap: wrap; align-items: flex-end; }
        .lo-form--row .m-field { flex: 1 1 200px; }
        .lo-form--row .lo-grow { flex: 2 1 240px; }
        .lo-form > .m-btn { align-self: flex-start; }
        .lo-form--row > .m-btn { align-self: flex-end; }
        .lo-prayer { display: flex; flex-wrap: wrap; gap: var(--space-sm); margin-top: var(--space-xs); }
        .lo-prayer .m-field { flex: 1 1 8rem; }
        .lo-stack .m-row__main, .lo-stack .m-row__title, .lo-stack .m-row__sub { display: block; }
        .lo-stack .m-card-list > .m-row:last-of-type { border-bottom: 0; }
        .lo-num { flex: 0 0 1.5rem; text-align: right; font-size: 13px; color: var(--on-surface-variant); font-variant-numeric: tabular-nums; }
        .lo-acts { display: flex; align-items: center; gap: 2px; flex: 0 0 auto; }
        .lo-element { flex-wrap: wrap; }
        .lo-element__main { flex: 1 1 240px; }
        .lo-element__name { height: 40px; }
        .lo-element__flags { display: flex; align-items: center; flex-wrap: wrap; gap: var(--space-sm); }
        .sortable-ghost { opacity: .4; }
    </style>
</body>
</html>
