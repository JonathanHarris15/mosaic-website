<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Printable · Mosaic</title>
    <link rel="stylesheet" href="mosaic.css" />
    <link rel="stylesheet" href="fonts.css" />

    <script src="mobile-shell.js"></script>
    <link rel="stylesheet" href="mobile-shell.css" />
    <script>window.MOBILE_HEADER = { title: 'Printable', menu: false, back: '#back', route: 'home' };</script>
    <script src="person-photo-core.js"></script>
    <script src="mobile-shell-header.js"></script>
    <style>[x-cloak] { display: none !important; }</style>
</head>

<body class="m-page pv-body" x-data="printableView()" x-init="init()" x-cloak>

    <header class="m-header m-header--compact m-header--sticky pv-header">
        <div class="m-header__inner">
            <div class="m-header__lead">
                <a href="javascript:history.back()" class="m-back">
                    <span class="material-symbols-outlined">chevron_left</span>
                    <span class="m-back__label">Back</span>
                </a>
                <div class="m-header__titles">
                    <h1 class="m-header__title m-header__title--serif" x-text="project ? project.name : 'Printable'"></h1>
                </div>
            </div>
            <div class="m-header__actions">
                <span class="m-header__chip" x-show="viewDate" x-text="'As of ' + viewDate"
                      style="font-size:13px; color:var(--on-surface-variant);"></span>
                <span class="m-header__chip" x-show="template"
                      x-text="template ? (template.label + (entries.length ? ' · ' + entries.length + ' page' + (entries.length === 1 ? '' : 's') + (bookletPadCount ? ' · print ' + printPageCount + ' (padded ×4)' : '') : '')) : ''"
                      style="font-size:13px; color:var(--on-surface-variant); max-width:36ch; overflow:hidden; text-overflow:ellipsis;"></span>
                <button type="button" class="m-btn m-btn--secondary m-btn--sm" x-show="warnings.length" @click="showWarnings = !showWarnings" title="Not all data could be pulled">
                    <span class="material-symbols-outlined">warning</span><span class="m-btn__label" x-text="warnings.length + ' gap' + (warnings.length === 1 ? '' : 's')"></span>
                </button>
                <a :href="editorHref" x-show="canEdit" class="m-btn m-btn--secondary m-btn--sm"><span class="material-symbols-outlined">edit</span><span class="m-btn__label">Open in editor</span></a>
                <button type="button" class="m-btn m-btn--secondary m-btn--sm m-btn--named" @click="printFolio()" :disabled="!entries.length" aria-label="Print folio" :title="folioTitle"><span class="material-symbols-outlined" aria-hidden="true">menu_book</span><span class="m-btn__label">Folio</span></button>
                <button type="button" class="m-btn m-btn--primary m-btn--sm m-btn--named" @click="printPrintable()" :disabled="!entries.length" aria-label="Print" :title="wantsBookletExport ? 'Flat pages padded to a multiple of 4. Use the copier\'s Booklet / Saddle mode.' : 'Print these pages as they stand.'"><span class="material-symbols-outlined" aria-hidden="true">print</span><span class="m-btn__label">Print</span></button>
            </div>
            <div class="m-header__rule"></div>
            <div class="m-header__auth" id="auth-container"></div>
        </div>
    </header>

    <main class="m-page__body pv-main">
        <div class="m-loading" x-show="loading"><span class="m-spinner m-spinner--lg"></span></div>
        <div class="m-notice m-notice--error" x-show="problem">
            <span class="material-symbols-outlined m-notice__icon">error</span>
            <div class="m-notice__body"><span class="m-notice__text" x-text="problem"></span></div>
        </div>
        <div class="m-notice m-notice--warning" x-show="showWarnings && warnings.length">
            <span class="material-symbols-outlined m-notice__icon">warning</span>
            <div class="m-notice__body">
                <span class="m-notice__title">Not all data could be pulled</span>
                <template x-for="(w, i) in warnings" :key="i"><span class="m-notice__text pv-warn" x-text="w.label + ': ' + w.message"></span></template>
            </div>
        </div>
        <div id="pv-pages" class="pv-pages" x-show="!loading && !problem"></div>
        <div id="pv-measure" class="pv-measure"></div>
    </main>

    <div id="pv-print" class="pv-print"></div>

    <div class="pv-scrim" x-show="folioPadOpen" x-cloak @click.self="closeFolioPad()" @keydown.escape.window="closeFolioPad()">
        <div class="pv-dialog" role="dialog" aria-modal="true" aria-labelledby="pv-folio-pad-title">
            <h2 id="pv-folio-pad-title" class="m-headline-lg">Fill the folio fold</h2>
            <p class="pv-dialog__hint">A folded booklet needs a multiple of 4 pages. You have <strong x-text="folioPadBaseCount"></strong> — add <strong x-text="folioPadNeedCount"></strong> temporary page<span x-show="folioPadNeedCount !== 1">s</span> for this print only. Nothing is saved on the printable.</p>
            <p class="m-notice m-notice--error" x-show="folioPadError" x-text="folioPadError" aria-live="polite"></p>
            <ol class="pv-folio-stack" aria-label="Print stack for folio">
                <template x-for="(row, i) in folioPadRows" :key="row.key">
                    <li class="pv-folio-stack__row" :class="{ 'is-pad': row.folioPad }">
                        <span class="pv-folio-stack__label" x-text="row.label"></span>
                        <button type="button" class="m-btn m-btn--quiet m-btn--sm" x-show="row.folioPad" @click="removeFolioPadRow(i)">Remove</button>
                    </li>
                </template>
            </ol>
            <div class="pv-folio-add" x-show="folioPadNeedCount > 0">
                <label class="pv-folio-field">
                    <span>Duplicate</span>
                    <select class="m-input" name="folioPadSource" autocomplete="off" x-model="folioPadSource">
                        <template x-for="opt in folioPadSourceOptions" :key="opt.kind + ':' + opt.sourceIndex">
                            <option :value="opt.kind + ':' + opt.sourceIndex" x-text="opt.label"></option>
                        </template>
                    </select>
                </label>
                <label class="pv-folio-field">
                    <span>Insert</span>
                    <select class="m-input" name="folioPadAfter" autocomplete="off" x-model.number="folioPadAfterIndex">
                        <template x-for="opt in folioPadInsertOptions" :key="opt.afterIndex">
                            <option :value="opt.afterIndex" x-text="opt.label"></option>
                        </template>
                    </select>
                </label>
                <button type="button" class="m-btn m-btn--secondary m-btn--sm" @click="addFolioPadRow()">Add page</button>
            </div>
            <div class="pv-dialog__acts">
                <button type="button" class="m-btn m-btn--quiet m-btn--sm" @click="closeFolioPad()">Cancel</button>
                <button type="button" class="m-btn m-btn--primary m-btn--sm" :disabled="!folioPadReady" @click="confirmFolioPadPrint()">Print folio</button>
            </div>
        </div>
    </div>

    <div class="pv-dock" x-show="canFill && fillTotal" x-cloak>
        <div class="pv-go" :class="{ 'pv-go--done': !fillLeft, 'pv-go--celebrate': justDone }">
            <span class="pv-go__sr" role="status" aria-live="polite"
                  x-text="fillLeft ? fillLeftText : 'Nothing left to fill'"></span>
            <template x-if="fillLeft">
                <div class="pv-go__row">
                    <button type="button" class="m-icon-btn m-icon-btn--ghost" @click="goBlank(-1)"
                            :disabled="fillLeft < 2" aria-label="Previous blank">
                        <span class="material-symbols-outlined" aria-hidden="true">chevron_left</span>
                    </button>
                    <button type="button" class="pv-go__count" @click="goBlank(1)"
                            :aria-label="fillLeftText + '. Go to the next blank.'">
                        <span x-text="fillLeftText"></span>
                    </button>
                    <button type="button" class="m-icon-btn m-icon-btn--ghost" @click="goBlank(1)"
                            :disabled="fillLeft < 2" aria-label="Next blank">
                        <span class="material-symbols-outlined" aria-hidden="true">chevron_right</span>
                    </button>
                </div>
            </template>
            <template x-if="!fillLeft">
                <span class="pv-go__check">
                    <span class="material-symbols-outlined" aria-hidden="true">check</span>
                </span>
            </template>
        </div>
        <p class="pv-go__note" x-show="fillNote" x-text="fillNote"></p>
    </div>

    <div class="pv-zoom" x-show="!loading && !problem && template" x-cloak>
        <button type="button" class="m-icon-btn m-icon-btn--ghost" @click="zoomOut()" aria-label="Zoom out" title="Zoom out">
            <span class="material-symbols-outlined" aria-hidden="true">remove</span>
        </button>
        <button type="button" class="pv-zoom__label" @click="zoomFit()" :aria-label="'Fit page. Now ' + zoomLabel" x-text="zoomLabel"></button>
        <button type="button" class="m-icon-btn m-icon-btn--ghost" @click="zoomIn()" aria-label="Zoom in" title="Zoom in">
            <span class="material-symbols-outlined" aria-hidden="true">add</span>
        </button>
    </div>

    <script src="vendor/firebase/firebase-app-compat.js"></script>
    <script src="vendor/firebase/firebase-auth-compat.js"></script>
    <script src="vendor/firebase/firebase-firestore-compat.js"></script>
    <script src="vendor/firebase/firebase-storage-compat.js"></script>
    <script src="local-cache.js"></script>
    <script src="firebase-config.js"></script>
    <script src="auth.js"></script>

    <script src="dashboard-nav.js"></script>
    <script src="desktop-drawer.js"></script>
        <script src="drawer-who.js"></script>
<script src="desktop-header-lead.js"></script>
    <script src="desktop-nav-boot.js"></script>
    <script src="permission-catalog.js"></script>
    <script src="account-levels-core.js"></script>
    <script src="access-core.js"></script>
    <script src="mobile/destinations.js"></script>
    <script src="filing-core.js"></script>
    <script src="printable-link-core.js"></script>
    <script src="sunday-typed-core.js"></script>
    <script src="printable-legacy-migrate-core.js"></script>
    <script src="printable-core.js"></script>
    <script src="printable-dom.js"></script>
    <script src="printable-store.js"></script>
    <script src="events-core.js"></script>
    <script src="events-occurrence-core.js"></script>
    <script src="events-store.js"></script>
    <script src="event-announcement-core.js"></script>
    <script src="event-announcement-store.js"></script>
    <script src="printed-announcement-lines.js"></script>
    <script src="printed-announcement-guide.js"></script>
    <script src="hymn-versions.js"></script>
    <script src="liturgy-order-core.js"></script>
    <script src="liturgy-order-store.js"></script>
    <script src="printable-data-core.js"></script>
    <script src="printable-fill-core.js"></script>
    <script src="image-intake.js"></script>
    <script src="printable-link-store.js"></script>
    <script src="scripture-passage.js"></script>
    <script src="printable-data-store.js"></script>
    <script src="printable-render-core.js"></script>
    <script src="printable-live.js"></script>
    <script src="printable-export-core.js"></script>
    <script src="printable-view.js"></script>
    <script defer src="vendor/alpine-3.15.12.min.js"></script>

    <style>
        .pv-body { background: var(--surface-container); }
        .pv-main { display: flex; flex-direction: column; gap: var(--space-md); align-items: center; }
        .pv-main .m-notice { width: 100%; max-width: 1100px; }
        .pv-warn { display: block; }
        .pv-pages { width: 100%; display: flex; flex-direction: column; align-items: center; align-items: safe center; gap: var(--space-lg); padding-bottom: calc(var(--space-xl) + 88px); overflow-x: auto; }
        .pv-sheet { position: relative; overflow: hidden; box-shadow: 0 18px 48px rgba(14,28,54,.18), 0 0 0 1px rgba(14,28,54,.08); background: #fff; }
        /* The page's own base rules come from PrintableDom.ensureBaseStyles. */
        .pv-measure { position: absolute; left: -100000px; top: 0; visibility: hidden; pointer-events: none; }
        .pv-print { display: none; }
        .pv-header .m-btn--named {
            width: auto; min-width: 44px; height: 44px; padding: 0 10px; gap: 4px;
        }
        .pv-header .m-btn--named .m-btn__label { display: inline; font-size: 12.5px; }
        .pv-scrim {
            position: fixed; inset: 0; z-index: 60;
            display: flex; align-items: center; justify-content: center;
            padding: 24px; background: rgba(14, 28, 54, .45);
        }
        .pv-dialog {
            background: var(--surface-container-lowest);
            border: 1px solid var(--outline-variant);
            border-radius: var(--radius-xl, 16px);
            padding: 24px; width: 100%; max-width: 520px;
            display: flex; flex-direction: column; gap: 12px;
            max-height: 92vh; overflow: auto;
        }
        .pv-dialog__hint { margin: 0; font-size: 13.5px; color: var(--on-surface-variant); line-height: 1.45; }
        .pv-dialog__acts { display: flex; justify-content: flex-end; gap: 8px; margin-top: 8px; }
        .pv-folio-stack {
            list-style: none; margin: 0; padding: 0;
            display: flex; flex-direction: column; gap: 4px;
            max-height: 240px; overflow: auto;
            border: 1px solid var(--outline-variant);
            border-radius: var(--radius); padding: 6px;
            background: var(--surface-container);
        }
        .pv-folio-stack__row {
            display: flex; align-items: center; justify-content: space-between; gap: 8px;
            padding: 6px 8px; border-radius: var(--radius-sm, 8px);
            background: var(--surface-container-lowest); font-size: 13px;
        }
        .pv-folio-stack__row.is-pad { outline: 1px dashed var(--outline-variant); }
        .pv-folio-stack__label { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .pv-folio-add {
            display: grid; grid-template-columns: 1fr 1fr auto; gap: 8px; align-items: end;
        }
        .pv-folio-field { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--on-surface-variant); }
        @media (max-width: 640px) {
            .pv-folio-add { grid-template-columns: 1fr; }
        }
        .pv-dock {
            position: fixed;
            z-index: 40;
            left: 50%;
            bottom: calc(16px + env(safe-area-inset-bottom, 0px));
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            width: max-content;
            max-width: calc(100vw - 180px);
        }
        .pv-go {
            position: relative;
            display: flex;
            align-items: center;
            padding: 4px;
            background: var(--surface-container-lowest);
            color: var(--primary);
            border: 1px solid var(--outline-variant);
            border-radius: var(--radius-full);
            box-shadow: var(--shadow-sm);
            transition: background-color var(--duration) var(--ease-standard),
                        color var(--duration) var(--ease-standard),
                        border-color var(--duration) var(--ease-standard);
        }
        .pv-go__row { display: flex; align-items: center; gap: 2px; }
        .pv-go__count {
            border: 0;
            background: transparent;
            color: inherit;
            font: 600 14px/1.2 var(--font-sans);
            font-variant-numeric: tabular-nums;
            padding: 8px 12px;
            min-height: 36px;
            border-radius: var(--radius-full);
            cursor: pointer;
            white-space: nowrap;
            touch-action: manipulation;
            transition: background-color var(--duration) var(--ease-standard);
        }
        @media (hover: hover) {
            .pv-go__count:hover { background: var(--surface-container); }
        }
        .pv-go__count:focus-visible { outline: 2px solid var(--tertiary); outline-offset: 2px; }
        .pv-go--done {
            width: 48px;
            height: 48px;
            padding: 0;
            justify-content: center;
            background: var(--success);
            color: var(--on-primary);
            border-color: transparent;
        }
        .pv-go__check {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 48px;
            height: 48px;
        }
        .pv-go__check .material-symbols-outlined {
            font-size: 28px;
            font-variation-settings: 'FILL' 1, 'wght' 600, 'GRAD' 0, 'opsz' 24;
        }
        .pv-go__sr {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }
        .pv-go--celebrate .pv-go__check .material-symbols-outlined {
            animation: pv-check-pop 420ms var(--ease-standard);
        }
        .pv-go--celebrate::after {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: inherit;
            border: 2px solid var(--success);
            pointer-events: none;
            animation: pv-go-ring 640ms var(--ease-standard) forwards;
        }
        @keyframes pv-check-pop {
            0% { transform: scale(0.4); opacity: 0; }
            70% { transform: scale(1.12); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
        @keyframes pv-go-ring {
            0% { transform: scale(1); opacity: 0.65; }
            100% { transform: scale(1.65); opacity: 0; }
        }
        @media (prefers-reduced-motion: reduce) {
            .pv-go { transition: none; }
            .pv-go--celebrate .pv-go__check .material-symbols-outlined,
            .pv-go--celebrate::after { animation: none; }
        }
        .pv-go__note {
            margin: 0;
            max-width: 280px;
            text-align: center;
            font: 12px/1.3 var(--font-sans);
            color: var(--on-surface-variant);
            background: var(--surface-container-lowest);
            border: 1px solid var(--outline-variant);
            border-radius: var(--radius);
            padding: 4px 8px;
        }
        .pv-zoom {
            position: fixed;
            z-index: 40;
            right: 16px;
            bottom: calc(16px + env(safe-area-inset-bottom, 0px));
            display: flex;
            align-items: center;
            gap: 2px;
            padding: 4px;
            background: var(--surface-container-lowest);
            border: 1px solid var(--outline-variant);
            border-radius: var(--radius);
            box-shadow: var(--shadow-sm);
        }
        .pv-zoom__label {
            border: 0;
            background: transparent;
            font: 600 13px/1 var(--font-sans);
            font-variant-numeric: tabular-nums;
            color: var(--on-surface);
            min-width: 52px;
            min-height: 36px;
            padding: 0 4px;
            cursor: pointer;
            border-radius: var(--radius-sm);
            touch-action: manipulation;
        }
        .pv-zoom__label:hover { color: var(--primary); }
        .pv-zoom__label:focus-visible { outline: 2px solid var(--tertiary); outline-offset: 2px; }
        @media (max-width: 520px) {
            .pv-dock {
                left: 12px;
                transform: none;
                align-items: flex-start;
                bottom: calc(68px + env(safe-area-inset-bottom, 0px));
                max-width: calc(100vw - 24px);
            }
        }
        .pv-fill {
            display: block;
            width: 100%;
            min-height: 1.15em;
            margin: 0;
            padding: 0 3px;
            font: inherit;
            line-height: inherit;
            color: inherit;
            background: rgba(255, 248, 220, .72);
            border: 1px dashed rgba(14, 28, 54, .45);
            border-radius: 2px;
            box-sizing: border-box;
            resize: vertical;
        }
        .pv-fill:focus-visible {
            outline: 2px solid var(--primary);
            outline-offset: 1px;
            background: #fff;
        }
        .pv-fill,
        .pv-fill-img,
        .pv-fill-add { scroll-margin-top: 80px; scroll-margin-bottom: 112px; }
        .pv-fill--current,
        .pv-fill-img.pv-fill--current,
        .pv-fill-add.pv-fill--current {
            outline: 2px solid var(--primary);
            outline-offset: 2px;
            box-shadow: 0 0 0 4px color-mix(in srgb, var(--primary) 16%, transparent);
        }
        .pv-fill-img:focus-within { outline: 2px solid var(--primary); outline-offset: 1px; }
        .pv-fill-img {
            display: flex;
            flex-direction: column;
            align-items: stretch;
            justify-content: flex-end;
            gap: 4px;
            box-sizing: border-box;
            min-height: 1.5em;
            cursor: pointer;
            border: 1px dashed rgba(14, 28, 54, .45);
            background: rgba(255, 248, 220, .72);
        }
        .pv-fill-img img { width: 100%; height: 100%; object-fit: contain; flex: 1 1 auto; }
        .pv-fill-img__btn {
            font-family: inherit;
            font-size: 11px;
            line-height: 1.2;
            text-align: center;
            padding: 2px 4px;
        }
        .pv-fill-file {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }
        .pv-fill-add {
            align-self: flex-start;
            margin-top: 4px;
            padding: 2px 8px;
            font: 12px/1.3 "Source Sans 3", sans-serif;
            color: var(--primary);
            background: #fff;
            border: 1px solid var(--outline-variant);
            border-radius: 6px;
            cursor: pointer;
        }
        .pv-fill-add:focus-visible { outline: 2px solid var(--primary); outline-offset: 1px; }
        @media print {
            body.pv-printing > *:not(.pv-print) { display: none !important; }
            .pv-print { display: block; }
            body { background: #fff; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
        }
    </style>
</body>
</html>
