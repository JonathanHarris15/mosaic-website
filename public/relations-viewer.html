<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Relations Viewer | Mosaic</title>

    <!-- This page draws with CSS custom properties rather than Tailwind
         classes, which is why it used to define the whole palette itself.
         mosaic.css carries the custom properties now (see build/design-tokens),
         so the copy is gone. It was not merely redundant: it pinned the fonts
         to the pre-brand Noto Serif / Work Sans, and half its entries had been
         left as --sand: var(--sand), a self-reference, which is invalid and
         leaves the token unset. -->
    <link rel="stylesheet" href="mosaic.css" />
    <link rel="stylesheet" href="fonts.css" />
    <link rel="stylesheet" href="household.css" />

    <style>
        html, body { margin: 0; height: 100%; background: var(--background); }
        * { box-sizing: border-box; }

        .msy {
            font-family: 'Material Symbols Outlined';
            font-weight: normal; font-style: normal; line-height: 1;
            letter-spacing: normal; text-transform: none; display: inline-block;
            white-space: nowrap; direction: ltr;
            -webkit-font-feature-settings: 'liga'; font-feature-settings: 'liga';
            -webkit-font-smoothing: antialiased;
        }
        .rv-scroll { scrollbar-width: thin; scrollbar-color: var(--outline-variant) transparent; }
        .rv-scroll::-webkit-scrollbar { width: 8px; height: 8px; }
        .rv-scroll::-webkit-scrollbar-thumb { background: var(--outline-variant); border-radius: 8px; }
        .rv-scroll::-webkit-scrollbar-track { background: transparent; }
        .rv-search::placeholder { color: var(--on-surface-variant); opacity: .75; }
        .rv-search:focus { border-color: var(--steel) !important; box-shadow: 0 0 0 3px rgba(93,148,169,.20) !important; }
        .rv-row { transition: background .15s cubic-bezier(0.2,0,0,1); }
        .rv-row:hover { background: var(--surface-container); }
        .rv-preset { transition: all .15s cubic-bezier(0.2,0,0,1); }
        .rv-icobtn { transition: background .15s, color .15s; }
        .rv-icobtn:hover { background: var(--surface-container); }
        .rv-primary { transition: transform .12s cubic-bezier(0.2,0,0,1), box-shadow .15s; }
        .rv-primary:hover { box-shadow: 0 8px 24px rgba(14,28,54,.14); }
        .rv-primary:active { transform: scale(0.98); }
        .rv-result:hover { background: var(--surface-container); }
        /* The graph took the whole viewport when it was the whole page. It now
           shares it with the bar, so it takes what the bar leaves. */
        body { display: flex; flex-direction: column; min-height: 100vh; margin: 0; }
        #app { flex: 1 1 auto; min-height: 0; }
        [x-cloak] { display: none !important; }

        /* Relationships and Families, the two editors that used to be tabs on
           Manage Tags. They fill the space under the viewer's own bar. */
        .rv-manage { padding: 24px 32px 48px; max-width: 1080px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
        .rel-cols { display: grid; grid-template-columns: 1fr; gap: 18px; align-items: start; }
        @media (min-width: 1024px) {
            .rel-cols { grid-template-columns: 326px minmax(0, 1fr); }
        }
        .rel-cols > * { min-width: 0; }
        @media (max-width: 640px) {
            .rel-actions { opacity: 1 !important; }
            .rel-pairadd { flex-direction: column; align-items: stretch; }
            .rel-pairadd .rel-arrow { transform: rotate(90deg); }
            .rel-formgrid { grid-template-columns: 1fr !important; }
            .rel-preview-pair { flex-direction: column; gap: 14px; }
            .rv-manage { padding: 16px; }
        }
    </style>

    <script src="vendor/firebase/firebase-app-compat.js"></script>
    <script src="vendor/firebase/firebase-auth-compat.js"></script>
    <script src="vendor/firebase/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="auth.js"></script>
    <script defer src="vendor/alpine-3.15.12.min.js"></script>
</head>
<body>
    <!-- ⚠ THE ONE PAGE WITH NO `.m-header`, ON PURPOSE (MS-233).
         MS-187 gave this page a Tool Bar because it had nothing across the top
         at all and nobody could leave it. But the viewer already draws its own
         bar — the same way back, the same title, plus a search and the counts
         it exists to show — so the two sat one above the other saying the same
         thing twice, and the graph started 56px further down than the 100vh it
         asks for.

         This screen is a tool of its own rather than a page of the app, which
         is the one case where breaking the convention is the right answer. The
         viewer's bar wins; what it was missing was the account, so
         `#auth-container` is built into it by `buildSkeleton`. The Graph,
         Relationships, and Families tabs live in that same bar's row — still
         no `.m-header`. -->
    <div id="app"></div>

    <!-- Moved into the viewer's manage slot the first time Relationships or
         Families is opened. A template does not paint, so it cannot stack a
         second bar above the graph. -->
    <template id="rv-manage-template">
        <div x-data="relationsManage" x-cloak class="rv-manage">
            <div x-show="loading" class="m-loading">
                <span class="m-spinner material-symbols-outlined">progress_activity</span>
            </div>
            <div x-show="!loading" class="flex flex-col gap-md">
                        <!-- ── Families tab (MS-709) ─────────────────────────────────────────
             Left: every Family, searchable by anyone in it. Right: its tree, the
             Households in it, and the Household editor card for the one picked.
             A Household is edited here, inside its Family, never the other way. -->
        <div x-show="activeTab === 'families'" class="flex flex-col gap-sm">
            <div x-show="hhError" class="flex items-start gap-[10px] bg-error-container border border-error rounded-md px-sm py-sm text-on-error-container" role="alert">
                <span class="material-symbols-outlined text-[20px] text-error flex-shrink-0" aria-hidden="true">error</span>
                <span class="flex-1 font-sans text-[13.5px] font-medium leading-snug" x-text="hhError"></span>
            </div>
            <div class="rel-cols m-with-side">
                <div class="m-side m-card flex flex-col gap-sm">
                    <input type="search" x-model="hhQuery" placeholder="Search Families…" aria-label="Search Families by surname or anyone in them"
                           autocomplete="off" spellcheck="false"
                           class="w-full border border-outline-variant rounded-lg px-md py-sm font-body-md text-body-md bg-surface focus:outline-none focus:ring-2 focus:ring-primary/30" />
                    <button x-show="canWriteEditor" type="button" @click="newFamily()" class="m-btn m-btn--secondary m-btn--sm self-start">
                        <span class="material-symbols-outlined" aria-hidden="true">add</span><span class="m-btn__label">New Family</span>
                    </button>
                    <ul class="flex flex-col gap-[2px]">
                        <template x-for="t in famList" :key="t.id">
                            <li>
                                <button type="button" @click="selectFamily(t.id)"
                                    :aria-current="famSelectedId === t.id ? 'true' : null"
                                    :class="famSelectedId === t.id ? 'bg-surface-container-low border-outline-variant' : 'border-transparent hover:bg-surface-container-low hover:border-outline-variant'"
                                    class="w-full text-left flex gap-[10px] p-[10px] rounded-[10px] border transition-colors">
                                    <span class="w-[3px] rounded-full flex-shrink-0" :class="famSelectedId === t.id ? 'bg-primary' : 'bg-transparent'"></span>
                                    <span class="min-w-0 flex-1 flex flex-col">
                                        <span class="font-body-md text-on-surface" x-text="t.name"></span>
                                        <span class="text-xs text-on-surface-variant" x-text="t.sub"></span>
                                    </span>
                                </button>
                            </li>
                        </template>
                        <li x-show="famList.length === 0" class="text-on-surface-variant italic text-sm px-sm py-md"
                            x-text="hhQuery.trim() ? 'No Family has anyone by that name.' : 'No Families yet.'"></li>
                    </ul>
                </div>

                <div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-[18px] flex flex-col gap-md">
                    <template x-if="famSelected">
                        <div class="flex flex-col gap-md">
                            <div class="flex flex-wrap items-baseline justify-between gap-xs">
                                <h2 class="font-display text-[20px] font-semibold tracking-[.02em] text-navy-900" x-text="famSelected.name"></h2>
                                <span class="text-xs text-on-surface-variant"
                                      x-text="famSelected.households.length + (famSelected.households.length === 1 ? ' Household · ' : ' Households · ') + famSelected.peopleIds.length + ' people'"></span>
                            </div>
                            <div class="flex flex-col gap-xs">
                                <span class="m-label">Family tree</span>
                                <div x-effect="renderFamilyTree($el.firstElementChild)"><div x-ignore></div></div>
                            </div>
                            <div class="flex flex-col gap-xs">
                                <span class="m-label" id="fam-households-label">Households in this Family</span>
                                <ul class="flex flex-col gap-[2px]" aria-labelledby="fam-households-label">
                                    <template x-for="h in famHouseholds" :key="h.id">
                                        <li :style="'padding-left:' + (h.depth * 18) + 'px'">
                                            <button type="button" @click="selectHousehold(h.id)"
                                                :aria-current="hhSelectedId === h.id ? 'true' : null"
                                                :class="hhSelectedId === h.id ? 'bg-surface-container-low border-outline-variant text-primary font-semibold' : 'border-transparent hover:bg-surface-container-low text-on-surface'"
                                                class="w-full text-left flex items-center gap-[8px] px-[10px] py-[6px] rounded-[8px] border text-[13.5px] transition-colors">
                                                <span class="material-symbols-outlined text-[18px] text-on-surface-variant" aria-hidden="true">home</span>
                                                <span x-text="h.name"></span>
                                            </button>
                                        </li>
                                    </template>
                                </ul>
                            </div>
                        </div>
                    </template>
                    <div x-show="hhSelectedId || hhNew" :class="famSelected ? 'border-t border-outline-variant pt-md' : ''"
                         x-effect="renderHouseholdPane($el.firstElementChild)"><div x-ignore></div></div>
                    <p x-show="!famSelected && !hhNew" class="text-on-surface-variant italic text-sm">
                        Pick a Family on the left<span x-show="canWriteEditor">, or start a new one</span>.
                    </p>
                    <p x-show="hhNew" class="text-on-surface-variant text-xs">
                        Seat the father (or single parent) at the top of the new Family; its children and their Households follow.
                    </p>
                </div>
            </div>
        </div>
                        <!-- ── Relationships tab (MS-103, ADR-0014) ──────────────────────────
             The one home for relationship vocabulary. A Relationship Type is a
             kind × priority structure; the left column lists them, the right
             column either builds one or manages who holds it. Types and named
             groups can be created ONLY here — never from a person's profile. -->
        <div x-show="activeTab === 'relationships'" class="flex flex-col gap-sm">

            <!-- The tab failed to load — say so plainly rather than showing an
                 empty panel that looks like "no types yet". -->
            <div x-show="relError" class="flex items-start gap-[10px] bg-error-container border border-error rounded-md px-sm py-sm text-on-error-container">
                <span class="material-symbols-outlined text-[20px] text-error flex-shrink-0">error</span>
                <span class="flex-1 font-sans text-[13.5px] font-medium leading-snug" x-text="relError"></span>
                <button @click="dismissError()" title="Dismiss" class="flex-shrink-0 text-on-error-container hover:opacity-70 transition-opacity">
                    <span class="material-symbols-outlined text-[18px]">close</span>
                </button>
            </div>

            <div class="rel-cols m-with-side">

                <!-- ═══ LEFT: the vocabulary ═══════════════════════════════ -->
                <div class="rel-types m-side m-card">
                    <div class="flex items-center justify-between mb-sm">
                        <div class="flex items-baseline gap-[7px]">
                            <span class="font-sans text-[11px] font-semibold uppercase tracking-[.14em] text-on-surface-variant">Types</span>
                            <span class="font-sans text-[11px] font-semibold text-on-surface-variant bg-surface-container-high px-[7px] rounded-sm" x-text="relTypes.length"></span>
                        </div>
                        <button type="button" x-show="canDecide" @click="startNewType()"
                            class="m-btn m-btn--primary m-btn--sm">
                            <span class="material-symbols-outlined">add</span>New
                        </button>
                    </div>

                    <div class="flex flex-col gap-[6px]">
                        <template x-for="type in relTypes" :key="type.id">
                            <div @click="selectType(type)"
                                 class="group flex gap-[10px] p-[10px] rounded-[10px] border cursor-pointer transition-colors"
                                 :class="selectedTypeId === type.id
                                     ? 'bg-surface-container-low border-outline-variant'
                                     : 'border-transparent hover:bg-surface-container-low hover:border-outline-variant'">
                                <!-- accent bar: which type the right column is talking about -->
                                <span class="w-[3px] rounded-full flex-shrink-0"
                                      :class="selectedTypeId === type.id ? 'bg-primary' : 'bg-transparent'"></span>

                                <div class="min-w-0 flex-1">
                                    <div class="flex items-center justify-between gap-xs">
                                        <span class="font-sans text-[14.5px] font-semibold text-navy-900 truncate" x-text="type.name"></span>
                                        <div x-show="canDecide" class="rel-actions flex gap-[2px] flex-shrink-0 opacity-0 group-hover:opacity-100 transition-opacity">
                                            <button @click.stop="startEditType(type)" title="Edit type"
                                                class="w-[28px] h-[28px] rounded-sm flex items-center justify-center text-on-surface-variant hover:bg-surface-container hover:text-primary transition-colors">
                                                <span class="material-symbols-outlined text-[17px]">edit</span>
                                            </button>
                                            <button @click.stop="deleteType(type)" title="Delete type"
                                                class="w-[28px] h-[28px] rounded-sm flex items-center justify-center text-on-surface-variant hover:bg-error-container hover:text-error transition-colors">
                                                <span class="material-symbols-outlined text-[17px]">delete</span>
                                            </button>
                                        </div>
                                    </div>

                                    <!-- kind + priority carried as badges, not buried in a caption -->
                                    <div class="flex items-center gap-[5px] flex-wrap mt-[7px]">
                                        <span class="inline-flex items-center gap-[3px] bg-secondary-container text-on-secondary-container rounded-sm px-[7px] py-[2px] font-sans text-[11px] font-semibold">
                                            <span class="material-symbols-outlined text-[13px]" x-text="kindIcon(type)"></span><span x-text="kindLabel(type)"></span>
                                        </span>
                                        <!-- Shared with editors (MS-128): the whole list is an audit
                                             surface, so what has left the shepherding layer has to be
                                             readable at a glance without opening each type. -->
                                        <span x-show="RelationshipCore.isSharedWithEditors(type)"
                                              title="Editors outside the shepherding team can see this relationship type"
                                              class="inline-flex items-center gap-[3px] bg-tertiary-container text-on-tertiary-container rounded-sm px-[7px] py-[2px] font-sans text-[11px] font-semibold">
                                            <span class="material-symbols-outlined text-[13px]">visibility</span><span>Editors</span>
                                        </span>
                                        <span class="inline-flex items-center gap-[3px] bg-tertiary-container text-on-tertiary-container rounded-sm px-[7px] py-[2px] font-sans text-[11px] font-semibold">
                                            <span class="material-symbols-outlined text-[13px]" x-text="priorityIcon(type)"></span><span x-text="priorityLabel(type)"></span>
                                        </span>
                                    </div>

                                    <div class="flex items-center gap-[6px] mt-[6px] font-sans text-[12px] text-on-surface-variant">
                                        <span class="font-serif italic truncate" x-text="labelsSummary(type)"></span>
                                        <span>·</span>
                                        <span class="whitespace-nowrap" x-text="countLabel(type)"></span>
                                    </div>
                                </div>
                            </div>
                        </template>

                        <div x-show="relTypes.length === 0" class="flex flex-col items-center gap-[8px] py-[28px] px-sm text-center">
                            <span class="material-symbols-outlined text-[32px] text-outline-variant">hub</span>
                            <p class="font-sans text-[13.5px] text-on-surface-variant">No types yet.</p>
                        </div>
                    </div>
                </div>

                <!-- ═══ RIGHT: build one, or manage who holds it ════════════ -->
                <div class="min-w-0">

                    <!-- ─── The type form ─────────────────────────────────── -->
                    <div x-show="showTypeForm"
                         class="bg-surface-container-lowest border border-outline-variant rounded-xl shadow-md p-md">
                        <div class="flex items-center justify-between mb-md">
                            <h2 class="font-display text-[20px] font-semibold tracking-[.02em] text-navy-900"
                                x-text="editingTypeId ? 'Edit Relationship Type' : 'New Relationship Type'"></h2>
                            <button @click="resetTypeForm()"
                                class="flex items-center gap-[4px] font-sans text-[11px] font-semibold uppercase tracking-[.12em] text-on-surface-variant hover:text-error transition-colors">
                                <span class="material-symbols-outlined text-[18px]">close</span>Cancel
                            </button>
                        </div>

                        <label class="block font-sans text-[11px] font-semibold uppercase tracking-[.14em] text-on-surface-variant mb-[6px]">Type Name</label>
                        <input type="text" x-model="typeForm.name" placeholder="e.g. Discipleship"
                               class="w-full bg-surface border border-outline-variant rounded-md px-sm py-[10px] font-sans text-[15px] font-semibold text-navy-900 focus:outline-none focus:border-steel focus:ring-2 focus:ring-steel/20" />

                        <!-- kind × priority: two segmented controls. This 2×2 is the
                             whole idea of the model, so it leads the form. -->
                        <div class="rel-formgrid grid grid-cols-2 gap-sm mt-md">
                            <div>
                                <label class="flex items-center gap-[6px] font-sans text-[11px] font-semibold uppercase tracking-[.14em] text-on-surface-variant mb-[7px]">
                                    Kind
                                    <!-- kind is immutable: flipping it would orphan every instance -->
                                    <span x-show="editingTypeId" class="font-sans text-[9px] font-medium normal-case tracking-[.06em] text-on-surface-variant bg-surface-container-high px-[6px] py-[2px] rounded-sm">locked after creation</span>
                                </label>
                                <div class="flex gap-[3px] p-[3px] bg-surface-container border border-outline-variant rounded-md"
                                     :class="editingTypeId ? 'opacity-60' : ''">
                                    <template x-for="k in [{v:'pairwise',icon:'swap_horiz',label:'Pairwise'},{v:'group',icon:'groups',label:'Group'}]" :key="k.v">
                                        <button type="button" @click="if (!editingTypeId) typeForm.kind = k.v" :disabled="editingTypeId"
                                            :class="typeForm.kind === k.v ? 'bg-surface-container-lowest text-primary shadow-xs' : 'text-on-surface-variant hover:text-on-surface'"
                                            class="flex-1 inline-flex items-center justify-center gap-[4px] py-[7px] rounded-[8px] font-sans text-[12px] font-semibold transition-colors disabled:cursor-not-allowed">
                                            <span class="material-symbols-outlined text-[17px]" x-text="k.icon"></span><span x-text="k.label"></span>
                                        </button>
                                    </template>
                                </div>
                                <p class="mt-[7px] font-sans text-[11.5px] leading-snug text-on-surface-variant" x-text="kindHint(typeForm)"></p>
                            </div>

                            <div>
                                <label class="block font-sans text-[11px] font-semibold uppercase tracking-[.14em] text-on-surface-variant mb-[7px]">Priority</label>
                                <div class="flex gap-[3px] p-[3px] bg-surface-container border border-outline-variant rounded-md">
                                    <template x-for="p in [{v:true,icon:'trending_flat',label:'Prioritized'},{v:false,icon:'sync_alt',label:'Symmetric'}]" :key="String(p.v)">
                                        <button type="button" @click="typeForm.priority = p.v"
                                            :class="typeForm.priority === p.v ? 'bg-surface-container-lowest text-primary shadow-xs' : 'text-on-surface-variant hover:text-on-surface'"
                                            class="flex-1 inline-flex items-center justify-center gap-[4px] py-[7px] rounded-[8px] font-sans text-[12px] font-semibold transition-colors">
                                            <span class="material-symbols-outlined text-[17px]" x-text="p.icon"></span><span x-text="p.label"></span>
                                        </button>
                                    </template>
                                </div>
                                <p class="mt-[7px] font-sans text-[11.5px] leading-snug text-on-surface-variant" x-text="priorityHint(typeForm)"></p>
                            </div>
                        </div>

                        <!-- The shape being built, drawn. The label fields live inside
                             the picture, so it is obvious which role each one names. -->
                        <div class="mt-md bg-surface-container-low border border-dashed border-outline-variant rounded-lg p-md">
                            <div class="font-sans text-[10.5px] font-semibold uppercase tracking-[.14em] text-on-surface-variant mb-sm">The shape you're building</div>

                            <!-- Pairwise · Prioritized -->
                            <div x-show="typeForm.kind === 'pairwise' && typeForm.priority" class="rel-preview-pair flex items-center justify-center gap-[8px]">
                                <div class="flex flex-col items-center gap-[8px] flex-1 max-w-[190px]">
                                    <span class="w-[48px] h-[48px] rounded-full bg-navy text-cream flex items-center justify-center font-sans text-[15px] font-semibold">AC</span>
                                    <span class="font-sans text-[12px] font-semibold text-navy-900">Alice</span>
                                    <input type="text" x-model="typeForm.holderLabel" placeholder="Holder label"
                                           class="w-full text-center bg-surface-container-lowest border border-outline-variant rounded-[8px] px-[8px] py-[7px] font-sans text-[12.5px] font-semibold text-ocean focus:outline-none focus:border-steel focus:ring-2 focus:ring-steel/20" />
                                </div>
                                <div class="flex flex-col items-center text-ocean pb-[26px]">
                                    <span class="material-symbols-outlined rel-arrow text-[32px]">arrow_right_alt</span>
                                </div>
                                <div class="flex flex-col items-center gap-[8px] flex-1 max-w-[190px]">
                                    <span class="w-[48px] h-[48px] rounded-full bg-ocean text-white flex items-center justify-center font-sans text-[15px] font-semibold">BM</span>
                                    <span class="font-sans text-[12px] font-semibold text-navy-900">Bob</span>
                                    <input type="text" x-model="typeForm.counterpartLabel" placeholder="Counterpart label"
                                           class="w-full text-center bg-surface-container-lowest border border-outline-variant rounded-[8px] px-[8px] py-[7px] font-sans text-[12.5px] font-semibold text-ocean focus:outline-none focus:border-steel focus:ring-2 focus:ring-steel/20" />
                                </div>
                            </div>

                            <!-- Pairwise · Symmetric -->
                            <div x-show="typeForm.kind === 'pairwise' && !typeForm.priority" class="rel-preview-pair flex items-center justify-center gap-sm">
                                <div class="flex flex-col items-center gap-[8px]">
                                    <span class="w-[48px] h-[48px] rounded-full bg-navy text-cream flex items-center justify-center font-sans text-[15px] font-semibold">AC</span>
                                    <span class="font-sans text-[12px] font-semibold text-navy-900">Alice</span>
                                </div>
                                <div class="flex flex-col items-center gap-[8px] flex-1 max-w-[200px]">
                                    <span class="material-symbols-outlined rel-arrow text-[26px] text-steel">sync_alt</span>
                                    <input type="text" x-model="typeForm.label" placeholder="Relationship label"
                                           class="w-full text-center bg-surface-container-lowest border border-outline-variant rounded-[8px] px-[8px] py-[7px] font-sans text-[12.5px] font-semibold text-ocean focus:outline-none focus:border-steel focus:ring-2 focus:ring-steel/20" />
                                </div>
                                <div class="flex flex-col items-center gap-[8px]">
                                    <span class="w-[48px] h-[48px] rounded-full bg-ocean text-white flex items-center justify-center font-sans text-[15px] font-semibold">BM</span>
                                    <span class="font-sans text-[12px] font-semibold text-navy-900">Bob</span>
                                </div>
                            </div>

                            <!-- Group · Prioritized: one leader, a line, the roster -->
                            <div x-show="typeForm.kind === 'group' && typeForm.priority" class="flex flex-col items-center gap-sm">
                                <div class="flex flex-col items-center gap-[7px]">
                                    <div class="relative">
                                        <span class="w-[48px] h-[48px] rounded-full bg-navy text-cream flex items-center justify-center font-sans text-[15px] font-semibold">SK</span>
                                        <span class="material-symbols-outlined absolute -top-[8px] -right-[8px] text-[20px] text-gold bg-surface-container-low rounded-full">star</span>
                                    </div>
                                    <input type="text" x-model="typeForm.leaderLabel" placeholder="Leader label"
                                           class="w-[150px] text-center bg-surface-container-lowest border border-outline-variant rounded-[8px] px-[8px] py-[7px] font-sans text-[12.5px] font-semibold text-ocean focus:outline-none focus:border-steel focus:ring-2 focus:ring-steel/20" />
                                </div>
                                <span class="w-px h-[14px] bg-outline-variant"></span>
                                <div class="flex flex-col items-center gap-[7px]">
                                    <div class="flex">
                                        <span class="w-[38px] h-[38px] rounded-full bg-ocean text-white flex items-center justify-center font-sans text-[12px] font-semibold border-2 border-surface-container-low">DO</span>
                                        <span class="w-[38px] h-[38px] rounded-full bg-steel text-white flex items-center justify-center font-sans text-[12px] font-semibold border-2 border-surface-container-low -ml-[8px]">RA</span>
                                        <span class="w-[38px] h-[38px] rounded-full bg-ocean text-white flex items-center justify-center font-sans text-[12px] font-semibold border-2 border-surface-container-low -ml-[8px]">JP</span>
                                    </div>
                                    <input type="text" x-model="typeForm.memberLabel" placeholder="Member label"
                                           class="w-[150px] text-center bg-surface-container-lowest border border-outline-variant rounded-[8px] px-[8px] py-[7px] font-sans text-[12.5px] font-semibold text-ocean focus:outline-none focus:border-steel focus:ring-2 focus:ring-steel/20" />
                                </div>
                            </div>

                            <!-- Group · Symmetric: a flat roster, nobody leads -->
                            <div x-show="typeForm.kind === 'group' && !typeForm.priority" class="flex flex-col items-center gap-sm">
                                <div class="flex">
                                    <span class="w-[40px] h-[40px] rounded-full bg-navy text-cream flex items-center justify-center font-sans text-[13px] font-semibold border-2 border-surface-container-low">DO</span>
                                    <span class="w-[40px] h-[40px] rounded-full bg-ocean text-white flex items-center justify-center font-sans text-[13px] font-semibold border-2 border-surface-container-low -ml-[8px]">RA</span>
                                    <span class="w-[40px] h-[40px] rounded-full bg-steel text-white flex items-center justify-center font-sans text-[13px] font-semibold border-2 border-surface-container-low -ml-[8px]">JP</span>
                                </div>
                                <input type="text" x-model="typeForm.label" placeholder="Member label"
                                       class="w-[170px] text-center bg-surface-container-lowest border border-outline-variant rounded-[8px] px-[8px] py-[7px] font-sans text-[12.5px] font-semibold text-ocean focus:outline-none focus:border-steel focus:ring-2 focus:ring-steel/20" />
                            </div>

                            <div class="mt-sm pt-sm border-t border-outline-variant text-center">
                                <span class="font-sans text-[10px] font-semibold uppercase tracking-[.14em] text-on-surface-variant">Reads as</span>
                                <p class="mt-[6px] font-serif italic text-[16px] leading-snug text-navy-900" x-text="previewSentence(typeForm)"></p>
                            </div>
                        </div>

                        <!-- ─── Shared with Editors (MS-128) ──────────────────
                             Relationships are elder-only. This is the one door
                             out of that, opened one Type at a time, so serving
                             rules like "no married couple in Kids" can work. -->
                        <div class="mt-md border border-outline-variant rounded-lg p-sm">
                            <label class="flex items-start gap-[10px] cursor-pointer">
                                <input type="checkbox" x-model="typeForm.sharedWithEditors"
                                    class="mt-[3px] h-[16px] w-[16px] accent-ocean shrink-0">
                                <span>
                                    <span class="block font-sans text-[13px] font-semibold text-navy-900">Share this type with editors</span>
                                    <span class="block mt-[3px] font-sans text-[11.5px] leading-snug text-on-surface-variant">
                                        Lets people outside the shepherding team see this relationship and who it
                                        connects, so it can be used in serving rules. Nobody below editor can see it,
                                        and every other relationship type stays elder-only.
                                    </span>
                                </span>
                            </label>
                            <p x-show="typeForm.sharedWithEditors"
                                class="mt-[8px] pl-[26px] font-sans text-[11.5px] leading-snug text-tertiary">
                                Editors will be able to see every
                                <span class="font-semibold" x-text="typeForm.name || 'relationship of this type'"></span>
                                in the church.
                            </p>
                        </div>

                        <div class="flex gap-[10px] mt-md">
                            <button @click="saveType()"
                                class="flex-1 bg-primary text-on-primary rounded-md py-sm font-sans text-[12px] font-semibold uppercase tracking-[.12em] shadow-xs hover:bg-primary/90 active:scale-[.99] transition-all"
                                x-text="editingTypeId ? 'Save changes' : 'Create type'"></button>
                            <button @click="resetTypeForm()"
                                class="border border-ocean text-ocean rounded-md px-md py-sm font-sans text-[12px] font-semibold uppercase tracking-[.12em] hover:bg-ocean/5 transition-colors">Cancel</button>
                        </div>
                    </div>

                    <!-- ─── Who holds the selected type ───────────────────── -->
                    <template x-if="!showTypeForm && selectedType">
                        <div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-md">
                            <div class="flex items-center gap-[9px]">
                                <h3 class="font-display text-[19px] font-semibold tracking-[.02em] text-navy-900" x-text="selectedType.name"></h3>
                                <span class="inline-flex items-center gap-[3px] bg-secondary-container text-on-secondary-container rounded-sm px-[7px] py-[2px] font-sans text-[11px] font-semibold">
                                    <span class="material-symbols-outlined text-[14px]" x-text="kindIcon(selectedType)"></span><span x-text="kindLabel(selectedType)"></span>
                                </span>
                            </div>
                            <p class="mt-[5px] font-sans text-[13px] text-on-surface-variant" x-text="typeSummary(selectedType)"></p>

                            <!-- ══ PAIRWISE ══ -->
                            <template x-if="selectedType.kind === 'pairwise'">
                                <div class="mt-sm">
                                    <!-- add a pair. For a Prioritized type the left slot is
                                         the priority holder — it becomes fromId. -->
                                    <div class="rel-pairadd flex items-end gap-[10px] bg-surface-container-low border border-outline-variant rounded-lg p-sm">
                                        <template x-for="slot in ['holder','counterpart']" :key="slot">
                                            <!-- click-outside lives on the wrapper, not the popover: the
                                                 trigger sits outside the popover, so the very click that
                                                 opens it would otherwise close it again. -->
                                            <div class="flex-1 relative min-w-0" @click.outside="if (picker.open === slot) closePicker()">
                                                <label class="block font-sans text-[10px] font-semibold uppercase tracking-[.12em] text-on-surface-variant mb-[5px]"
                                                       x-text="selectedType.priority ? roleLabel(selectedType, slot) : 'Person'"></label>
                                                <button type="button" @click="openPicker(slot)"
                                                    class="w-full flex items-center gap-[8px] bg-surface-container-lowest border border-outline-variant rounded-[9px] px-[10px] py-[8px] hover:border-steel transition-colors">
                                                    <span x-show="pairForm[slot + 'Id']"
                                                          class="w-[26px] h-[26px] rounded-full bg-navy text-cream flex items-center justify-center font-sans text-[11px] font-semibold flex-shrink-0"
                                                          x-text="initials(pairForm[slot + 'Name'])"></span>
                                                    <span class="flex-1 text-left font-sans text-[13.5px] truncate"
                                                          :class="pairForm[slot + 'Id'] ? 'font-semibold text-navy-900' : 'text-on-surface-variant'"
                                                          x-text="pairForm[slot + 'Name'] || 'Choose someone…'"></span>
                                                    <span class="material-symbols-outlined text-[18px] text-on-surface-variant">expand_more</span>
                                                </button>

                                                <!-- picker popover -->
                                                <div x-show="picker.open === slot" x-cloak
                                                     class="absolute top-full left-0 right-0 mt-[6px] z-30 bg-surface-container-lowest border border-outline-variant rounded-lg shadow-lg overflow-hidden">
                                                    <div class="p-[10px] border-b border-outline-variant">
                                                        <input type="text" x-model="picker.query" x-init="$watch('picker.open', v => { if (v === slot) $nextTick(() => $el.focus()) })"
                                                               @keydown.arrow-down.prevent="pickerMove(1)"
                                                               @keydown.arrow-up.prevent="pickerMove(-1)"
                                                               @keydown.enter.prevent="pickerChooseHighlighted()"
                                                               @keydown.escape.prevent="closePicker()"
                                                               placeholder="Search people…"
                                                               class="w-full bg-surface border border-outline-variant rounded-[8px] px-[10px] py-[8px] font-sans text-[13.5px] focus:outline-none focus:border-steel focus:ring-2 focus:ring-steel/20" />
                                                    </div>
                                                    <div class="max-h-[216px] overflow-y-auto p-[6px]">
                                                        <template x-for="(opt, i) in pickerOptions" :key="opt.id">
                                                            <button type="button" @click="choosePerson(opt)" @mouseenter="picker.index = i"
                                                                :class="picker.index === i ? 'bg-surface-container' : ''"
                                                                class="w-full flex items-center gap-[8px] rounded-[8px] px-[8px] py-[7px] font-sans text-[13.5px] text-on-surface text-left transition-colors">
                                                                <span class="w-[26px] h-[26px] rounded-full bg-ocean text-white flex items-center justify-center text-[11px] font-semibold flex-shrink-0" x-text="initials(opt.name)"></span>
                                                                <span class="flex-1 truncate" x-text="opt.name"></span>
                                                            </button>
                                                        </template>
                                                        <div x-show="pickerOptions.length === 0" class="py-sm px-[10px] text-center font-sans text-[13px] text-on-surface-variant">
                                                            <span x-show="picker.query">No people match “<span x-text="picker.query"></span>”.</span>
                                                            <span x-show="!picker.query">Nobody left to choose.</span>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        </template>

                                        <div class="rel-arrow flex flex-col items-center text-ocean pb-[9px]"
                                             :title="selectedType.priority ? 'Priority runs left to right' : 'Symmetric — order carries no meaning'">
                                            <span class="material-symbols-outlined text-[26px]" x-text="selectedType.priority ? 'arrow_right_alt' : 'sync_alt'"></span>
                                        </div>

                                        <button @click="addPair()" :disabled="!pairForm.holderId || !pairForm.counterpartId"
                                            class="flex items-center justify-center w-[42px] h-[38px] bg-primary text-on-primary rounded-[9px] shadow-xs hover:bg-primary/90 disabled:opacity-40 disabled:cursor-not-allowed transition-all">
                                            <span class="material-symbols-outlined text-[18px]">add</span>
                                        </button>
                                    </div>

                                    <!-- the pairs themselves -->
                                    <div class="flex flex-col gap-[6px] mt-sm">
                                        <template x-for="pair in pairsForType(selectedType.id)" :key="pair.id">
                                            <div class="group flex items-center gap-[10px] p-[10px] rounded-[10px] border border-transparent hover:bg-surface-container-low hover:border-outline-variant transition-colors">
                                                <span class="w-[30px] h-[30px] rounded-full bg-navy text-cream flex items-center justify-center font-sans text-[11px] font-semibold flex-shrink-0" x-text="initials(personName(pair.fromId))"></span>
                                                <span class="font-sans text-[13.5px] font-semibold text-navy-900" x-text="personName(pair.fromId)"></span>
                                                <span x-show="selectedType.priority" class="bg-secondary-container text-on-secondary-container rounded-sm px-[6px] py-[1px] font-sans text-[10.5px] font-semibold" x-text="labelFor(selectedType, 'holder')"></span>

                                                <span class="material-symbols-outlined text-[20px] text-steel" x-text="selectedType.priority ? 'arrow_right_alt' : 'sync_alt'"></span>

                                                <span x-show="selectedType.priority" class="bg-tertiary-container text-on-tertiary-container rounded-sm px-[6px] py-[1px] font-sans text-[10.5px] font-semibold" x-text="labelFor(selectedType, 'counterpart')"></span>
                                                <span class="font-sans text-[13.5px] font-semibold text-navy-900" x-text="personName(pair.toId)"></span>
                                                <span class="w-[30px] h-[30px] rounded-full bg-ocean text-white flex items-center justify-center font-sans text-[11px] font-semibold flex-shrink-0" x-text="initials(personName(pair.toId))"></span>

                                                <span class="flex-1"></span>
                                                <button @click="removePair(pair)" title="Remove pair"
                                                    class="rel-actions w-[30px] h-[30px] rounded-sm flex items-center justify-center text-on-surface-variant opacity-0 group-hover:opacity-100 hover:bg-error-container hover:text-error transition-all flex-shrink-0">
                                                    <span class="material-symbols-outlined text-[18px]">close</span>
                                                </button>
                                            </div>
                                        </template>

                                        <div x-show="pairsForType(selectedType.id).length === 0"
                                             class="flex items-center gap-[10px] p-md border border-dashed border-outline-variant rounded-md text-on-surface-variant">
                                            <span class="material-symbols-outlined text-[22px] text-outline">group_add</span>
                                            <span class="font-sans text-[13.5px]">No pairs yet. Choose two people above to record the first one.</span>
                                        </div>
                                    </div>
                                </div>
                            </template>

                            <!-- ══ GROUP ══ -->
                            <template x-if="selectedType.kind === 'group'">
                                <div class="mt-sm">
                                    <div class="flex items-center gap-[10px] bg-surface-container-low border border-outline-variant rounded-lg px-sm py-[12px]">
                                        <span class="material-symbols-outlined text-[20px] text-ocean">group_add</span>
                                        <input type="text" x-model="groupForm.name" @keydown.enter="createGroup()"
                                               placeholder="New group name — e.g. Tuesday Bible Study"
                                               class="flex-1 min-w-0 bg-surface-container-lowest border border-outline-variant rounded-[8px] px-[11px] py-[9px] font-sans text-[14px] focus:outline-none focus:border-steel focus:ring-2 focus:ring-steel/20" />
                                        <button @click="createGroup()" :disabled="!groupForm.name.trim()"
                                            class="flex-shrink-0 bg-primary text-on-primary rounded-[9px] px-[14px] py-[9px] font-sans text-[11px] font-semibold uppercase tracking-[.08em] shadow-xs hover:bg-primary/90 disabled:opacity-40 disabled:cursor-not-allowed transition-all">
                                            Create Group
                                        </button>
                                    </div>

                                    <div class="flex flex-col gap-sm mt-sm">
                                        <template x-for="group in groupsForType(selectedType.id)" :key="group.id">
                                            <div class="border border-outline-variant rounded-lg">
                                                <div class="flex items-center justify-between gap-[10px] px-sm py-[12px] bg-surface-container-low border-b border-outline-variant rounded-t-lg">
                                                    <div class="flex items-center gap-[8px] min-w-0">
                                                        <span class="font-serif text-[16px] font-semibold text-navy-900 truncate" x-text="group.name"></span>
                                                        <span class="flex-shrink-0 font-sans text-[11px] text-on-surface-variant bg-surface-container-high px-[7px] rounded-sm"
                                                              x-text="group.memberIds.length + (group.leaderId ? 1 : 0)"></span>
                                                    </div>
                                                    <button @click="deleteGroup(group)" title="Delete group"
                                                        class="w-[30px] h-[30px] rounded-sm flex items-center justify-center text-on-surface-variant hover:bg-error-container hover:text-error transition-colors flex-shrink-0">
                                                        <span class="material-symbols-outlined text-[18px]">delete</span>
                                                    </button>
                                                </div>

                                                <div class="p-sm">
                                                    <!-- Only a Prioritized group has a leader slot. Empty is fine. -->
                                                    <div x-show="selectedType.priority" class="mb-sm">
                                                        <div class="font-sans text-[10px] font-semibold uppercase tracking-[.12em] text-on-surface-variant mb-[6px]" x-text="labelFor(selectedType, 'leader')"></div>

                                                        <div x-show="group.leaderId" class="inline-flex items-center gap-[9px] bg-surface-container-low border border-gold rounded-md pl-[6px] pr-[10px] py-[6px]">
                                                            <span class="relative w-[30px] h-[30px] rounded-full bg-navy text-cream flex items-center justify-center font-sans text-[11px] font-semibold">
                                                                <span x-text="initials(personName(group.leaderId))"></span>
                                                                <span class="material-symbols-outlined absolute -top-[6px] -right-[6px] text-[15px] text-gold">star</span>
                                                            </span>
                                                            <span class="font-sans text-[13.5px] font-semibold text-navy-900" x-text="personName(group.leaderId)"></span>
                                                            <button @click="clearGroupLeader(group)" title="Stand down as leader"
                                                                class="w-[26px] h-[26px] rounded-sm flex items-center justify-center text-on-surface-variant hover:bg-surface-container hover:text-error transition-colors">
                                                                <span class="material-symbols-outlined text-[16px]">close</span>
                                                            </button>
                                                        </div>

                                                        <div x-show="!group.leaderId" class="inline-flex items-center gap-[8px] border border-dashed border-outline-variant rounded-md px-sm py-[8px] font-sans text-[13px] text-on-surface-variant">
                                                            <span class="material-symbols-outlined text-[18px] text-outline">star_border</span>
                                                            No leader yet — promote a member below, or leave it open.
                                                        </div>
                                                    </div>

                                                    <div class="font-sans text-[10px] font-semibold uppercase tracking-[.12em] text-on-surface-variant mb-[8px]"
                                                         x-text="labelFor(selectedType, 'member') + 's'"></div>

                                                    <div class="flex flex-wrap gap-[8px] items-center">
                                                        <template x-for="mid in group.memberIds" :key="mid">
                                                            <div class="group/chip inline-flex items-center gap-[8px] bg-surface-container-low border border-outline-variant rounded-md p-[5px] pr-[6px]">
                                                                <span class="w-[26px] h-[26px] rounded-full bg-ocean text-white flex items-center justify-center font-sans text-[11px] font-semibold" x-text="initials(personName(mid))"></span>
                                                                <span class="font-sans text-[13px] font-semibold text-navy-900" x-text="personName(mid)"></span>
                                                                <div class="rel-actions flex items-center gap-[2px] opacity-0 group-hover/chip:opacity-100 transition-opacity">
                                                                    <!-- promote is only offered when there is a vacant leader slot to fill -->
                                                                    <button x-show="selectedType.priority && !group.leaderId" @click="setGroupLeader(group, mid)" title="Make leader"
                                                                        class="h-[26px] px-[8px] inline-flex items-center gap-[3px] rounded-sm text-on-surface-variant hover:bg-surface-container hover:text-gold font-sans text-[10.5px] font-semibold uppercase tracking-[.06em] transition-colors">
                                                                        <span class="material-symbols-outlined text-[16px]">star</span>Lead
                                                                    </button>
                                                                    <button @click="removeGroupMember(group, mid)" title="Remove from group"
                                                                        class="w-[26px] h-[26px] rounded-sm flex items-center justify-center text-on-surface-variant hover:bg-surface-container hover:text-error transition-colors">
                                                                        <span class="material-symbols-outlined text-[16px]">close</span>
                                                                    </button>
                                                                </div>
                                                            </div>
                                                        </template>

                                                        <!-- add a member. Click-outside sits on the wrapper so the
                                                             trigger click doesn't immediately close the popover. -->
                                                        <div class="relative" @click.outside="if (picker.open === group.id) closePicker()">
                                                            <button @click="openPicker(group.id)"
                                                                class="inline-flex items-center gap-[4px] border border-dashed border-outline-variant rounded-md px-[10px] py-[7px] font-sans text-[12.5px] font-semibold text-on-surface-variant hover:border-steel hover:text-primary transition-colors">
                                                                <span class="material-symbols-outlined text-[18px]">add</span>
                                                                <span x-text="'Add ' + labelFor(selectedType, 'member').toLowerCase()"></span>
                                                            </button>

                                                            <div x-show="picker.open === group.id" x-cloak
                                                                 class="absolute top-full left-0 mt-[6px] z-30 w-[260px] bg-surface-container-lowest border border-outline-variant rounded-lg shadow-lg overflow-hidden">
                                                                <div class="p-[10px] border-b border-outline-variant">
                                                                    <input type="text" x-model="picker.query" x-init="$watch('picker.open', v => { if (v === group.id) $nextTick(() => $el.focus()) })"
                                                                           @keydown.arrow-down.prevent="pickerMove(1)"
                                                                           @keydown.arrow-up.prevent="pickerMove(-1)"
                                                                           @keydown.enter.prevent="pickerChooseHighlighted()"
                                                                           @keydown.escape.prevent="closePicker()"
                                                                           placeholder="Search people…"
                                                                           class="w-full bg-surface border border-outline-variant rounded-[8px] px-[10px] py-[8px] font-sans text-[13.5px] focus:outline-none focus:border-steel focus:ring-2 focus:ring-steel/20" />
                                                                </div>
                                                                <div class="max-h-[216px] overflow-y-auto p-[6px]">
                                                                    <template x-for="(opt, i) in pickerOptions" :key="opt.id">
                                                                        <button type="button" @click="choosePerson(opt)" @mouseenter="picker.index = i"
                                                                            :class="picker.index === i ? 'bg-surface-container' : ''"
                                                                            class="w-full flex items-center gap-[8px] rounded-[8px] px-[8px] py-[7px] font-sans text-[13.5px] text-on-surface text-left transition-colors">
                                                                            <span class="w-[26px] h-[26px] rounded-full bg-ocean text-white flex items-center justify-center text-[11px] font-semibold flex-shrink-0" x-text="initials(opt.name)"></span>
                                                                            <span class="flex-1 truncate" x-text="opt.name"></span>
                                                                        </button>
                                                                    </template>
                                                                    <div x-show="pickerOptions.length === 0" class="py-sm px-[10px] text-center font-sans text-[13px] text-on-surface-variant">
                                                                        Everyone available is already in this group.
                                                                    </div>
                                                                </div>
                                                            </div>
                                                        </div>
                                                    </div>

                                                    <!-- an empty roster is a normal resting state, not a failure -->
                                                    <p x-show="group.memberIds.length === 0" class="mt-[10px] font-sans text-[12.5px] text-on-surface-variant">
                                                        No members yet — an empty group is fine. Add people whenever you're ready.
                                                    </p>
                                                </div>
                                            </div>
                                        </template>

                                        <div x-show="groupsForType(selectedType.id).length === 0"
                                             class="flex items-center gap-[10px] p-md border border-dashed border-outline-variant rounded-md text-on-surface-variant">
                                            <span class="material-symbols-outlined text-[22px] text-outline">diversity_3</span>
                                            <span class="font-sans text-[13.5px]">No groups yet. Name one above to get started.</span>
                                        </div>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </template>

                    <!-- ─── Nothing selected ──────────────────────────────── -->
                    <div x-show="!showTypeForm && !selectedType"
                         class="flex flex-col items-center justify-center gap-sm bg-surface-container-lowest border border-dashed border-outline-variant rounded-xl px-md py-[64px] text-center min-h-[300px]">
                        <span class="material-symbols-outlined text-[40px] text-outline-variant">hub</span>
                        <p class="font-sans text-[14px] leading-relaxed text-on-surface-variant max-w-[34ch]">
                            Select a relationship type on the left to see who holds it — or create a new one.
                        </p>
                    </div>
                </div>
            </div>
        </div>
            </div>
            <div x-show="toast.show" x-cloak x-transition
                 class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 px-lg py-sm rounded-lg shadow-lg font-label-md text-label-md"
                 :class="toast.type === 'error' ? 'bg-error text-on-error' : 'bg-inverse-surface text-inverse-on-surface'">
                <span x-text="toast.message"></span>
            </div>
        </div>
    </template>
