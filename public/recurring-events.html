<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Recurring events | Mosaic</title>

    <link rel="stylesheet" href="mosaic.css" />
    <link rel="stylesheet" href="fonts.css" />

    <script src="mobile-shell.js"></script>
    <link rel="stylesheet" href="mobile-shell.css" />
    <script src="mobile/destinations.js"></script>
    <script>window.MOBILE_HEADER = { title: 'Recurring events', back: 'calendar.html' };</script>
    <script src="person-photo-core.js"></script>
    <script src="mobile-shell-header.js"></script>

    <style>
        [x-cloak] { display: none !important; }

        .re-focus:focus-visible { outline: none; box-shadow: 0 0 0 3px rgba(93,148,169,.18); }
        .re-motion { transition: background-color 150ms cubic-bezier(0.2,0,0,1),
                                 opacity 150ms cubic-bezier(0.2,0,0,1),
                                 border-color 150ms cubic-bezier(0.2,0,0,1); }
        .re-press:active { transform: scale(0.98); }

        /* The shell draws the page title in its own header, so the page's <h1>
           would say it a second time directly underneath. */
        html.shell-mobile .re-page-title { display: none; }
        html.shell-mobile .re-title-block { border-bottom: none; padding-bottom: 0; }

        /* The draft room is a wide grid of dates against Roles and refuses to
           draw itself on a phone — it shows a "needs a computer" panel instead.
           Better not to offer the journey than to end it with a shrug. The rota
           grid below still scrolls sideways, because READING it on a phone is a
           real thing to want; drafting one is not. */
        html.shell-mobile .re-desktop-only { display: none !important; }

        /* The series list sits beside the grid where there is room for both, and
           above it where there is not. */
        .re-cols { display: grid; grid-template-columns: minmax(0,1fr); gap: 28px; align-items: start; }
        @media (min-width: 1100px) { .re-cols { grid-template-columns: 300px minmax(0,1fr); } }

        /* ⚠ THE ROLE COLUMN STAYS PUT. Eight dates of cards is wider than any
           screen, and a grid you can scroll sideways is useless if scrolling it
           takes the row headings away — three columns in you are reading names
           with no idea which Role they are in. */
        .re-grid { border-collapse: separate; border-spacing: 0; }
        .re-grid th, .re-grid td { border-bottom: 1px solid var(--re-rule, var(--surface-dim)); }
        .re-grid .re-stick {
            position: sticky; left: 0; z-index: 2;
            background: var(--surface);
            border-right: 1px solid var(--re-rule, var(--surface-dim));
        }
        .re-grid thead .re-stick { z-index: 3; }
        .re-grid thead th { position: sticky; top: 0; z-index: 1; background: var(--surface); }

        /* A ticked column is tinted the whole way down, so the selection reads
           as "these dates" rather than as a row of checkboxes at the top. */
        .re-grid td.re-picked, .re-grid th.re-picked { background: rgba(93,148,169,.07); }
        .re-grid th.re-picked { background: rgba(93,148,169,.13); }
    </style>

    <script src="vendor/firebase/firebase-app-compat.js"></script>
    <script src="vendor/firebase/firebase-auth-compat.js"></script>
    <script src="vendor/firebase/firebase-firestore-compat.js"></script>
    <script src="local-cache.js"></script>
    <script src="auth.js"></script>
    <script src="date-utils.js"></script>
    <script src="roles-core.js"></script>
    <script src="events-core.js"></script>
    <script src="events-occurrence-core.js"></script>
    <script src="events-store.js"></script>
    <!-- calendar-view.js reads this for "what you are down for" (MS-20).
         Without it the rail card throws and renders blank. -->
    <script src="commitments-core.js"></script>
    <script src="calendar-view.js"></script>
    <script src="recurring-roster-core.js"></script>
    <script src="recurring-events.js"></script>
    <script defer src="vendor/alpine-3.15.12.min.js"></script>
</head>

<body class="bg-background text-on-background font-body-md text-body-md antialiased min-h-screen flex flex-col"
      x-data="recurringEventsPage()" x-cloak>

    <header class="w-full max-w-[1600px] mx-auto px-4 md:px-margin pt-2 md:pt-md flex items-center justify-between">
        <a href="calendar.html" class="flex items-center gap-1 text-on-surface-variant hover:text-primary re-motion">
            <span class="material-symbols-outlined text-[20px]">arrow_back</span>
            <span class="text-xs font-label-md uppercase tracking-wider">Calendar</span>
        </a>
        <div id="auth-container" class="flex items-center"><div class="h-10"></div></div>
    </header>

    <div x-show="loading" class="flex-grow flex items-center justify-center">
        <span class="material-symbols-outlined text-[48px] text-outline animate-spin">progress_activity</span>
    </div>

    <main x-show="!loading" class="flex-grow w-full max-w-[1600px] mx-auto px-4 md:px-margin pb-lg pt-md">

        <!-- Signed out, and signed in without the rank. Two different answers:
             one is a door, the other is a wall, and a single "no" for both
             leaves the first person nowhere to go. -->
        <div x-show="signedOut"
             class="mb-md bg-surface-container-low border border-outline-variant border-l-[3px] rounded-lg
                    px-md py-3 flex items-start gap-sm" style="border-left-color:var(--gold);">
            <span class="material-symbols-outlined text-[20px] shrink-0" style="color:var(--gold);">person_off</span>
            <div class="flex-grow min-w-0">
                <p class="text-[14px] text-on-surface">You are not signed in.</p>
                <p class="text-[12.5px] text-on-surface-variant mt-0.5">
                    Sign in to see the events that repeat and who is on them.
                </p>
            </div>
            <a :href="signInHref"
               class="shrink-0 bg-primary text-on-primary px-3 py-2 rounded-lg font-label-md
                      text-[11.5px] uppercase tracking-wider re-motion re-press re-focus">Sign in</a>
        </div>

        <!-- ── Browsing: signed in, nothing to change ─────────────────────── -->
        <!-- The same events, the same order, minus every control that writes.
             Tap one to see when it next falls. -->
        <template x-if="browsing">
        <div class="max-w-[620px]">
            <div class="re-title-block pb-md border-b border-outline-variant">
                <h1 class="re-page-title font-display text-headline-lg tracking-[.02em] text-primary">
                    Recurring events
                </h1>
                <p class="text-[13px] text-on-surface-variant mt-1 max-w-[52ch]">
                    Everything that comes round again. Open one to see when it next falls.
                </p>
            </div>

            <div x-show="error"
                 class="mt-md bg-error-container text-on-error-container border border-outline-variant
                        rounded-lg p-md flex items-start gap-sm">
                <span class="material-symbols-outlined text-[20px]">error</span>
                <p class="font-body-md text-body-md" x-text="error"></p>
            </div>

            <div x-show="!series.length"
                 class="mt-gutter bg-surface-container-lowest border border-outline-variant rounded-lg p-lg text-center">
                <span class="material-symbols-outlined text-[34px] text-outline">event_repeat</span>
                <h2 class="font-display text-[20px] text-primary mt-2">Nothing repeats yet.</h2>
                <p class="text-[13.5px] text-on-surface-variant mt-1 max-w-[46ch] mx-auto">
                    When the church has something that comes round — a Sunday, a midweek
                    gathering — it appears here.
                </p>
            </div>

            <div x-show="series.length" class="mt-gutter flex flex-col gap-2">
                <template x-for="s in series" :key="s.id">
                    <div class="rounded-lg border re-motion overflow-hidden"
                         :class="isOpen(s.id)
                            ? 'border-primary bg-surface-container-low'
                            : 'border-outline-variant bg-surface-container-lowest hover:bg-surface-container-low'">

                        <button @click="toggleSeries(s.id)" :disabled="gridLoading"
                                :aria-expanded="isOpen(s.id) ? 'true' : 'false'"
                                class="w-full text-left px-3 py-3 flex items-start gap-2 re-focus disabled:opacity-60">
                            <span class="w-[10px] h-[10px] rounded-full mt-1.5 shrink-0 border border-black/10"
                                  :style="'background:' + colourOf(s).bar"></span>
                            <span class="min-w-0 flex-grow">
                                <span class="block text-[15px] text-on-surface"
                                      :class="isOpen(s.id) ? 'font-semibold' : ''"
                                      x-text="s.name"></span>
                                <span class="block text-[12.5px] text-on-surface-variant mt-0.5"
                                      x-text="patternOf(s)"></span>
                                <span class="block text-[11.5px] text-outline mt-0.5">
                                    Next <span x-text="nextDateOf(s)"></span>
                                </span>
                            </span>
                            <span class="material-symbols-outlined text-[20px] text-on-surface-variant shrink-0
                                         re-motion mt-0.5"
                                  :style="isOpen(s.id) ? 'transform:rotate(180deg)' : ''">expand_more</span>
                        </button>

                        <!-- x-if, not x-show. The dates below belong to whichever
                             row is OPEN, so a hidden copy under every other row
                             would be that row rendering someone else's dates and
                             merely not showing them. -->
                        <template x-if="isOpen(s.id)">
                        <div class="border-t border-outline-variant px-3 py-3">

                            <p x-show="s.description" class="text-[13px] text-on-surface-variant mb-3"
                               x-text="s.description"></p>

                            <div x-show="gridLoading" class="flex items-center gap-1.5 text-[12.5px] text-on-surface-variant py-1">
                                <span class="material-symbols-outlined text-[16px] animate-spin">progress_activity</span>
                                Reading the dates
                            </div>

                            <div x-show="!gridLoading">
                                <div class="text-[10.5px] font-label-md tracking-[.14em] uppercase text-on-surface-variant mb-2">
                                    Coming up
                                </div>

                                <p x-show="finished" class="text-[13px] text-on-surface-variant">
                                    This one has finished — there are no more dates coming.
                                </p>

                                <div class="flex flex-col gap-1">
                                    <template x-for="row in upcoming" :key="row.date">
                                        <a :href="dateHref(row.date)"
                                           class="flex items-center gap-2 px-2 py-2 rounded-lg re-motion re-focus
                                                  hover:bg-surface-container">
                                            <span class="material-symbols-outlined text-[18px] shrink-0"
                                                  :class="row.cancelled ? 'text-outline' : 'text-on-surface-variant'"
                                                  x-text="row.cancelled ? 'event_busy' : 'event'"></span>
                                            <span class="min-w-0 flex-grow text-[13.5px]"
                                                  :class="row.cancelled ? 'text-outline line-through' : 'text-on-surface'"
                                                  x-text="longDate(row.date)"></span>
                                            <!-- Two things worth flagging on a date,
                                                 and neither is guessable from the
                                                 date itself. -->
                                            <span x-show="row.cancelled"
                                                  class="shrink-0 text-[11px] font-label-md uppercase tracking-wider text-outline">
                                                Not on
                                            </span>
                                            <span x-show="row.mine && !row.cancelled"
                                                  class="shrink-0 flex items-center gap-1 text-[11px] font-label-md
                                                         uppercase tracking-wider text-secondary">
                                                <span class="material-symbols-outlined text-[14px]">person_check</span>
                                                You're on
                                            </span>
                                            <span class="material-symbols-outlined text-[16px] text-outline shrink-0">chevron_right</span>
                                        </a>
                                    </template>
                                </div>

                                <p x-show="upcoming.length" class="mt-2 text-[11.5px] text-outline">
                                    The Calendar has the rest.
                                </p>
                            </div>
                        </div>
                        </template>
                    </div>
                </template>
            </div>
        </div>
        </template>

        <template x-if="isEditor">
        <div>
            <!-- ── Title ──────────────────────────────────────────────────── -->
            <div class="re-title-block pb-md border-b border-outline-variant flex items-start justify-between gap-md flex-wrap">
                <div class="min-w-0">
                    <h1 class="re-page-title font-display text-headline-lg tracking-[.02em] text-primary">
                        Recurring events
                    </h1>
                    <p class="text-[13px] text-on-surface-variant mt-1 max-w-[62ch]">
                        Everything that comes round again. Read the rota, tick the dates that need
                        redrawing, and change the event itself from here.
                    </p>
                </div>
                <a :href="newEventHref"
                   class="shrink-0 flex items-center gap-1 bg-primary text-on-primary px-md py-2 rounded-lg shadow-xs
                          font-label-md text-xs uppercase tracking-wider re-motion re-press re-focus hover:bg-primary-container">
                    <span class="material-symbols-outlined text-[18px]">add</span> New recurring event
                </a>
            </div>

            <div x-show="error"
                 class="mt-md bg-error-container text-on-error-container border border-outline-variant
                        rounded-lg p-md flex items-start gap-sm">
                <span class="material-symbols-outlined text-[20px]">error</span>
                <p class="font-body-md text-body-md" x-text="error"></p>
            </div>

            <!-- Nothing repeats yet. Only reachable on a church with no Sunday
                 Service at all, but that is exactly the state a fresh install is
                 in, and an empty grid with no explanation is a dead end. -->
            <div x-show="!series.length"
                 class="mt-gutter bg-surface-container-lowest border border-outline-variant rounded-lg p-lg text-center">
                <span class="material-symbols-outlined text-[34px] text-outline">event_repeat</span>
                <h2 class="font-display text-[20px] text-primary mt-2">Nothing repeats yet.</h2>
                <p class="text-[13.5px] text-on-surface-variant mt-1 max-w-[46ch] mx-auto">
                    A recurring event is anything that comes round — a Sunday, a midweek
                    gathering, an elders' meeting. Make the first one and its rota appears here.
                </p>
            </div>

            <div x-show="series.length" class="mt-gutter re-cols">

                <!-- ── The series ─────────────────────────────────────────── -->
                <aside class="flex flex-col gap-2 min-w-0">
                    <div class="text-[10.5px] font-label-md tracking-[.14em] uppercase text-on-surface-variant px-1">
                        The events
                    </div>

                    <template x-for="s in series" :key="s.id">
                        <div class="rounded-lg border re-motion overflow-hidden"
                             :class="s.id === seriesId
                                ? 'border-primary bg-surface-container-low'
                                : 'border-outline-variant bg-surface-container-lowest hover:bg-surface-container-low'">
                            <button @click="choose(s.id)" :disabled="gridLoading"
                                    class="w-full text-left px-3 py-2.5 flex items-start gap-2 re-focus disabled:opacity-60">
                                <span class="w-[10px] h-[10px] rounded-full mt-1.5 shrink-0 border border-black/10"
                                      :style="'background:' + colourOf(s).bar"></span>
                                <span class="min-w-0 flex-grow">
                                    <span class="block text-[14.5px] text-on-surface truncate"
                                          :class="s.id === seriesId ? 'font-semibold' : ''"
                                          x-text="s.name"></span>
                                    <span class="block text-[12px] text-on-surface-variant truncate mt-0.5"
                                          x-text="patternOf(s)"></span>
                                    <span class="block text-[11.5px] text-outline mt-0.5">
                                        <span x-text="roleCountOf(s)"></span>
                                        <span> · next </span><span x-text="nextDateOf(s)"></span>
                                    </span>
                                </span>
                            </button>
                            <!-- The door to the Event itself. On the row rather
                                 than only above the grid, so changing a pattern
                                 does not need the rota loaded first. -->
                            <a :href="seriesHref(s.id)"
                               class="flex items-center gap-1 px-3 py-1.5 border-t border-outline-variant text-[11.5px]
                                      font-label-md uppercase tracking-wider text-secondary re-motion re-focus
                                      hover:bg-surface-container">
                                <span class="material-symbols-outlined text-[15px]">tune</span> Edit the event
                            </a>
                        </div>
                    </template>
                </aside>

                <!-- ── The rota ───────────────────────────────────────────── -->
                <section class="min-w-0" x-show="chosen">

                    <div class="flex items-start justify-between gap-md flex-wrap pb-sm border-b border-outline-variant">
                        <div class="min-w-0">
                            <h2 class="font-display text-[22px] text-primary truncate"
                                x-text="chosen ? chosen.name : ''"></h2>
                            <p class="text-[12.5px] text-on-surface-variant mt-0.5"
                               x-text="chosen ? patternOf(chosen) : ''"></p>
                        </div>
                        <div class="shrink-0 flex items-center gap-sm">
                            <a :href="eventHref"
                               class="flex items-center gap-1 border border-secondary text-secondary px-md py-2 rounded-lg
                                      font-label-md text-xs uppercase tracking-wider re-motion re-press re-focus hover:bg-surface-container">
                                <span class="material-symbols-outlined text-[18px]">tune</span> Edit the event
                            </a>
                            <!-- The same room, opened blank. Outlined and first,
                                 so the ordinary journey stays the filled one
                                 beside it — this is the answer to "I already
                                 know who I want", not the common case. -->
                            <a :href="byHandHref"
                               class="re-desktop-only flex items-center gap-1 border border-secondary text-secondary px-md py-2 rounded-lg
                                      font-label-md text-xs uppercase tracking-wider re-motion re-press re-focus hover:bg-surface-container">
                                <span class="material-symbols-outlined text-[18px]">edit_note</span>
                                <span x-text="byHandLabel"></span>
                            </a>
                            <!-- Staffing a RUN of dates, for the series already
                                 open. Hidden on a phone, because the room it
                                 opens is a wide grid of dates against Roles and
                                 says as much when you get there — better not to
                                 offer the journey than to end it with a shrug. -->
                            <a :href="draftHref"
                               class="re-desktop-only flex items-center gap-1 bg-primary text-on-primary px-md py-2 rounded-lg
                                      shadow-xs font-label-md text-xs uppercase tracking-wider re-motion re-press re-focus
                                      hover:bg-primary-container">
                                <span class="material-symbols-outlined text-[18px]">auto_awesome_motion</span>
                                <span x-text="draftLabel"></span>
                            </a>
                        </div>
                    </div>

                    <!-- Says which dates it will take before you press it. With
                         nothing ticked that is the draft room's own default —
                         the next stretch from tomorrow — and an editor who
                         expected "the ones on screen" should find that out here
                         rather than on the other side. -->
                    <p x-show="!range" class="re-desktop-only mt-2 text-[12px] text-on-surface-variant">
                        Both buttons open the next stretch of dates from tomorrow — auto-assign
                        with a rota drafted for you, by hand with the grid empty. Tick columns
                        below to open exactly those dates instead.
                    </p>

                    <!-- Paging, and what the window covers -->
                    <div class="mt-sm flex items-center gap-sm flex-wrap">
                        <button @click="earlier()" :disabled="!hasEarlier || gridLoading"
                                class="flex items-center gap-1 border border-outline-variant text-on-surface-variant
                                       px-3 py-1.5 rounded-lg font-label-md text-[11.5px] uppercase tracking-wider
                                       re-motion re-press re-focus hover:bg-surface-container disabled:opacity-40">
                            <span class="material-symbols-outlined text-[16px]">chevron_left</span> Earlier
                        </button>
                        <span class="text-[13px] text-on-surface font-label-md" x-text="windowLabel"></span>
                        <button @click="later()" :disabled="!hasLater || gridLoading"
                                class="flex items-center gap-1 border border-outline-variant text-on-surface-variant
                                       px-3 py-1.5 rounded-lg font-label-md text-[11.5px] uppercase tracking-wider
                                       re-motion re-press re-focus hover:bg-surface-container disabled:opacity-40">
                            Later <span class="material-symbols-outlined text-[16px]">chevron_right</span>
                        </button>
                        <button @click="backToToday()" :disabled="gridLoading"
                                class="text-[11.5px] font-label-md uppercase tracking-wider text-secondary
                                       px-2 py-1.5 rounded-lg re-motion re-focus hover:bg-surface-container">
                            Back to now
                        </button>
                        <span x-show="gridLoading" class="flex items-center gap-1 text-[12px] text-on-surface-variant">
                            <span class="material-symbols-outlined text-[16px] animate-spin">progress_activity</span>
                            Reading the rota
                        </span>
                    </div>

                    <!-- What ticking columns is FOR. Absent until something is
                         ticked, so it never sits there as an instruction. -->
                    <div x-show="range"
                         class="mt-sm bg-surface-container-low border border-outline-variant border-l-[3px] rounded-lg
                                px-md py-3 flex items-start gap-sm" style="border-left-color:var(--tertiary);">
                        <span class="material-symbols-outlined text-[20px] shrink-0" style="color:var(--tertiary);">auto_awesome_motion</span>
                        <div class="flex-grow min-w-0">
                            <p class="text-[14px] text-on-surface">
                                <span x-text="range ? range.count : 0"></span>
                                <span x-text="range && range.count === 1 ? ' date ticked' : ' dates ticked'"></span>
                            </p>
                            <p x-show="sweepNote" class="text-[12.5px] text-on-surface-variant mt-0.5" x-text="sweepNote"></p>
                            <!-- Why the emptying button is dead, when it is. A
                                 control that correctly does nothing and says
                                 nothing cannot be told from a broken one. -->
                            <p x-show="wipeNote" class="text-[12.5px] text-on-surface-variant mt-0.5" x-text="wipeNote"></p>
                        </div>
                        <div class="shrink-0 flex items-center justify-end gap-sm flex-wrap">
                            <button @click="clearSelection()"
                                    class="px-3 py-2 rounded-lg font-label-md text-[11.5px] uppercase tracking-wider
                                           text-on-surface-variant re-motion re-focus hover:bg-surface-container">Clear</button>
                            <!-- "Clear" above unticks; this empties. They cannot
                                 both be called clearing, and the words have to
                                 do the separating because the two controls sit
                                 an inch apart.

                                 Outlined rather than filled, and second in the
                                 row: the ordinary journey from here is the draft
                                 room, and this should be findable without ever
                                 being the thing your eye lands on. -->
                            <button @click="takeEverybodyOff()" :disabled="!canWipe"
                                    class="flex items-center gap-1 border border-error text-error px-3 py-2 rounded-lg
                                           font-label-md text-[11.5px] uppercase tracking-wider re-motion re-press re-focus
                                           hover:bg-error-container disabled:opacity-40 disabled:hover:bg-transparent">
                                <span class="material-symbols-outlined text-[16px]"
                                      x-text="clearing ? 'progress_activity' : 'person_remove'"
                                      :class="clearing ? 'animate-spin' : ''"></span>
                                <span x-text="wipeLabel"></span>
                            </button>
                            <!-- Both doors as they appear above the grid, said
                                 the same way. Repeated here because this is
                                 where the ticking happened, and the header can
                                 be scrolled off by a long list of Roles. -->
                            <a :href="byHandHref"
                               class="re-desktop-only flex items-center gap-1 border border-secondary text-secondary px-3 py-2 rounded-lg
                                      font-label-md text-[11.5px] uppercase tracking-wider re-motion re-press re-focus
                                      hover:bg-surface-container">
                                <span x-text="byHandLabel"></span>
                                <span class="material-symbols-outlined text-[16px]">north_east</span>
                            </a>
                            <a :href="draftHref"
                               class="re-desktop-only flex items-center gap-1 bg-primary text-on-primary px-3 py-2 rounded-lg
                                      shadow-xs font-label-md text-[11.5px] uppercase tracking-wider re-motion re-press re-focus">
                                <span x-text="draftLabel"></span>
                                <span class="material-symbols-outlined text-[16px]">north_east</span>
                            </a>
                        </div>
                    </div>

                    <!-- No Roles on the series at all -->
                    <div x-show="!hasRoles"
                         class="mt-md bg-surface-container-lowest border border-outline-variant rounded-lg p-lg text-center">
                        <span class="material-symbols-outlined text-[30px] text-outline">badge</span>
                        <h3 class="font-display text-[18px] text-primary mt-2">No roles on this event yet.</h3>
                        <p class="text-[13px] text-on-surface-variant mt-1 max-w-[46ch] mx-auto">
                            Add the jobs that come round every time — welcome team, sound desk,
                            coffee — and the rota appears here.
                        </p>
                        <a :href="eventHref"
                           class="inline-flex items-center gap-1 mt-3 border border-secondary text-secondary px-md py-2
                                  rounded-lg font-label-md text-xs uppercase tracking-wider re-motion re-press re-focus">
                            <span class="material-symbols-outlined text-[18px]">tune</span> Add roles
                        </a>
                    </div>

                    <!-- ── Rules across two Roles (MS-221) ────────────────────
                         A Role's own rules live in the Roles Manager, because
                         they are facts about that Role wherever it runs. "The
                         Kids Leader and the Kids Helper must not be married to
                         each other" is not: it is a fact about THIS event, the
                         only thing that knows the two run together. So it is
                         written here, under the Roles it is about. -->
                    <div x-show="hasRoles" class="mt-md bg-surface-container-lowest border border-outline-variant rounded-lg p-md">
                        <div class="flex items-center gap-2">
                            <span class="material-symbols-outlined text-[18px] text-secondary">hub</span>
                            <h3 class="font-label-md text-xs uppercase tracking-wider text-on-surface-variant">
                                Rules across two roles
                            </h3>
                        </div>
                        <p class="text-[13px] text-on-surface-variant mt-1 max-w-[62ch]">
                            For things no single role can say — a leader and their helper who must not
                            be from one household, or a team drawn from one house group.
                        </p>

                        <ul x-show="pairRules.length" class="flex flex-col gap-2 mt-3">
                            <template x-for="(rule, index) in pairRules" :key="index">
                                <li class="group flex items-center gap-2 px-2 py-2 rounded-lg border bg-surface"
                                    :class="pairRuleAvailable(rule) ? 'border-outline-variant' : 'border-error'">
                                    <span class="material-symbols-outlined text-[18px] flex-shrink-0"
                                          :class="pairRuleAvailable(rule) ? 'text-secondary' : 'text-error'"
                                          x-text="rule.kind === 'sameGroup' ? 'groups' : 'group_remove'"></span>
                                    <span class="flex-grow font-serif text-[15px] leading-snug"
                                          :class="pairRuleAvailable(rule) ? 'text-on-surface' : 'text-error'"
                                          x-text="pairRuleSentence(rule)"></span>
                                    <button @click="removePairRule(index)" title="Remove this rule"
                                            :disabled="savingPairRule"
                                            class="w-8 h-8 flex-shrink-0 flex items-center justify-center rounded-lg text-on-surface-variant hover:text-error disabled:opacity-40">
                                        <span class="material-symbols-outlined text-[18px]">close</span>
                                    </button>
                                </li>
                            </template>
                        </ul>

                        <div class="mt-3 bg-surface-container-low border border-outline-variant rounded-lg p-sm flex flex-col gap-2">
                            <div class="flex flex-col lg:flex-row lg:items-center gap-2">
                                <select x-model="newPairRoleA"
                                        class="w-full lg:flex-1 lg:min-w-0 border border-outline-variant rounded-lg pl-sm pr-8 py-sm text-[14px] bg-surface re-focus">
                                    <option value="">Pick a role…</option>
                                    <template x-for="option in pairRoleOptions" :key="option.slug">
                                        <option :value="option.slug" x-text="option.name"></option>
                                    </template>
                                </select>
                                <span class="text-[13px] text-on-surface-variant self-center">and</span>
                                <select x-model="newPairRoleB"
                                        class="w-full lg:flex-1 lg:min-w-0 border border-outline-variant rounded-lg pl-sm pr-8 py-sm text-[14px] bg-surface re-focus">
                                    <option value="">Pick a role…</option>
                                    <template x-for="option in pairRoleOptions" :key="option.slug">
                                        <option :value="option.slug" x-text="option.name"></option>
                                    </template>
                                </select>
                            </div>
                            <div class="flex flex-col lg:flex-row lg:items-center gap-2">
                                <!-- The same two sentence openers the Roles Manager
                                     uses for the one-Role version, on purpose. -->
                                <select x-model="newPairKind"
                                        class="w-full lg:w-[17.5rem] lg:flex-shrink-0 border border-outline-variant rounded-lg pl-sm pr-8 py-sm text-[14px] bg-surface re-focus">
                                    <option value="notSameGroup">cannot be from the same</option>
                                    <option value="sameGroup">must be from the same</option>
                                </select>
                                <select x-model="newPairTypeId"
                                        class="w-full lg:flex-grow lg:min-w-0 border border-outline-variant rounded-lg pl-sm pr-8 py-sm text-[14px] bg-surface re-focus">
                                    <option value="">Choose a relationship…</option>
                                    <template x-for="option in pairTypeOptions" :key="option.id">
                                        <option :value="option.id" x-text="option.name"></option>
                                    </template>
                                </select>
                                <button @click="addPairRule()"
                                        :disabled="savingPairRule"
                                        class="lg:flex-shrink-0 px-md py-sm text-xs font-label-md uppercase tracking-wider text-secondary border border-secondary rounded-lg hover:bg-secondary hover:text-on-secondary re-motion re-press re-focus disabled:opacity-40">
                                    Add rule
                                </button>
                            </div>

                            <template x-for="problem in pairRuleErrors" :key="problem">
                                <p class="text-[13px] text-error" x-text="problem"></p>
                            </template>

                            <!-- An empty picker and a failed read look identical
                                 from the outside and mean opposite things. -->
                            <p x-show="groupTypesDenied" class="text-[13px] text-error">
                                The relationship types could not be read, so only Family and Marriage
                                are on offer. Ask an elder or admin to check.
                            </p>
                        </div>
                    </div>

                    <!-- ── The grid ───────────────────────────────────────── -->
                    <div x-show="hasRoles && grid" class="mt-md">
                        <div class="border border-outline-variant rounded-lg overflow-hidden bg-surface-container-lowest">
                            <div class="overflow-x-auto">
                                <table class="re-grid w-full text-left" style="--re-rule:#E4DACE;">
                                    <thead>
                                        <tr>
                                            <th class="re-stick px-3 py-2 min-w-[170px] align-bottom">
                                                <label class="flex items-center gap-2 cursor-pointer">
                                                    <input type="checkbox" :checked="allShown"
                                                           @change="toggleAllShown()"
                                                           class="accent-primary re-focus" />
                                                    <span class="text-[10.5px] font-label-md tracking-[.14em] uppercase text-on-surface-variant">
                                                        Role
                                                    </span>
                                                </label>
                                            </th>
                                            <template x-for="col in grid.columns" :key="col.date">
                                                <th class="px-3 py-2 min-w-[150px] align-bottom"
                                                    :class="isSelected(col.date) ? 're-picked' : ''">
                                                    <label class="flex items-start gap-2 cursor-pointer">
                                                        <input type="checkbox" :checked="isSelected(col.date)"
                                                               @change="toggle(col.date)"
                                                               class="accent-primary mt-0.5 re-focus" />
                                                        <span class="min-w-0">
                                                            <a :href="dateHref(col.date)" @click.stop
                                                               class="block hover:text-primary re-motion re-focus">
                                                                <span class="block text-[10.5px] font-label-md tracking-[.12em]
                                                                             uppercase text-on-surface-variant"
                                                                      x-text="weekday(col.date)"></span>
                                                                <span class="block text-[13.5px] text-on-surface"
                                                                      x-text="shortDate(col.date)"></span>
                                                            </a>
                                                            <!-- The state of the date in one line, so an
                                                                 editor picks columns from the header rather
                                                                 than by reading every cell under it. -->
                                                            <span class="block text-[11px] mt-0.5"
                                                                  :class="col.cancelled ? 'text-outline'
                                                                        : col.declined ? 'text-error'
                                                                        : col.empty ? 'text-on-surface-variant' : 'text-success'">
                                                                <span x-show="col.cancelled">Cancelled</span>
                                                                <span x-show="!col.cancelled && col.untouched">Nobody yet</span>
                                                                <span x-show="!col.cancelled && !col.untouched && col.empty"
                                                                      x-text="col.empty + ' to fill'"></span>
                                                                <span x-show="!col.cancelled && !col.untouched && !col.empty">Full</span>
                                                                <span x-show="!col.cancelled && col.declined"
                                                                      x-text="' · ' + col.declined + ' declined'"></span>
                                                            </span>
                                                        </span>
                                                    </label>
                                                </th>
                                            </template>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <template x-for="row in grid.rows" :key="row.key">
                                            <tr class="align-top">
                                                <th class="re-stick px-3 py-2.5 font-normal">
                                                    <span class="block text-[13.5px] text-on-surface" x-text="row.name"></span>
                                                    <span x-show="row.kind === 'oneOff'"
                                                          class="block text-[11px] text-outline mt-0.5">
                                                        Just this date
                                                    </span>
                                                    <span x-show="row.kind === 'role' && row.placeCount"
                                                          class="block text-[11px] text-outline mt-0.5"
                                                          x-text="row.placeCount + (row.placeCount === 1 ? ' place' : ' places')"></span>
                                                </th>

                                                <template x-for="cell in row.cells" :key="row.key + cell.date">
                                                    <td class="px-3 py-2.5"
                                                        :class="isSelected(cell.date) ? 're-picked' : ''">
                                                        <!-- A cancelled date, and a one-off's other columns,
                                                             say so rather than sitting blank — a blank cell
                                                             reads as a place somebody forgot to fill. -->
                                                        <span x-show="cell.cancelled" class="text-[12px] text-outline">—</span>
                                                        <span x-show="!cell.cancelled && !cell.applicable"
                                                              class="text-[12px] text-outline">·</span>

                                                        <div x-show="cell.applicable" class="flex flex-col gap-1">
                                                            <template x-for="(place, i) in cell.places" :key="i">
                                                                <div>
                                                                    <div x-show="place.filled"
                                                                         class="flex items-center gap-1.5">
                                                                        <span class="w-[22px] h-[22px] rounded-full shrink-0 flex items-center
                                                                                     justify-center text-[9.5px] font-label-md border"
                                                                              :class="place.card && place.card.declined
                                                                                ? 'bg-error-container text-on-error-container border-error'
                                                                                : 'bg-surface-container-high border-outline-variant'"
                                                                              x-text="place.card ? place.card.initials : ''"></span>
                                                                        <span class="text-[13px] min-w-0 truncate"
                                                                              :class="place.card && place.card.declined
                                                                                ? 'text-error line-through' : 'text-on-surface'"
                                                                              x-text="place.card ? place.card.name : ''"></span>
                                                                    </div>
                                                                    <!-- An unfilled place is DRAWN. The whole
                                                                         point of reading ahead is seeing the
                                                                         hole before the morning it matters. -->
                                                                    <div x-show="!place.filled"
                                                                         class="flex items-center gap-1.5 text-outline">
                                                                        <span class="w-[22px] h-[22px] rounded-full shrink-0 border border-dashed
                                                                                     border-outline-variant"></span>
                                                                        <span class="text-[12.5px] italic">Nobody yet</span>
                                                                    </div>
                                                                </div>
                                                            </template>
                                                            <span x-show="!cell.places.length"
                                                                  class="text-[12px] text-outline">—</span>
                                                        </div>
                                                    </td>
                                                </template>
                                            </tr>
                                        </template>
                                    </tbody>
                                </table>
                            </div>
                        </div>

                        <!-- Where the liturgy actually lives. Said once, under the
                             grid, because an editor who knows this series has a
                             preacher will otherwise read its absence as a fault. -->
                        <p x-show="hasLiturgy" class="mt-sm text-[12px] text-on-surface-variant flex items-start gap-1.5">
                            <span class="material-symbols-outlined text-[15px] shrink-0 mt-px">menu_book</span>
                            <span>
                                Preaching, leading and the rest of the liturgy are not on this grid — they
                                belong to the order of service, one date at a time, which is what keeps the
                                printed booklet safe.
                            </span>
                        </p>
                        <p class="mt-1 text-[12px] text-on-surface-variant">
                            Tap a date to open it on its own. Tick dates to redraw them together.
                        </p>
                    </div>
                </section>
            </div>
        </div>
        </template>
    </main>
</body>
</html>
