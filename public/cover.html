<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Needing Somebody — Mosaic</title>

    <link rel="stylesheet" href="mosaic.css" />
    <link rel="stylesheet" href="fonts.css" />
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0,0" />

    <style>
        [x-cloak] { display: none !important; }
        .press { transition: all 180ms cubic-bezier(0.2, 0, 0, 1); }
        .press:active { transform: scale(0.98); }
    </style>

    <script src="vendor/firebase/firebase-app-compat.js"></script>
    <script src="vendor/firebase/firebase-auth-compat.js"></script>
    <script src="vendor/firebase/firebase-firestore-compat.js"></script>
    <!-- Taking a place goes through a callable: it moves the roster row and the
         occurrence's derived fields together, and re-checks eligibility with the
         full roster, which the browser cannot see. -->
    <script src="vendor/firebase/firebase-functions-compat.js"></script>

    <script src="local-cache.js"></script>
    <script src="auth.js"></script>
    <script src="date-utils.js"></script>
    <script src="roles-core.js"></script>
    <script src="events-core.js"></script>
    <script src="events-occurrence-core.js"></script>
    <script src="away-core.js"></script>
    <script src="commitments-core.js"></script>
    <script src="events-store.js"></script>
    <script src="cover-core.js"></script>
    <script src="cover-store.js"></script>
    <script src="cover.js"></script>
    <script defer src="vendor/alpine-3.15.12.min.js"></script>
</head>

<body class="bg-background text-on-surface font-body-md antialiased"
      x-data="coverPage()" x-cloak>

<!-- No <header> here either before MS-187. -->
<header class="m-header">
    <div class="m-header__inner">
        <div class="m-header__lead">
            <a href="calendar.html" class="m-back">
                <span class="material-symbols-outlined">chevron_left</span>
                <span class="m-back__label">Calendar</span>
            </a>
            <div class="m-header__titles">
                <h1 class="m-header__title">Needing Somebody</h1>
            </div>
        </div>
        <div class="m-header__rule"></div>
        <div class="m-header__auth" id="auth-container"></div>
    </div>
</header>

<main class="max-w-[860px] mx-auto px-md pb-16">

    <div class="mt-md pb-[18px] border-b border-outline-variant">
        <!-- Says how many you can take, not just how many there are. The gap
             between the two numbers is the honest picture, and stating it up
             front stops the refusals further down reading as a surprise. -->
        <p x-show="headline" class="mt-2 font-serif text-[18px] leading-[1.45] text-on-surface"
           x-text="headline"></p>
    </div>

    <div x-show="loading" class="py-16 text-center text-on-surface-variant text-[13px]">Loading…</div>

    <div x-show="error" x-text="error"
         class="mt-md rounded-lg border border-error bg-error-container text-on-error-container px-md py-3 text-[14px]"></div>

    <!-- ── Nothing needing anybody ───────────────────────────────────────── -->
    <!-- Empty is GOOD NEWS here, and reads as it: a tick, not a shrug. -->
    <template x-if="isEmpty">
        <div class="py-[72px] px-2 text-center">
            <span class="material-symbols-outlined text-[42px] text-steel">task_alt</span>
            <div class="font-headline-lg text-[20px] tracking-[.02em] text-primary mt-4">Nothing Needs Covering</div>
            <p class="mt-2.5 mx-auto max-w-[36ch] font-serif text-[17px] leading-[1.5] text-on-surface-variant">
                Every place on the dates ahead has somebody in it.
            </p>
            <a href="commitments.html"
               class="inline-flex items-center gap-1.5 mt-[22px] text-[11px] uppercase tracking-[.14em] text-secondary">
                Your Commitments <span class="material-symbols-outlined text-[16px]">chevron_right</span>
            </a>
        </div>
    </template>

    <!-- ── One list ──────────────────────────────────────────────────────── -->
    <!--
         ⚠ REFUSALS SIT LEVEL. Same row, same weight, same order, soonest first.
         The reason replaces the button and nothing else changes — no red, no
         dimming, no strikethrough.

         The list shows what you cannot take because hiding it would understate
         how much the church needs (ADR-0030 §2). But a list that then
         dramatises half its rows as failures reads as a wall of no, and the
         reader gives up before the row they could have filled. Level and quiet
         is the whole treatment.
    -->
    <div x-show="!loading && !isEmpty"
         class="mt-6 bg-surface-container-lowest border border-outline-variant rounded-lg overflow-hidden">
        <template x-for="row in rows" :key="row.key">
            <div class="flex flex-col md:flex-row md:items-center gap-3 md:gap-4
                        px-[18px] py-4 border-b border-outline-variant last:border-b-0">

                <div class="flex items-start gap-3.5 flex-grow min-w-0">
                    <div class="w-[62px] shrink-0">
                        <div class="font-headline-lg text-[21px] text-primary leading-none" x-text="row.dayNum"></div>
                        <div class="text-[9px] uppercase tracking-[.1em] text-on-surface-variant mt-[3px]" x-text="row.mon"></div>
                        <!-- Urgency lives HERE, in words, not in the colour of
                             the row. A list already sorted soonest-first should
                             not also shout at its own top. -->
                        <div class="mt-[5px] text-[10px] uppercase tracking-[.08em]"
                             :class="row.soon ? 'text-warning' : 'text-on-surface-variant'"
                             x-text="row.when"></div>
                    </div>
                    <div class="min-w-0 flex-grow">
                        <div class="text-[16px] text-on-surface leading-[1.3]" x-text="row.roleName"></div>
                        <div class="mt-[3px] text-[12.5px] text-on-surface-variant">
                            <span x-text="row.eventName"></span> · <span x-text="row.weekday"></span>
                        </div>
                        <!-- What the job is (MS-222). ⚠ THIS LIST MOST OF ALL:
                             everywhere else somebody is reading about a place
                             they already hold, and here they are deciding
                             whether to take one they have never done. "What is
                             it?" is the question, and the answer used to be a
                             name and a date.

                             Shown on the rows you CANNOT take as well, level
                             with the rest — the reason a place is refused you is
                             already stated once, and hiding what it is on top of
                             that would make the row less of an answer, not more. -->
                        <p x-show="row.description"
                           class="mt-2 font-serif text-[13.5px] leading-[1.45] text-on-surface-variant"
                           x-text="row.description"></p>
                    </div>
                </div>

                <div class="shrink-0 md:w-[230px] md:flex md:justify-end md:items-center pl-[76px] md:pl-0">
                    <!-- Two doors, and the quieter one is second. Taking it
                         needs nobody's answer; offering asks somebody to give
                         something up, so it reads as the considered choice
                         rather than the obvious one. -->
                    <div x-show="row.permitted" class="flex flex-col md:flex-row gap-2 w-full md:w-auto">
                        <button type="button"
                                :disabled="taking"
                                @click="take(row)"
                                class="press w-full md:w-auto min-h-[44px] px-[22px] rounded-lg
                                       bg-primary text-on-primary text-[11.5px] uppercase tracking-[.12em]
                                       disabled:opacity-50">
                            Take it
                        </button>
                        <button type="button"
                                x-show="mine.length"
                                :disabled="taking"
                                @click="openOffer(row)"
                                class="press w-full md:w-auto min-h-[44px] px-[18px] rounded-lg
                                       border border-outline-variant text-on-surface
                                       text-[11.5px] uppercase tracking-[.12em] disabled:opacity-50">
                            Offer a swap
                        </button>
                    </div>
                    <!-- Stated once, in the same ink as the rest of the row. -->
                    <div x-show="!row.permitted"
                         class="text-[12.5px] leading-[1.45] text-on-surface-variant md:text-right"
                         x-text="row.reason"></div>
                </div>
            </div>
        </template>
    </div>
</main>

<!-- ── You said you were away ────────────────────────────────────────────── -->
<!-- It asks; it does not refuse. Overruling what you said about your own life
     is you changing your mind, not the app disbelieving you (ADR-0030 §3) —
     but you should be told that is what you are doing. -->
<template x-if="confirming">
    <div class="fixed inset-0 z-50 flex items-center justify-center p-6 bg-primary/40">
        <div class="w-full max-w-[420px] bg-surface-container-lowest border border-outline-variant
                    rounded-2xl p-6 shadow-xl">
            <div class="font-headline-lg text-[17px] tracking-[.02em] text-primary">You said you were away</div>
            <p class="mt-3 font-serif text-[17px] leading-[1.5] text-on-surface">
                You marked yourself away on <span x-text="confirming.dayNum + ' ' + confirming.mon"></span>.
                You can take this anyway — changing your mind is yours to do.
            </p>
            <div class="mt-[22px] flex gap-2.5">
                <button type="button" @click="confirming = null"
                        class="press flex-1 min-h-[44px] rounded-lg border border-outline-variant
                               text-on-surface-variant text-[11.5px] uppercase tracking-[.12em]">Leave it</button>
                <button type="button" @click="commit(confirming)"
                        class="press flex-1 min-h-[44px] rounded-lg bg-primary text-on-primary
                               text-[11.5px] uppercase tracking-[.12em]">Take it anyway</button>
            </div>
        </div>
    </div>
</template>

<!-- ── Offering one of your own instead of just taking theirs ────────────── -->
<!-- The other door out of this list. "Anybody else may offer off the cover list
     uninvited" is the model's own sentence, and the list could only ever hand a
     place over outright — so the one thing you could not do from here was the
     thing Trades exist for.

     ⚠ An uninvited offer MUST name something. Asking nothing in return is a
     take, and Take is right there, faster, and involves nobody else — so the
     button stays off until something is ticked rather than quietly settling. -->
<template x-if="offering">
    <div class="fixed inset-0 z-50 flex items-end md:items-center justify-center md:p-6 bg-primary/40">
        <div class="w-full max-w-[460px] max-h-[86vh] flex flex-col bg-surface-container-lowest
                    border border-outline-variant rounded-t-2xl md:rounded-2xl">
            <div class="p-5 border-b border-outline-variant">
                <div class="font-headline-lg text-[18px] tracking-[.02em] text-primary">
                    Offer a swap
                </div>
                <p class="mt-1.5 font-serif text-[15.5px] leading-[1.45] text-on-surface">
                    You would take <span x-text="offering.roleName"></span> on
                    <span x-text="offering.weekday + ' ' + offering.dayNum + ' ' + offering.mon"></span>.
                    Pick what you would hand over in return — they choose one of them, or say no.
                </p>
            </div>

            <div class="flex-grow overflow-y-auto">
                <template x-for="row in offerable" :key="row.key">
                    <button type="button" @click="togglePick(row)"
                            class="w-full text-left px-5 py-3 flex items-center gap-3
                                   border-b border-outline-variant last:border-b-0">
                        <span class="material-symbols-outlined text-[20px]"
                              :class="picked.includes(row.key) ? 'text-secondary' : 'text-outline'"
                              x-text="picked.includes(row.key) ? 'check_box' : 'check_box_outline_blank'"></span>
                        <span class="min-w-0">
                            <span class="block text-[15px] text-on-surface" x-text="row.roleName"></span>
                            <span class="block text-[12px] text-on-surface-variant"
                                  x-text="row.eventName + ' · ' + row.longDate"></span>
                            <!-- What you would be handing over (MS-222). The
                                 same question from the other side: you are
                                 giving this away, and what it involves is how
                                 you decide which one you can spare. -->
                            <span x-show="row.description"
                                  class="block mt-1 font-serif text-[12.5px] leading-[1.4] text-on-surface-variant"
                                  x-text="row.description"></span>
                        </span>
                    </button>
                </template>
                <p x-show="!offerable.length" class="px-5 py-8 text-center text-[13px] text-on-surface-variant">
                    You have nothing else on to offer — but you can still take this one outright.
                </p>
            </div>

            <div class="p-4 border-t border-outline-variant flex flex-col gap-2">
                <button type="button" :disabled="busyOffering || !picked.length"
                        @click="sendOffer()"
                        class="press w-full min-h-[44px] rounded-lg bg-primary text-on-primary
                               text-[11.5px] uppercase tracking-[.12em] disabled:opacity-40">
                    Send the offer <span x-text="picked.length ? '(' + picked.length + ')' : ''"></span>
                </button>
                <button type="button" @click="offering = null; picked = []"
                        class="min-h-[40px] text-on-surface-variant text-[11px] uppercase tracking-[.12em]">
                    Not now
                </button>
            </div>
        </div>
    </div>
</template>

<div x-show="toast" x-transition x-cloak x-text="toast"
     class="fixed left-1/2 -translate-x-1/2 bottom-7 z-50 bg-primary text-on-primary
            px-5 py-3 rounded-lg text-[13px] shadow-lg"></div>

</body>
</html>
