<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport" />
    <script src="mobile-shell.js"></script>
    <link rel="stylesheet" href="mobile-shell.css" />
    <title>Document | Mosaic Shepherd</title>




    <link rel="stylesheet" href="mosaic.css" />
    <link rel="stylesheet" href="fonts.css" />

    <style>
        [x-cloak] { display: none !important; }
        .ProseMirror { outline: none; min-height: 100%; padding: 24px; box-sizing: border-box; }
        .ProseMirror p { margin: 0 0 0.5em; }
        .ProseMirror p:last-child { margin-bottom: 0; }
        .ProseMirror ul { list-style-type: disc; padding-left: 1.5em; margin-bottom: 0.5em; }
        .ProseMirror ol { list-style-type: decimal; padding-left: 1.5em; margin-bottom: 0.5em; }
        .ProseMirror li p { margin: 0; }
        .mention-chip { display:inline; background:var(--primary-fixed); color:var(--primary); border-radius:3px; padding:0 4px; font-weight:500; text-decoration:none; cursor:pointer; }
        a.mention-chip:hover { background:var(--primary-fixed-dim); }
        .ProseMirror table { border-collapse:collapse; width:100%; margin-bottom:0.5em; table-layout:fixed; }
        .ProseMirror th, .ProseMirror td { border:1px solid var(--outline-variant); padding:4px 8px; min-width:50px; position:relative; vertical-align:top; }
        .ProseMirror th { background:var(--cream); font-weight:600; }
        .selectedCell { background:var(--primary-fixed) !important; }
        .note-table { border-collapse:collapse; width:100%; margin-bottom:0.5em; }
        .note-table th, .note-table td { border:1px solid var(--outline-variant); padding:4px 8px; text-align:left; vertical-align:top; }
        .note-table th { background:var(--cream); font-weight:600; }
        .person-panel { border:1px solid var(--primary-fixed-dim); border-radius:8px; margin:8px 0; overflow:hidden; display:block; background:var(--primary-fixed); }
        .person-panel-header { background:var(--primary-fixed); border-bottom:1px solid var(--primary-fixed-dim); padding:6px 12px; display:flex; align-items:center; gap:8px; }
        .person-panel-name { font-family:'Work Sans',sans-serif; font-size:13px; font-weight:600; color:var(--primary); background:transparent; border:none; cursor:pointer; padding:2px 6px; border-radius:4px; white-space:nowrap; }
        .person-panel-name:hover { background:var(--surface-dim); }
        .person-panel-type { font-family:'Work Sans',sans-serif; font-size:12px; color:var(--on-surface-variant); background:transparent; border:1px solid var(--outline-variant); border-radius:4px; padding:2px 4px; cursor:pointer; }
        .person-panel-status { font-family:'Work Sans',sans-serif; font-size:12px; color:var(--on-surface-variant); background:transparent; border:1px solid var(--outline-variant); border-radius:4px; padding:2px 6px; cursor:pointer; white-space:nowrap; }
        .person-panel-status:hover { border-color:var(--secondary); color:var(--secondary); }
        .person-panel-view-link { font-family:'Work Sans',sans-serif; font-size:12px; color:var(--secondary); text-decoration:none; margin-left:auto; white-space:nowrap; }
        .person-panel-view-link:hover { text-decoration:underline; }
        .person-panel-delete { background:transparent; border:none; cursor:pointer; color:var(--on-surface-variant); padding:2px; display:flex; align-items:center; line-height:1; flex-shrink:0; }
        .person-panel-delete:hover { color:var(--error); }
        .person-panel-body { background:var(--primary-fixed); min-height:80px; }
        .person-panel-body .ProseMirror { min-height:80px; padding:12px; box-sizing:border-box; }
        .ProseMirror-selectednode[data-action-chip] { outline: 2px solid var(--primary); outline-offset: 1px; border-radius: 3px; }
    </style>
    <script src="vendor/firebase/firebase-app-compat.js"></script>
    <script src="vendor/firebase/firebase-auth-compat.js"></script>
    <script src="vendor/firebase/firebase-firestore-compat.js"></script>
    <script src="vendor/firebase/firebase-functions-compat.js"></script>
    <!-- On-device cache for the phone app (no-op on the web). Must load before
         auth.js, which builds the Firestore handle persistence attaches to. -->
    <script src="local-cache.js"></script>
    <script src="auth.js"></script>
    <script defer src="vendor/alpine-3.15.12.min.js"></script>
</head>

<body class="bg-background text-on-background font-body-md text-body-md antialiased h-screen overflow-hidden flex flex-col"
      x-data="documentEditor" x-cloak
      data-key-legend="mention,insertNote,addTag,removeTag,status">

    <!-- Header -->
    <!-- No __title: the document's own title is an editable field at the top of
         the body. That is the record being written, not the app's name for a
         place, and it cannot live in the chrome. -->
    <header class="m-header">
        <div class="m-header__inner">
            <div class="m-header__lead">
                <a :href="backHref" class="m-back">
                    <span class="material-symbols-outlined">chevron_left</span>
                    <span class="m-back__label" x-text="backLabel">Documents</span>
                </a>
            </div>
            <div class="m-header__actions">
                <!-- …and a document written elsewhere has to be able to arrive.
                     Converted in this browser by mammoth; nothing is uploaded
                     anywhere to be read (ADR-0048). -->
                <input type="file" x-ref="wordInput" class="hidden" accept=".docx"
                       @change="chooseWordFile($event)" />
                <button type="button" @click="$refs.wordInput.click()" :disabled="importingWord"
                        class="m-btn m-btn--ghost m-btn--sm"
                        :title="importingWord ? 'Reading the file…' : 'Insert a Word file at the cursor'"
                        aria-label="Import from Word">
                    <span class="material-symbols-outlined text-[16px]"
                          :class="importingWord ? 'm-spinner' : ''"
                          x-text="importingWord ? 'progress_activity' : 'upload_file'"></span>
                    <span class="m-btn__label" x-text="importingWord ? 'Reading…' : 'Import'"></span>
                </button>
                <!-- A document written here has to be able to leave here. -->
                <button type="button" @click="downloadAsWord()" :disabled="exportingWord"
                        class="m-btn m-btn--ghost m-btn--sm"
                        :title="exportingWord ? 'Making the file…' : 'Download as Word'"
                        aria-label="Download as Word">
                    <span class="material-symbols-outlined text-[16px]"
                          :class="exportingWord ? 'm-spinner' : ''"
                          x-text="exportingWord ? 'progress_activity' : 'download'"></span>
                    <span class="m-btn__label" x-text="exportingWord ? 'Making…' : 'Word'"></span>
                </button>
                <template x-if="saveStatus === 'saving'">
                    <span class="m-badge m-badge--neutral m-header__chip">
                        <span class="material-symbols-outlined text-[14px] animate-spin">progress_activity</span>
                        <span class="m-btn__label">Saving…</span>
                    </span>
                </template>
                <template x-if="saveStatus === 'saved'">
                    <span class="m-badge m-badge--success m-header__chip">
                        <span class="material-symbols-outlined text-[14px]">check_circle</span>
                        <span class="m-btn__label">Saved</span>
                    </span>
                </template>
                <template x-if="saveStatus === 'unsaved'">
                    <span class="m-badge m-badge--warning m-header__chip">
                        <span class="m-chip-dot m-chip-dot--pulse"></span>
                        <span class="m-btn__label">Unsaved changes</span>
                    </span>
                </template>
            </div>
            <div class="m-header__rule"></div>
            <div class="m-header__auth" id="auth-container"></div>
        </div>
    </header>

    <!-- Loading -->
    <div x-show="loading" class="m-loading">
        <span class="m-spinner material-symbols-outlined">progress_activity</span>
    </div>

    <!-- Main -->
    <main x-show="!loading" class="flex-grow overflow-hidden w-full px-4 md:px-margin pb-lg flex flex-col gap-sm pt-md">

        <!-- Title -->
        <input type="text"
               x-model="title"
               @input="onTitleInput()"
               placeholder="Document title…"
               :class="ShepherdingBlur.contentClass(doc?.authorUid)"
               class="w-full font-headline-lg text-headline-lg text-primary bg-transparent border-0 border-b-2 border-transparent focus:border-outline-variant focus:outline-none pb-xs transition-colors placeholder-outline" />

        <!-- Metadata -->
        <div class="flex flex-wrap items-center gap-sm pb-xs border-b border-outline-variant">
            <span class="font-label-md text-label-md text-on-surface-variant"
                  x-text="'Created by ' + (doc?.authorName || '…')"></span>
            <template x-if="doc?.createdAt">
                <span class="font-label-md text-label-md text-outline">·</span>
            </template>
            <span class="font-label-md text-label-md text-on-surface-variant"
                  x-text="formatDate(doc?.createdAt)"></span>
        </div>

        <!-- Editor card -->
        <div class="bg-surface-container-lowest border border-outline-variant rounded-xl flex flex-col flex-grow overflow-hidden">

            <!-- The one toolbar, shared with the Event Document editor
                 (document-toolbar.js). It used to be a second, older copy that
                 disagreed with the other about what bold looks like and never
                 offered a heading at all. -->
            <div data-document-toolbar="bar"></div>
            <div data-document-toolbar="table-tools"></div>

            <!-- TipTap mount point -->
            <div id="tiptap-doc-editor"
                 class="font-body-md text-on-surface bg-surface-container-lowest flex-grow overflow-y-auto cursor-text rounded-b-xl"
                 :class="ShepherdingBlur.contentClass(doc?.authorUid)"
                 @click="if (!$event.target.closest('.person-panel')) focusEditor()">
            </div>
        </div>
    </main>

    <div data-document-toolbar="image-dialog"></div>

    <!-- Person Picker Modal -->
    <div x-show="showPersonPicker" x-cloak class="fixed inset-0 z-50 flex items-center justify-center bg-black/40"
         @keydown.escape.window="showPersonPicker = false">
        <div class="bg-surface-container-lowest rounded-xl shadow-2xl w-full max-w-md mx-4 flex flex-col max-h-[80vh]">
            <div class="flex items-center justify-between px-lg py-md border-b border-outline-variant flex-shrink-0">
                <h3 class="font-headline-md text-headline-md text-on-surface"
                    x-text="pickerStep === 'person' ? 'Select person' : 'Note options for ' + (pickerSelected?.name || '')"></h3>
                <button @click="showPersonPicker = false" class="text-on-surface-variant hover:text-on-surface transition-colors">
                    <span class="material-symbols-outlined text-[20px]">close</span>
                </button>
            </div>

            <!-- Step 1: person search -->
            <div x-show="pickerStep === 'person'" class="flex flex-col gap-sm p-lg overflow-hidden">
                <input type="text" x-model="pickerSearch" placeholder="Search people…"
                       @keydown.stop
                       class="w-full border border-outline-variant rounded-lg px-sm py-xs font-body-md text-sm bg-surface focus:outline-none focus:ring-2 focus:ring-primary/30" />
                <div class="overflow-y-auto flex flex-col" style="max-height:320px">
                    <template x-for="person in filteredPeople" :key="person.id">
                        <button @click="selectPersonForPicker(person)"
                            class="text-left px-sm py-xs hover:bg-surface-container rounded-lg font-body-md text-sm text-on-surface transition-colors">
                            <span x-text="person.name"></span>
                        </button>
                    </template>
                    <div x-show="filteredPeople.length === 0"
                         class="text-on-surface-variant italic text-sm px-sm py-xs">No people found.</div>
                </div>
            </div>

            <!-- Step 2: note mode -->
            <div x-show="pickerStep === 'note-mode'" class="flex flex-col gap-md p-lg overflow-y-auto">
                <div class="flex flex-col gap-sm">
                    <label class="flex items-start gap-sm cursor-pointer p-sm rounded-lg hover:bg-surface-container transition-colors">
                        <input type="radio" value="new" x-model="pickerNoteMode" class="mt-0.5" />
                        <div>
                            <div class="font-label-md text-label-md text-on-surface">New note</div>
                            <div class="font-body-md text-xs text-on-surface-variant">Create a fresh Shepherding Note linked to this panel</div>
                        </div>
                    </label>
                    <label class="flex items-start gap-sm cursor-pointer p-sm rounded-lg hover:bg-surface-container transition-colors">
                        <input type="radio" value="existing" x-model="pickerNoteMode" class="mt-0.5" />
                        <div>
                            <div class="font-label-md text-label-md text-on-surface">Link existing note</div>
                            <div class="font-body-md text-xs text-on-surface-variant">Pull an existing Shepherding Note into this panel</div>
                        </div>
                    </label>
                </div>

                <!-- Existing notes list -->
                <div x-show="pickerNoteMode === 'existing'" class="flex flex-col gap-xs border-t border-outline-variant pt-sm">
                    <div x-show="pickerExistingNotes.length === 0"
                         class="text-on-surface-variant italic text-sm">No existing notes for this person.</div>
                    <template x-for="n in pickerExistingNotes" :key="n.id">
                        <label class="flex items-center gap-sm cursor-pointer px-sm py-xs hover:bg-surface-container rounded-lg transition-colors">
                            <input type="radio" :value="n.id" x-model="pickerSelectedNoteId" />
                            <div class="flex flex-col min-w-0">
                                <span class="font-label-md text-label-md text-on-surface truncate"
                                      x-text="n.subject || (n.type + (n.createdAt ? ' · ' + formatDate(n.createdAt) : ''))"></span>
                                <span class="text-xs text-on-surface-variant" x-text="n.type"></span>
                            </div>
                        </label>
                    </template>
                </div>

                <div class="flex items-center justify-between gap-sm border-t border-outline-variant pt-md">
                    <button @click="pickerStep = 'person'"
                        class="m-btn m-btn--quiet m-btn--sm">
                        ← Back
                    </button>
                    <button @click="confirmPersonPicker()"
                        :disabled="pickerNoteMode === 'existing' && !pickerSelectedNoteId"
                        class="m-btn m-btn--primary m-btn--sm">
                        Insert panel
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Panel Delete Dialog -->
    <div x-show="showPanelDeleteDialog" x-cloak class="fixed inset-0 z-50 flex items-center justify-center bg-black/40"
         @keydown.escape.window="showPanelDeleteDialog = false">
        <div class="bg-surface-container-lowest rounded-xl shadow-2xl w-full max-w-sm mx-4 p-lg flex flex-col gap-md">
            <h3 class="font-headline-md text-headline-md text-on-surface">Remove person panel</h3>
            <p class="font-body-md text-on-surface-variant text-sm">
                What should happen to the Shepherding Note for
                <span class="font-semibold text-on-surface" x-text="panelDeletePersonName"></span>?
            </p>
            <div class="flex flex-col gap-sm">
                <button @click="executePanelDelete(false)"
                    class="w-full px-md py-sm font-label-md text-label-md bg-primary text-on-primary rounded-lg hover:bg-primary/90 transition-colors text-left">
                    Keep note on profile
                    <span class="block font-body-md text-xs font-normal opacity-80 mt-xs">The note stays on their Shepherding Profile, unlinked from this document.</span>
                </button>
                <button @click="executePanelDelete(true)"
                    class="w-full px-md py-sm font-label-md text-label-md bg-error text-on-error rounded-lg hover:bg-error/90 transition-colors text-left">
                    Delete note entirely
                    <span class="block font-body-md text-xs font-normal opacity-80 mt-xs">Permanently removes the note from their Shepherding Profile too.</span>
                </button>
                <button @click="showPanelDeleteDialog = false"
                    class="m-btn m-btn--quiet m-btn--sm">
                    Cancel
                </button>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div x-show="toast.show" x-cloak x-transition
         class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 px-lg py-sm rounded-lg shadow-lg font-label-md text-label-md"
         :class="toast.type === 'error' ? 'bg-error text-on-error' : 'bg-inverse-surface text-inverse-on-surface'">
        <span x-text="toast.message"></span>
    </div>

    <!-- Turning a Note Body into a Word file (the walk, then the writer).
         Neither pulls in the 1.1MB docx library — document-docx.js fetches that
         only when somebody actually asks for a download. -->
    <script src="guide-image-core.js"></script>
    <script src="document-docx-core.js"></script>
    <script src="document-docx.js"></script>
    <script src="shepherding-core.js"></script>
    <script src="shepherding-blur.js"></script>
    <script src="shepherding-inline-triggers.js"></script>
    <!-- Loads the vendored TipTap bundle. Must come before the page
         script, which calls TiptapEditorLoader.ensureTipTap(). -->
    <script src="tiptap-editor-loader.js"></script>
    <script src="shepherding-document.js"></script>
    <script src="shepherding-key-legend.js"></script>
    <!-- Fills the data-document-toolbar placeholders above with the one
         shared editing surface. Must run AFTER them and BEFORE Alpine. -->
    <script src="document-toolbar.js"></script>
</body>
</html>
