<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Away | Mosaic</title>

    <link rel="stylesheet" href="mosaic.css" />
    <link rel="stylesheet" href="fonts.css" />

    <script src="mobile-shell.js"></script>
    <link rel="stylesheet" href="mobile-shell.css" />
    <script src="permission-catalog.js"></script>
    <script src="account-levels-core.js"></script>
    <script src="access-core.js"></script>
    <script src="mobile/destinations.js"></script>
    <script>window.MOBILE_HEADER = { title: 'Away', menu: false, back: 'calendar.html', route: 'events' };</script>
    <script src="person-photo-core.js"></script>
    <script src="mobile-shell-header.js"></script>

    <style>
        [x-cloak] { display: none !important; }

        /* The steel-teal focus ring, matching the Input component — the one raw
           value on the page, as on the Calendar. */
        .aw-focus:focus-visible { outline: none; box-shadow: 0 0 0 3px rgba(93,148,169,.18); }

        /* Motion: background, opacity and border only. */
        .aw-motion { transition: background-color 150ms cubic-bezier(0.2,0,0,1),
                                 opacity 150ms cubic-bezier(0.2,0,0,1),
                                 border-color 150ms cubic-bezier(0.2,0,0,1); }

        /* The shell draws its own header with the page title in it. */
        /* The title is in the header now, and the shell hides that wholesale —
           there is no second copy on the page to suppress. */
        html.shell-mobile .aw-title-block { display: none; }

        /* ── The phone's pinned tray ──────────────────────────────────────────
           ⚠ THE TRAY IS `position: fixed`, SO THE BODY'S SAFE-AREA PADDING DOES
           NOT REACH IT. mobile-shell.css keeps scrollable content clear of the
           home indicator by padding the body, but a fixed box is laid against
           the viewport and sails straight under it. This carries its own inset,
           which is both safer on a phone that has an indicator and thinner on
           every phone and browser that does not — a flat 24px was the wrong
           number in both directions. */
        .aw-tray { padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 0.75rem); }

        /* The scroll above it needs room to clear it. Two numbers because the
           tray grows a whole panel taller when the days you are choosing clash
           with something you are down to do — one clearance would either hide
           the last card behind the warning or leave a hole under it. */
        .aw-tray-clearance { padding-bottom: 80px; }
        .aw-tray-clearance-clash { padding-bottom: 240px; }

        /* ── The days themselves ──────────────────────────────────────────────
           A press and drag across days marks a run, so on a phone a finger
           moving over the days must paint rather than scroll the page or turn
           the month. `touch-action: none` hands every gesture that starts on
           a day to the page; the month name and weekday row above keep the
           rail's own `pan-y`, so a swipe there still turns the month. No text
           selection either, or a mouse drag highlights the numbers. */
        .aw-days { touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }

        /* ── The months, on a rail ────────────────────────────────────────────
           Every month the screen can reach is laid out in one row and the
           arrows slide it — two months wide on a desktop, one on a phone, where
           a swipe moves it too. Paging used to swap what was on show for
           something else, which gave a person choosing a range across a month
           boundary nothing to hold on to: the days they had just been looking
           at were simply gone. Sliding keeps them in sight on the way past.

           The arrows are the control, so the rail is clipped rather than
           scrollable — a half-swiped rail sitting between two months is a state
           nothing else on the screen can describe.

           ⚠ IT MOVES BY TRANSFORM, NOT BY SCROLLING. A clipped box will not
           smooth-scroll: `scrollTo({behavior:'smooth'})` on it lands instantly
           at the far end, which is the hard snap this replaced. A transform
           transitions whatever the overflow is.

           ⚠ THE COLUMN WIDTH IS KEYED ON THE SHELL, NOT ON A MEDIA QUERY — it
           has to agree with `monthsShown`, which is, and a breakpoint would put
           them on different switches. A tablet-width mobile shell would then
           show two months while the component believed one was on screen, and
           the second would be drawn inert.

           `touch-action: pan-y` on the rail leaves vertical scrolling to the
           page and keeps sideways gestures for the swipe. */
        .aw-rail { overflow: hidden; position: relative; touch-action: pan-y; }
        .aw-rail-track {
            grid-auto-columns: calc((100% - 2rem) / 2);
            transition: transform 420ms cubic-bezier(0.2, 0, 0, 1);
        }
        html.shell-mobile .aw-rail-track { grid-auto-columns: 100%; }
        /* Asked for less movement, given none. The jump is the old behaviour,
           which was never wrong — only abrupt. */
        @media (prefers-reduced-motion: reduce) {
            .aw-rail-track { transition: none; }
        }
    </style>

    <script src="vendor/firebase/firebase-app-compat.js"></script>
    <script src="vendor/firebase/firebase-auth-compat.js"></script>
    <script src="vendor/firebase/firebase-firestore-compat.js"></script>

    <script src="local-cache.js"></script>
    <script src="firebase-config.js"></script>
    <script src="auth.js"></script>

    <script src="dashboard-nav.js"></script>
    <script src="desktop-drawer.js"></script>
        <script src="drawer-who.js"></script>
<script src="desktop-header-lead.js"></script>
    <script src="desktop-nav-boot.js"></script>
    <script src="date-utils.js"></script>
    <script src="roles-core.js"></script>
    <script src="events-core.js"></script>
    <script src="events-occurrence-core.js"></script>
    <script src="events-store.js"></script>
    <script src="away-core.js"></script>
    <script src="away-store.js"></script>
    <script src="away.js"></script>
    <script defer src="vendor/alpine-3.15.12.min.js"></script>
</head>

<!-- The drag's move and lift are heard on the whole window, not on a day: a
     finger's events keep going to the day it went down on, and a mouse let go
     outside the calendar still has to finish the run. -->
<body class="m-page" x-data="awayPage()" x-cloak
      @pointermove.window="pointerMove($event)" @pointerup.window="release()"
      @pointercancel.window="cancelDrag()" @keydown.escape.window="cancelDrag()">

<!-- The header is a direct child of <body>, outside the column: the phone shell
     finds it as `body > header`, and the bar's hairline has to reach the window
     edge rather than stop at the column's. The title is "Away" when it is your
     own diary and a Person's name when an editor is recording it for somebody
     else — so the face follows, Cinzel for the app's word and EB Garamond for
     the name. -->
<header class="m-header">
    <div class="m-header__inner">
        <div class="m-header__lead">
            <a :href="calendarHref" class="m-back aw-motion aw-focus">
                <span class="material-symbols-outlined">chevron_left</span>
                <span class="m-back__label">Calendar</span>
            </a>
            <div class="m-header__titles">
                <h1 class="m-header__title" :class="!isMine && 'm-header__title--serif'" x-text="title"></h1>
            </div>
        </div>
        <div class="m-header__rule"></div>
        <div class="m-header__auth" id="auth-container"></div>
    </div>
</header>

<!-- w-full: the body is a flex column, where mx-auto shrinks a box to its
     content. The month rail's content is twelve months wide, so without it the
     page grew to ~1100px on a phone and showed two weekday columns. -->
<div class="w-full max-w-container mx-auto px-margin">

    <!-- ── Title ─────────────────────────────────────────────────────────
         The whole block goes on a phone, not just the heading. The shell
         already draws "Away" above it, the lock chip is repeated word for word
         in "Worth knowing" below, and the standfirst was the only thing between
         the header and the calendar — three lines of preamble in front of the
         one thing the screen is for. -->
    <div class="aw-title-block flex items-end justify-between gap-8 pt-md pb-md border-b border-outline-variant">
        <div>
            <p class="text-[14px] leading-[1.55] text-on-surface-variant max-w-[66ch]" x-text="intro"></p>
        </div>
        <span class="hidden md:flex items-center gap-2 shrink-0 font-label-md text-[11px] uppercase tracking-[.12em]
                     text-on-surface-variant bg-surface-container border border-outline-variant rounded-md px-3 py-2">
            <span class="material-symbols-outlined text-[17px]">lock</span><span x-text="isMine ? 'Only you and the rota editors' : 'Only them and the rota editors'"></span>
        </span>
    </div>

    <!-- ── Whose days (MS-196) ─────────────────────────────────────────────
         An editor gets the SAME screen with a different name on it, rather than
         a second surface somewhere else. Most of this information still arrives
         after the service, spoken to whoever is doing the rota; if the only way
         in were the person's own screen, it would go back to living in an
         editor's head. Anything entered here is stamped with the editor's name,
         so the picker reads "Ann marked Sarah away". -->
    <div x-show="!loading && personId && canReadOthersAway" class="mt-md flex items-center gap-sm flex-wrap">
        <span class="font-label-md text-[11px] uppercase tracking-[.14em] text-on-surface-variant">Whose days</span>
        <select @change="setSubject($event.target.value)"
                class="text-sm rounded-lg border border-outline-variant bg-surface-container-lowest py-2 pl-3 pr-9 aw-focus">
            <option :value="personId" :selected="isMine">Mine</option>
            <template x-for="p in people" :key="p.id">
                <option :value="p.id" :selected="p.id === subjectId" x-text="p.name"></option>
            </template>
        </select>
        <span x-show="!isMine" class="flex items-center gap-1.5 font-label-md text-[10.5px] uppercase tracking-[.12em]
                                      text-on-warning-container bg-warning-container border border-warning rounded-md px-2.5 py-1.5">
            <span class="material-symbols-outlined text-[15px]">edit_note</span>Recorded in your name
        </span>
    </div>

    <!-- ── Not signed in, or no linked Person ──────────────────────────── -->
    <template x-if="!loading && !personId">
        <section class="mt-md bg-surface-container-low border border-outline-variant rounded-lg p-md flex items-start gap-sm">
            <span class="material-symbols-outlined text-[22px] text-outline shrink-0">person_off</span>
            <div>
                <p class="text-[14.5px] text-on-surface">
                    This page is about your own days, so it needs to know who you are.
                </p>
                <p class="text-[13px] text-on-surface-variant mt-1">
                    Sign in, and if it still says this, ask the church office to link your account to your name in the directory.
                </p>
                <a href="login.html" class="inline-flex items-center gap-1 mt-3 text-secondary font-label-md text-xs uppercase tracking-wider aw-focus">
                    Sign in <span class="material-symbols-outlined text-[16px]">north_east</span>
                </a>
            </div>
        </section>
    </template>

    <template x-if="error">
        <div class="mt-md bg-error-container border border-error rounded-lg px-md py-3 text-[13.5px] text-on-error-container" x-text="error"></div>
    </template>

    <!-- ══════════════ DESKTOP ══════════════ -->
    <!-- ⚠ `x-if`, NOT `x-show`. Both layouts carry a rail and both name it
         `rail`, so with the other one merely hidden the component would end up
         measuring whichever registered last — and inside a display:none block
         every offset reads zero, so the rail would never move. -->
    <template x-if="!loading && personId && !phone">
    <div class="grid grid-cols-1 lg:grid-cols-[minmax(0,1fr)_340px] gap-md items-start mt-md pb-lg">

        <!-- The grid IS the primary action -->
        <div class="bg-surface-container-lowest border border-outline-variant rounded-[10px] p-md">
            <div class="flex items-center justify-between gap-5 pb-sm border-b border-outline-variant">
                <span class="font-label-md text-[11px] uppercase tracking-[.14em] text-on-surface-variant" x-text="prompt"></span>
                <div class="flex gap-px">
                    <!-- The rail starts at this month and there is nothing
                         behind it: Away is a thing you say BEFORE, so a month
                         that has been holds nothing to choose. -->
                    <button type="button" @click="prevMonths()" title="Earlier months" :disabled="!canGoBack"
                            class="w-[34px] h-[34px] flex items-center justify-center bg-surface-container-lowest border border-outline-variant
                                   rounded-l-[10px] text-on-surface-variant hover:bg-surface-container-low aw-motion aw-focus
                                   disabled:opacity-30 disabled:hover:bg-surface-container-lowest">
                        <span class="material-symbols-outlined text-[19px]">chevron_left</span>
                    </button>
                    <button type="button" @click="nextMonths()" title="Later months"
                            class="w-[34px] h-[34px] flex items-center justify-center bg-surface-container-lowest border border-outline-variant
                                   rounded-r-[10px] text-on-surface-variant hover:bg-surface-container-low aw-motion aw-focus">
                        <span class="material-symbols-outlined text-[19px]">chevron_right</span>
                    </button>
                </div>
            </div>

            <!-- One row holding every month the screen can reach; the arrows
                 scroll it. The pair on show is a window onto the rail, not a
                 pair of slots that get their contents swapped. -->
            <div class="aw-rail mt-4" x-ref="rail">
                <div class="aw-rail-track grid grid-flow-col gap-8" :style="railStyle">
                    <!-- ⚠ EVERY month on the rail is in the DOM, on screen or
                         not, so without `inert` a keyboard would tab through
                         three hundred days nobody can see. It also stops a
                         half-passed month taking a click mid-slide. -->
                    <!-- ⚠ `data-rail-month` rather than counting children:
                         Alpine leaves its own <template> as the track's first
                         element, so the nth month is not the nth child. -->
                    <template x-for="(m, i) in railMonths" :key="m.label">
                        <div data-rail-month :inert="!onRail(i)">
                            <div class="text-center font-display text-[17px] tracking-[.02em] text-primary pb-3" x-text="m.label"></div>
                            <div class="grid grid-cols-7">
                                <template x-for="(w, i) in weekdays" :key="i">
                                    <div class="text-center font-label-md text-[10px] uppercase tracking-[.12em] text-outline pb-2" x-text="w"></div>
                                </template>
                            </div>
                            <div class="aw-days grid grid-cols-7 gap-y-[3px]">
                                <template x-for="(c, i) in m.cells" :key="i">
                                    <button type="button" :disabled="!c.inMonth || c.past" :data-day="c.iso" :title="c.title"
                                            @pointerdown="pointerDown($event, c.iso)" @click="keyed($event, c.iso)"
                                            class="relative flex flex-col items-center justify-center gap-[3px] h-[46px] border-0 aw-motion aw-focus"
                                            :class="[cellClass(c), cellRadius(c), c.inMonth && !c.past ? 'cursor-pointer' : 'cursor-default']">
                                        <span class="text-[14.5px]" x-text="c.day"></span>
                                        <span class="w-[5px] h-[5px] rounded-full" :class="dotClass(c)"></span>
                                    </button>
                                </template>
                            </div>
                        </div>
                    </template>
                </div>
            </div>

            <!-- Legend -->
            <div class="flex flex-wrap items-center gap-4 mt-4 pt-4 border-t border-outline-variant text-[11.5px] text-on-surface-variant">
                <span class="flex items-center gap-2"><span class="w-[13px] h-[13px] rounded bg-primary"></span>Away</span>
                <span class="flex items-center gap-2"><span class="w-[6px] h-[6px] rounded-full bg-sand"></span>You're serving</span>
                <span class="flex items-center gap-2"><span class="w-[6px] h-[6px] rounded-full bg-warning"></span>Serving on a day you're away</span>
            </div>

            <!-- The sentence. No button: each tap or drag is saved as it lands. -->
            <div class="flex items-end justify-between gap-6 mt-5">
                <p class="font-headline-lg text-[19px] leading-[1.4] text-on-surface max-w-[44ch]" x-text="sentence"></p>
                <span class="shrink-0 font-label-md text-[11px] uppercase tracking-[.1em] text-on-surface-variant" x-text="saveState"></span>
            </div>

            <!-- THE CLASH — information with a next step, never an error -->
            <div x-show="hasClash" class="bg-warning-container border border-warning rounded-[10px] p-md mt-5">
                <div class="flex items-start gap-3">
                    <span class="material-symbols-outlined text-[22px] text-warning mt-px shrink-0">event_upcoming</span>
                    <div class="flex-1 min-w-0">
                        <div class="font-display text-[18px] tracking-[.02em] text-primary" x-text="clashHeading"></div>
                        <p class="mt-2 text-[13.5px] leading-[1.55] text-on-warning-container max-w-[62ch]"
                           x-text="clashLead"></p>
                    </div>
                </div>
                <div class="flex flex-col mt-4 bg-surface-container-lowest border border-outline-variant rounded-[10px] overflow-hidden">
                    <template x-for="c in conflicts" :key="c.occurrenceId + c.role">
                        <div class="flex items-center gap-4 px-4 py-3.5 border-b border-outline-variant last:border-b-0">
                            <span class="w-[2px] self-stretch bg-warning rounded-sm shrink-0"></span>
                            <div class="flex-1 min-w-0">
                                <div class="font-headline-lg text-[17px] leading-[1.3] text-on-surface" x-text="c.role"></div>
                                <div class="text-[12.5px] text-on-surface-variant mt-0.5">
                                    <span x-text="c.when"></span> · <span x-text="c.event"></span>
                                </div>
                            </div>
                            <!-- Held open for MS-190's "Offer it to someone", so the
                                 button arrives without redrawing the row. -->
                            <span class="w-[168px] shrink-0 text-right font-label-md text-[11px] uppercase tracking-[.1em] text-outline">Yours to sort</span>
                        </div>
                    </template>
                </div>
            </div>

            <div x-show="allClear" class="flex items-center gap-3 mt-5 px-5 py-4 bg-surface-container-low border border-outline-variant rounded-[10px]">
                <span class="material-symbols-outlined text-[20px] text-success">check_circle</span>
                <span class="font-headline-lg text-[16.5px] text-on-surface" x-text="allClearLine"></span>
            </div>
        </div>

        <!-- ── Rail ────────────────────────────────────────────────────── -->
        <!-- No list of ranges here any more: the calendar is the record. -->
        <div class="flex flex-col gap-md">
            <div class="bg-surface-container-low border border-outline-variant rounded-[10px] p-5">
                <div class="font-label-md text-[11px] uppercase tracking-[.14em] text-on-surface-variant mb-3">Worth knowing</div>
                <div class="flex flex-col gap-3">
                    <div class="flex items-start gap-2.5 text-[13px] leading-[1.5] text-on-surface-variant">
                        <span class="material-symbols-outlined text-[17px] text-outline mt-px shrink-0">touch_app</span>
                        <span>Tap a day to mark it, tap it again to clear it. Drag across days to mark a run — or start the drag on an away day to clear one.</span>
                    </div>
                    <div class="flex items-start gap-2.5 text-[13px] leading-[1.5] text-on-surface-variant">
                        <span class="material-symbols-outlined text-[17px] text-outline mt-px shrink-0">wb_sunny</span>
                        <span>Whole days only — if you're away on the 14th, you're away for everything on the 14th.</span>
                    </div>
                    <div class="flex items-start gap-2.5 text-[13px] leading-[1.5] text-on-surface-variant">
                        <span class="material-symbols-outlined text-[17px] text-outline mt-px shrink-0">visibility_off</span>
                        <span>Only you and the rota editors can see this. No reason is asked for or stored.</span>
                    </div>
                    <div class="flex items-start gap-2.5 text-[13px] leading-[1.5] text-on-surface-variant">
                        <span class="material-symbols-outlined text-[17px] text-outline mt-px shrink-0">edit_calendar</span>
                        <span>Every change saves as you make it. Change your mind any time — clear the days and they're simply gone.</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
    </template>

    <!-- ══════════════ PHONE ══════════════ -->
    <!-- One month, paged the same way the desktop pages: the arrows, or a swipe
         across the calendar. The summary, the clash and the button live in a
         tray pinned to the bottom.

         It ran four months on in one vertical scroll before. That made a range
         crossing a month boundary one flick — but it put the calendar in a
         scroll inside a scroll, and finding the month you wanted was a hunt
         rather than a tap. -->
    <template x-if="!loading && personId && phone">
    <div class="mt-4">
        <div class="flex items-center justify-between gap-4 pb-3">
            <span class="font-label-md text-[11px] uppercase tracking-[.14em] text-on-surface-variant" x-text="prompt"></span>
            <div class="flex gap-px shrink-0">
                <button type="button" @click="prevMonths()" title="Earlier months" :disabled="!canGoBack"
                        class="w-[38px] h-[38px] flex items-center justify-center bg-surface-container-lowest border border-outline-variant
                               rounded-l-[10px] text-on-surface-variant aw-motion aw-focus
                               disabled:opacity-30">
                    <span class="material-symbols-outlined text-[19px]">chevron_left</span>
                </button>
                <button type="button" @click="nextMonths()" title="Later months"
                        class="w-[38px] h-[38px] flex items-center justify-center bg-surface-container-lowest border border-outline-variant
                               rounded-r-[10px] text-on-surface-variant aw-motion aw-focus">
                    <span class="material-symbols-outlined text-[19px]">chevron_right</span>
                </button>
            </div>
        </div>

        <div class="flex flex-col gap-7" :class="hasClash ? 'aw-tray-clearance-clash' : 'aw-tray-clearance'">
            <!-- The same rail the desktop slides, one month wide. The swipe is
                 read on the whole rail rather than per day, so a thumb landing
                 anywhere on the calendar can move it. -->
            <div class="aw-rail" x-ref="rail"
                 @touchstart="swipeFrom($event)" @touchend="swipeTo($event)">
                <div class="aw-rail-track grid grid-flow-col gap-8" :style="railStyle">
                    <template x-for="(m, i) in railMonths" :key="m.label">
                        <div data-rail-month :inert="!onRail(i)">
                            <div class="font-display text-[16px] tracking-[.02em] text-primary pb-2.5" x-text="m.label"></div>
                            <div class="grid grid-cols-7">
                                <template x-for="(w, i) in weekdays" :key="i">
                                    <div class="text-center font-label-md text-[9.5px] uppercase tracking-[.1em] text-outline pb-1.5" x-text="w"></div>
                                </template>
                            </div>
                            <div class="aw-days grid grid-cols-7 gap-y-[3px]">
                                <template x-for="(c, i) in m.cells" :key="i">
                                    <button type="button" :disabled="!c.inMonth || c.past" :data-day="c.iso"
                                            @pointerdown="pointerDown($event, c.iso)" @click="keyed($event, c.iso)"
                                            class="flex flex-col items-center justify-center gap-0.5 h-[48px] border-0 aw-motion aw-focus"
                                            :class="[cellClass(c), cellRadius(c), c.inMonth && !c.past ? 'cursor-pointer' : 'cursor-default']">
                                        <span class="text-[15px]" x-text="c.day"></span>
                                        <span class="w-[5px] h-[5px] rounded-full" :class="dotClass(c)"></span>
                                    </button>
                                </template>
                            </div>
                        </div>
                    </template>
                </div>
            </div>

            <div x-show="allClear" class="flex items-center gap-2.5 px-4 py-3 bg-surface-container-low border border-outline-variant rounded-[10px]">
                <span class="material-symbols-outlined text-[18px] text-success">check_circle</span>
                <span class="font-headline-lg text-[15px] text-on-surface" x-text="allClearLine"></span>
            </div>
        </div>

        <!-- The tray: the clash, if any, and the sentence. -->
        <div class="aw-tray fixed left-0 right-0 bottom-0 bg-surface-container-lowest border-t border-outline-variant px-margin pt-3"
             style="box-shadow:0 -8px 24px rgba(14,28,54,.10)">
            <div x-show="hasClash" class="bg-warning-container border border-warning rounded-[10px] px-3.5 py-3 mb-3">
                <div class="flex items-start gap-2.5">
                    <span class="material-symbols-outlined text-[18px] text-warning shrink-0">event_upcoming</span>
                    <div class="flex-1 min-w-0">
                        <div class="text-[13px] font-semibold leading-[1.35] text-on-warning-container" x-text="clashHeading"></div>
                        <div class="flex flex-col gap-1 mt-2">
                            <template x-for="c in conflicts" :key="c.occurrenceId + c.role">
                                <div class="text-[12px] leading-[1.4] text-on-warning-container">
                                    <span class="font-headline-lg text-[14.5px]" x-text="c.role"></span>
                                    <span> — </span><span x-text="c.when"></span>
                                </div>
                            </template>
                        </div>
                        <div class="text-[12px] leading-[1.45] text-on-warning-container mt-2"
                             x-text="isMine ? 'Still yours. Find someone to swap with before you go.' : 'Still theirs. Somebody has to hand them on.'"></div>
                    </div>
                </div>
            </div>

            <!-- The sentence is a size down from the desktop's: one line of
                 caption, not the largest thing in a panel. No button under it —
                 each tap or drag is saved as the finger lifts. -->
            <div class="flex items-center justify-between gap-3 pb-1">
                <p class="font-headline-lg text-[14.5px] leading-[1.35] text-on-surface" x-text="sentence"></p>
                <span class="shrink-0 font-label-md text-[10.5px] uppercase tracking-[.1em] text-on-surface-variant" x-text="saveState"></span>
            </div>
        </div>
    </div>
    </template>

    <!-- ── Loading ─────────────────────────────────────────────────────── -->
    <div x-show="loading" class="py-lg text-center text-on-surface-variant text-[13.5px]">Loading your days…</div>

</div>

</body>
</html>
