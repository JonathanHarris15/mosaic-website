<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Log In - Mosaic Church</title>
    <link rel="stylesheet" href="mosaic.css" />
    <link rel="stylesheet" href="fonts.css" />



    
    <!-- Firebase SDKs -->
    <script src="vendor/firebase/firebase-app-compat.js"></script>
    <script src="vendor/firebase/firebase-auth-compat.js"></script>
    <script src="vendor/firebase/firebase-firestore-compat.js"></script>
    <script src="account-recovery-core.js"></script>
    <script src="sign-in-return-core.js"></script>
    <script src="firebase-config.js"></script>
    <script src="auth.js"></script>

    <script src="dashboard-nav.js"></script>
    <script src="desktop-drawer.js"></script>
        <script src="person-photo-core.js"></script>
    <script src="drawer-who.js"></script>
<script src="desktop-header-lead.js"></script>
    <script src="desktop-nav-boot.js"></script>

    <!-- Alpine JS -->
    <script defer src="vendor/alpine-3.15.12.min.js"></script>

    <style>
        [x-cloak] { display: none !important; }
    </style>
</head>
<body x-data="authForm()" x-init="init()" class="m-page m-page--door">
    <!-- The door still gets a bar. No title in the bar — the card says Log in
         or Sign up — and no account, because there isn't one yet. -->
    <header class="m-header">
        <div class="m-header__inner">
            <div class="m-header__lead">
                <a href="index.html" class="m-back">
                    <span class="material-symbols-outlined">chevron_left</span>
                    <span class="m-back__label">Home</span>
                </a>
            </div>
        </div>
    </header>

    <main class="m-page__body">
    <div class="m-door">
        <img alt="" class="m-door__mark" src="assets/mosaic-logo.png" />
        <h1 class="m-door__title" x-text="mode === 'login' ? 'Log in' : 'Sign up'">Log in</h1>

        <form @submit.prevent="submit" class="m-card" style="display:flex;flex-direction:column;gap:var(--space-md)">
            <label class="m-field" for="email">
                <span class="m-label">Email address</span>
                <input type="email" id="email" x-model="email" required class="m-input" autocomplete="username" placeholder="ada@example.test" />
            </label>
            <label class="m-field" for="password">
                <span class="m-label">Password</span>
                <input type="password" id="password" x-model="password" required class="m-input" autocomplete="current-password" />
            </label>

            <label class="m-field" for="confirmPassword" x-show="mode === 'signup'" x-cloak>
                <span class="m-label">Confirm password</span>
                <input type="password" id="confirmPassword" x-model="confirmPassword" :required="mode === 'signup'" class="m-input" autocomplete="new-password" />
            </label>

            <div x-show="error" x-cloak class="m-notice m-notice--error">
                <span class="material-symbols-outlined m-notice__icon">error</span>
                <div class="m-notice__body"><p class="m-notice__text" x-text="error"></p></div>
            </div>

            <!-- A reset link went out. It says the same thing whether or not the
                 address has an account (see account-recovery-core.js). -->
            <div x-show="notice" x-cloak class="m-notice">
                <span class="material-symbols-outlined m-notice__icon">mark_email_read</span>
                <div class="m-notice__body"><p class="m-notice__text" x-text="notice"></p></div>
            </div>

            <button type="submit" :disabled="loading" class="m-btn m-btn--primary m-btn--block">
                <span x-show="!loading" x-text="mode === 'login' ? 'Log in' : 'Create account'">Log in</span>
                <span x-show="loading" class="m-spinner"></span>
            </button>
            <button x-show="mode === 'login'" x-cloak @click="sendReset" :disabled="loading" type="button" class="m-btn m-btn--quiet">
                Forgot password?
            </button>
            <button @click="toggleMode" type="button" class="m-btn m-btn--ghost">
                <span x-text="mode === 'login' ? 'Need an account? Sign up' : 'Already have an account? Log in'"></span>
            </button>
        </form>
    </div>
    </main>

    <script>
        // Where to go once they are in. Normally that is wherever this account
        // lands, but a page can ask to have them back with ?next= — the form
        // answering page does, because being sent to the church's home page
        // after signing in to answer a form loses the form (MS-371).
        //
        // ⚠ Two rules, and both are here rather than in the caller. `next` is
        // only ever a path on this site (SignInReturn.safeReturn — anything
        // else is an open redirect off the back of our own sign-in page). And
        // a kiosk account ignores it: that is a shared device on a table by the
        // door, and it belongs on the kiosk screen whatever link brought it
        // here.
        function afterSignIn(data) {
            if (isKioskAccount(data)) return landingPageFor(data);
            const asked = new URLSearchParams(window.location.search).get('next');
            return SignInReturn.safeReturn(asked) || landingPageFor(data);
        }

        function authForm() {
            return {
                mode: 'login',
                email: '',
                password: '',
                confirmPassword: '',
                error: '',
                notice: '',
                loading: false,

                init() {
                    auth.onAuthStateChanged(user => {
                        // Only auto-redirect if we aren't currently in the middle of a login/signup submission
                        if (user && !user.isAnonymous && !this.loading) {
                            getUserData(user.uid).then(data => {
                                window.location.href = afterSignIn(data);
                            });
                        }
                    });
                },

                toggleMode() {
                    this.mode = this.mode === 'login' ? 'signup' : 'login';
                    this.error = '';
                    this.notice = '';
                },

                /**
                 * Send a password-reset link to whatever is in the email box.
                 *
                 * This is the only way back into a locked-out account (MS-241).
                 * Before it existed, an admin read somebody their password off a
                 * screen — which is why one was being stored in plain text.
                 *
                 * ⚠ The answer is deliberately the same whether or not that
                 * address has an account. account-recovery-core.js explains why
                 * and pins it with a test; do not "improve" it here.
                 */
                async sendReset() {
                    this.error = '';
                    this.notice = '';

                    if (!AccountRecoveryCore.validateEmail(this.email)) {
                        this.error = 'Enter your email address above, then press Forgot password.';
                        return;
                    }

                    this.loading = true;
                    let errorCode = null;
                    try {
                        await auth.sendPasswordResetEmail(this.email);
                    } catch (err) {
                        errorCode = (err && err.code) ? err.code : 'unknown';
                    }
                    this.loading = false;

                    const outcome = AccountRecoveryCore.resetOutcome(errorCode);
                    if (outcome.ok) this.notice = outcome.message;
                    else this.error = outcome.message;
                },

                async submit() {
                    this.error = '';
                    this.notice = '';

                    if (!AccountRecoveryCore.validateEmail(this.email)) {
                        this.error = 'Please enter a valid email address.';
                        return;
                    }

                    if (this.mode === 'signup') {
                        if (this.password !== this.confirmPassword) {
                            this.error = 'Passwords do not match.';
                            return;
                        }
                        if (this.password.length < 6) {
                            this.error = 'Password must be at least 6 characters.';
                            return;
                        }
                    }

                    this.loading = true;
                    try {
                        let uid;
                        if (this.mode === 'login') {
                            const cred = await auth.signInWithEmailAndPassword(this.email, this.password);
                            uid = cred.user.uid;
                        } else {
                            const userCredential = await auth.createUserWithEmailAndPassword(this.email, this.password);
                            const user = userCredential.user;
                            uid = user.uid;
                            
                            // Create user document with default 'viewer' role.
                            //
                            // The password is NOT among these fields, and must
                            // never be again (MS-241). Firebase Auth holds a
                            // hashed copy — that is the one every sign-in uses.
                            // A second readable copy here was a list of the
                            // congregation's passwords, and people reuse them.
                            await db.collection('users').doc(user.uid).set({
                                email: user.email,
                                permissionLevel: 'viewer',
                                role: 'viewer',
                                createdAt: firebase.firestore.FieldValue.serverTimestamp()
                            });
                        }
                        window.location.href = afterSignIn(await getUserData(uid));
                    } catch (err) {
                        this.error = err.message;
                        this.loading = false;
                    }
                }
            }
        }
    </script>
</body>
</html>
