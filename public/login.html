<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Log In - Mosaic Church</title>
    <link rel="stylesheet" href="mosaic.css" />
    <link rel="stylesheet" href="fonts.css" />



    
    <!-- Firebase SDKs -->
    <script src="vendor/firebase/firebase-app-compat.js"></script>
    <script src="vendor/firebase/firebase-auth-compat.js"></script>
    <script src="vendor/firebase/firebase-firestore-compat.js"></script>
    <script src="account-recovery-core.js"></script>
    <script src="sign-in-return-core.js"></script>
    <script src="auth.js"></script>

    <!-- Alpine JS -->
    <script defer src="vendor/alpine-3.15.12.min.js"></script>

    <style>
        [x-cloak] { display: none !important; }
    </style>
</head>
<body x-data="authForm()" x-init="init()" class="bg-background text-on-background font-body-md antialiased min-h-screen flex flex-col relative overflow-hidden">
    <!-- Architectural accent lines (Modern Minimalism) -->
    <div class="absolute right-0 top-0 h-full w-1/3 bg-gradient-to-l from-surface-container-high to-transparent opacity-50 pointer-events-none"></div>
    <div class="absolute -right-12 -top-12 w-64 h-64 border-[1px] border-outline-variant rounded-full opacity-20 pointer-events-none"></div>
    <div class="absolute -left-12 -bottom-12 w-48 h-48 border-[1px] border-outline-variant rounded-full opacity-10 pointer-events-none"></div>

    <!-- The door still gets a bar. No title — the card says Log In or Sign Up and
         says it twice otherwise — and no account, because there isn't one yet.
         The body centred its card directly; it now centres it in what is left
         below the bar, so the card sits where it always did. -->
    <header class="m-header relative z-10">
        <div class="m-header__inner">
            <div class="m-header__lead">
                <a href="index.html" class="m-back">
                    <span class="material-symbols-outlined">chevron_left</span>
                    <span class="m-back__label">Home</span>
                </a>
            </div>
        </div>
    </header>

    <div class="flex-1 flex flex-col justify-center items-center p-gutter">
    <div class="w-full max-w-md bg-surface-container-lowest border border-outline-variant/30 rounded-xl p-lg shadow-sm relative z-10">
        <div class="w-full flex justify-center mb-md">
            <img alt="Mosaic Liturgy Logo" class="h-16 w-16 object-contain" src="assets/mosaic-logo.png" />
        </div>
        <h1 class="font-display-lg text-4xl text-primary text-center mb-md tracking-tight" x-text="mode === 'login' ? 'Log In' : 'Sign Up'">Log In</h1>
        
        <form @submit.prevent="submit" class="flex flex-col gap-md">
            <div class="flex flex-col gap-xs">
                <label for="email" class="font-label-md text-label-md text-on-surface-variant uppercase tracking-widest text-[11px]">Email Address</label>
                <input type="email" id="email" x-model="email" required class="w-full py-3 px-4 bg-surface-container-low border border-outline-variant/50 rounded-lg focus:border-tertiary-container focus:ring-1 focus:ring-tertiary-container transition-all outline-none font-body-md text-on-surface" placeholder="email@example.com" />
            </div>
            <div class="flex flex-col gap-xs">
                <label for="password" class="font-label-md text-label-md text-on-surface-variant uppercase tracking-widest text-[11px]">Password</label>
                <input type="password" id="password" x-model="password" required class="w-full py-3 px-4 bg-surface-container-low border border-outline-variant/50 rounded-lg focus:border-tertiary-container focus:ring-1 focus:ring-tertiary-container transition-all outline-none font-body-md text-on-surface" placeholder="••••••••" />
            </div>
            
            <div x-show="mode === 'signup'" x-cloak class="flex flex-col gap-xs">
                <label for="confirmPassword" class="font-label-md text-label-md text-on-surface-variant uppercase tracking-widest text-[11px]">Confirm Password</label>
                <input type="password" id="confirmPassword" x-model="confirmPassword" :required="mode === 'signup'" class="w-full py-3 px-4 bg-surface-container-low border border-outline-variant/50 rounded-lg focus:border-tertiary-container focus:ring-1 focus:ring-tertiary-container transition-all outline-none font-body-md text-on-surface" placeholder="••••••••" />
            </div>

            <div x-show="error" x-cloak class="text-error font-body-md text-sm flex items-center gap-1 bg-error-container/30 p-3 rounded-lg border border-error/20">
                <span class="material-symbols-outlined text-sm">error</span>
                <span x-text="error"></span>
            </div>

            <!-- A reset link went out. Not an error, so it does not wear the
                 error colours — and it says the same thing whether or not the
                 address has an account (see account-recovery-core.js). -->
            <div x-show="notice" x-cloak class="text-primary font-body-md text-sm flex items-center gap-1 bg-surface-container p-3 rounded-lg border border-outline-variant/40">
                <span class="material-symbols-outlined text-sm">mark_email_read</span>
                <span x-text="notice"></span>
            </div>

            <button type="submit" :disabled="loading" class="bg-primary text-on-primary font-label-md text-label-md py-3 rounded-lg hover:bg-primary-container transition-all duration-200 mt-md shadow-sm active:scale-[0.98] disabled:opacity-50 disabled:cursor-not-allowed">
                <span x-show="!loading" x-text="mode === 'login' ? 'Access Portal' : 'Create Account'">Access Portal</span>
                <span x-show="loading" class="flex items-center justify-center gap-2">
                    <svg class="animate-spin h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                    Processing...
                </span>
            </button>
        </form>
        
        <div class="mt-lg text-center flex flex-col gap-4">
            <!-- The way back in. Only on the login side — there is nothing to
                 reset while you are creating an account. -->
            <button x-show="mode === 'login'" x-cloak @click="sendReset" :disabled="loading" type="button"
                    class="text-secondary hover:text-primary font-label-md text-xs uppercase tracking-widest transition-colors disabled:opacity-50">
                Forgot password?
            </button>

            <button @click="toggleMode" class="text-secondary hover:text-primary font-label-md text-xs uppercase tracking-widest transition-colors">
                <span x-text="mode === 'login' ? 'Don\'t have an account? Sign Up' : 'Already have an account? Log In'"></span>
            </button>

            <a href="index.html" class="text-secondary hover:text-primary font-label-md text-xs uppercase tracking-widest flex items-center justify-center gap-2 transition-colors">
                <span class="material-symbols-outlined text-sm">chevron_left</span>
                Back to Public Directory
            </a>
        </div>
    </div>
    </div>

    <script>
        // Where to go once they are in. Normally that is wherever this account
        // lands, but a page can ask to have them back with ?next= — the form
        // answering page does, because being sent to the church's home page
        // after signing in to answer a form loses the form (MS-371).
        //
        // ⚠ Two rules, and both are here rather than in the caller. `next` is
        // only ever a path on this site (SignInReturn.safeReturn — anything
        // else is an open redirect off the back of our own sign-in page). And
        // a kiosk account ignores it: that is a shared device on a table by the
        // door, and it belongs on the kiosk screen whatever link brought it
        // here.
        function afterSignIn(data) {
            if (isKioskAccount(data)) return landingPageFor(data);
            const asked = new URLSearchParams(window.location.search).get('next');
            return SignInReturn.safeReturn(asked) || landingPageFor(data);
        }

        function authForm() {
            return {
                mode: 'login',
                email: '',
                password: '',
                confirmPassword: '',
                error: '',
                notice: '',
                loading: false,

                init() {
                    auth.onAuthStateChanged(user => {
                        // Only auto-redirect if we aren't currently in the middle of a login/signup submission
                        if (user && !user.isAnonymous && !this.loading) {
                            getUserData(user.uid).then(data => {
                                window.location.href = afterSignIn(data);
                            });
                        }
                    });
                },

                toggleMode() {
                    this.mode = this.mode === 'login' ? 'signup' : 'login';
                    this.error = '';
                    this.notice = '';
                },

                /**
                 * Send a password-reset link to whatever is in the email box.
                 *
                 * This is the only way back into a locked-out account (MS-241).
                 * Before it existed, an admin read somebody their password off a
                 * screen — which is why one was being stored in plain text.
                 *
                 * ⚠ The answer is deliberately the same whether or not that
                 * address has an account. account-recovery-core.js explains why
                 * and pins it with a test; do not "improve" it here.
                 */
                async sendReset() {
                    this.error = '';
                    this.notice = '';

                    if (!AccountRecoveryCore.validateEmail(this.email)) {
                        this.error = 'Enter your email address above, then press Forgot password.';
                        return;
                    }

                    this.loading = true;
                    let errorCode = null;
                    try {
                        await auth.sendPasswordResetEmail(this.email);
                    } catch (err) {
                        errorCode = (err && err.code) ? err.code : 'unknown';
                    }
                    this.loading = false;

                    const outcome = AccountRecoveryCore.resetOutcome(errorCode);
                    if (outcome.ok) this.notice = outcome.message;
                    else this.error = outcome.message;
                },

                async submit() {
                    this.error = '';
                    this.notice = '';

                    if (!AccountRecoveryCore.validateEmail(this.email)) {
                        this.error = 'Please enter a valid email address.';
                        return;
                    }

                    if (this.mode === 'signup') {
                        if (this.password !== this.confirmPassword) {
                            this.error = 'Passwords do not match.';
                            return;
                        }
                        if (this.password.length < 6) {
                            this.error = 'Password must be at least 6 characters.';
                            return;
                        }
                    }

                    this.loading = true;
                    try {
                        let uid;
                        if (this.mode === 'login') {
                            const cred = await auth.signInWithEmailAndPassword(this.email, this.password);
                            uid = cred.user.uid;
                        } else {
                            const userCredential = await auth.createUserWithEmailAndPassword(this.email, this.password);
                            const user = userCredential.user;
                            uid = user.uid;
                            
                            // Create user document with default 'viewer' role.
                            //
                            // The password is NOT among these fields, and must
                            // never be again (MS-241). Firebase Auth holds a
                            // hashed copy — that is the one every sign-in uses.
                            // A second readable copy here was a list of the
                            // congregation's passwords, and people reuse them.
                            await db.collection('users').doc(user.uid).set({
                                email: user.email,
                                permissionLevel: 'viewer',
                                role: 'viewer',
                                createdAt: firebase.firestore.FieldValue.serverTimestamp()
                            });
                        }
                        window.location.href = afterSignIn(await getUserData(uid));
                    } catch (err) {
                        this.error = err.message;
                        this.loading = false;
                    }
                }
            }
        }
    </script>
</body>
</html>
