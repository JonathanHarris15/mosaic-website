<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Tags</title>
    <script>
        // A bookmark, not a page. Tags live in the People side panel.
        // Relationships and Families are tabs on the Relations viewer.
        (function () {
            var incoming = new URLSearchParams(location.search);
            var tab = incoming.get('tab');
            var household = incoming.get('household');
            var dest, set;
            if (tab === 'relationships') {
                dest = 'relations-viewer.html';
                set = { tab: 'relationships' };
            } else if (tab === 'families' || household) {
                dest = 'relations-viewer.html';
                set = { tab: 'families' };
                if (household) set.household = household;
            } else {
                dest = 'shepherding-people.html';
                set = { panel: 'tags' };
            }
            var next = new URLSearchParams(incoming);
            next.delete('tab');
            next.delete('household');
            next.delete('panel');
            Object.keys(set).forEach(function (key) { next.set(key, set[key]); });
            var q = next.toString();
            location.replace(dest + (q ? '?' + q : ''));
        })();
    </script>
</head>
<body>
    <p><a href="shepherding-people.html?panel=tags">People</a></p>
</body>
</html>
