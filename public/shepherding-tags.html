<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport" />
    <script src="mobile-shell.js"></script>
    <link rel="stylesheet" href="mobile-shell.css" />
    <script>window.MOBILE_HEADER = { title: 'Manage Tags and Relationships', back: 'mobile.html#/shepherd' };</script>
    <script src="mobile-shell-header.js"></script>
    <title>Manage Tags and Relationships | Mosaic</title>




    <link rel="stylesheet" href="mosaic.css" />
    <link rel="stylesheet" href="fonts.css" />

    <style>
        [x-cloak] { display: none !important; }

        /* Mobile shell: the per-tag action buttons are hover-only on desktop, so
           they're invisible/unusable on touch. Stack the name over a full-width
           action bar with evenly-spread, finger-sized targets so nothing gets
           crushed on a phone. Desktop is untouched (rules scoped to .shell-mobile). */
        html.shell-mobile main { padding-left: 16px; padding-right: 16px; }
        html.shell-mobile .tag-actions { opacity: 1 !important; }
        html.shell-mobile .tag-row {
            flex-direction: column;
            align-items: stretch;
            gap: 8px;
        }
        html.shell-mobile .tag-row > span,
        html.shell-mobile .tag-row > input { width: 100%; font-size: 1rem; }
        html.shell-mobile .tag-actions {
            width: 100%;
            justify-content: space-between;
            gap: 4px;
            padding-top: 8px;
            border-top: 1px solid var(--outline-variant);
        }
        html.shell-mobile .tag-actions button {
            flex: 1 1 0;
            min-height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            background: var(--surface-container);
            padding: 0;
        }
        html.shell-mobile .tag-actions button:active { background: var(--surface-container-high); }
        /* Merge survivor picker: room to wrap + finger-sized chips. */
        html.shell-mobile .tag-merge-option { padding: 8px 14px; }
    </style>
    <script src="vendor/firebase/firebase-app-compat.js"></script>
    <script src="vendor/firebase/firebase-auth-compat.js"></script>
    <script src="vendor/firebase/firebase-firestore-compat.js"></script>
    <script src="vendor/firebase/firebase-functions-compat.js"></script>
    <script src="auth.js"></script>
    <script defer src="vendor/alpine-3.15.12.min.js"></script>
</head>

<body class="bg-background text-on-background font-body-md text-body-md antialiased min-h-screen flex flex-col"
      x-data="shepherdingTags" x-cloak>

    <!-- Header -->
    <header class="w-full max-w-7xl mx-auto px-4 md:px-margin pt-2 md:pt-md flex items-center justify-between">
        <a :href="window.MOSAIC_SHELL === 'mobile' ? 'mobile.html#/shepherd' : 'shepherding-dashboard.html'" href="shepherding-dashboard.html" class="flex items-center gap-1 text-on-surface-variant hover:text-primary transition-colors duration-200">
            <span class="material-symbols-outlined text-[20px]">arrow_back</span>
            <span class="font-label-md text-label-md">Shepherd Dashboard</span>
        </a>
        <div id="auth-container" class="flex items-center">
            <div class="h-10"></div>
        </div>
    </header>

    <!-- Loading state -->
    <div x-show="loading" class="flex-grow flex items-center justify-center">
        <span class="material-symbols-outlined text-[48px] text-outline animate-spin">progress_activity</span>
    </div>

    <!-- Main content -->
    <main x-show="!loading" class="flex-grow max-w-3xl w-full mx-auto px-4 md:px-margin pb-lg flex flex-col gap-margin pt-md">

        <!-- Page Title -->
        <div>
            <h1 class="font-headline-lg text-headline-lg text-primary">Manage Tags and Relationships</h1>
            <p class="font-body-md text-body-md text-on-surface-variant mt-xs"
               x-text="activeTab === 'tags'
                   ? 'Create, rename, merge, and delete shepherding tags. Hover a tag for its actions.'
                   : 'Define Relationship Types and manage who holds them. Types and named groups can only be created here.'"></p>
        </div>

        <!-- Tabs -->
        <div class="flex gap-xs border-b border-outline-variant" role="tablist">
            <button role="tab" @click="activeTab = 'tags'"
                :aria-selected="activeTab === 'tags'"
                :class="activeTab === 'tags' ? 'border-primary text-primary' : 'border-transparent text-on-surface-variant hover:text-on-surface'"
                class="px-md py-sm -mb-px border-b-2 font-label-md text-label-md transition-colors">
                Tags
            </button>
            <button role="tab" @click="activeTab = 'relationships'"
                :aria-selected="activeTab === 'relationships'"
                :class="activeTab === 'relationships' ? 'border-primary text-primary' : 'border-transparent text-on-surface-variant hover:text-on-surface'"
                class="px-md py-sm -mb-px border-b-2 font-label-md text-label-md transition-colors">
                Relationships
            </button>
        </div>

        <div x-show="activeTab === 'tags'" class="bg-surface-container-lowest border border-outline-variant rounded-xl p-lg flex flex-col gap-md">

            <!-- Create new tag -->
            <div class="flex gap-sm">
                <input type="text" x-model="newTagName" placeholder="New tag name"
                       @keydown.enter="addTag()"
                       class="flex-grow border border-outline-variant rounded-lg px-md py-sm font-body-md text-body-md bg-surface focus:outline-none focus:ring-2 focus:ring-primary/30" />
                <button @click="addTag()"
                    :disabled="!newTagName.trim()"
                    class="px-md py-xs font-label-md text-label-md bg-primary text-on-primary rounded-lg hover:bg-primary/90 transition-colors disabled:opacity-40 disabled:cursor-not-allowed">
                    Create
                </button>
            </div>

            <!-- Tag list -->
            <ul class="flex flex-col gap-xs">
                <template x-for="tag in shepherdingTags" :key="tag.id">
                    <li class="group flex flex-col gap-xs px-sm py-sm rounded-lg border border-transparent hover:border-outline-variant hover:bg-surface-container transition-colors">
                        <div class="tag-row flex items-center justify-between gap-sm">
                            <span x-show="editingTagId !== tag.id" class="font-body-md text-on-surface" x-text="tag.name"></span>
                            <input x-show="editingTagId === tag.id" type="text" x-model="editingTagName"
                                   @keydown.enter="renameTag(tag.id)" @keydown.escape="cancelRenameTag()"
                                   class="flex-grow border border-outline-variant rounded px-sm py-[2px] font-body-md text-body-md bg-surface focus:outline-none focus:ring-2 focus:ring-primary/30" />
                            <!-- Membership Tags are code-defined (ADR-0012): no edit controls, a lock badge instead. -->
                            <span x-show="tag.locked" class="flex items-center gap-xs text-outline-variant font-label-sm text-label-sm flex-shrink-0" title="Managed by the Membership Track">
                                <span class="material-symbols-outlined text-[18px]">lock</span>
                                <span>System</span>
                            </span>
                            <div x-show="!tag.locked" class="tag-actions flex items-center gap-sm flex-shrink-0"
                                 :class="editingTagId === tag.id || mergingTagId === tag.id ? '' : 'opacity-0 group-hover:opacity-100 transition-opacity'">
                                <button x-show="editingTagId === tag.id" @click="renameTag(tag.id)"
                                    class="text-primary transition-colors" title="Save name">
                                    <span class="material-symbols-outlined text-[20px]">check</span>
                                </button>
                                <button x-show="editingTagId !== tag.id" @click="startRenameTag(tag)"
                                    class="text-outline-variant hover:text-primary transition-colors" title="Rename tag">
                                    <span class="material-symbols-outlined text-[20px]">edit</span>
                                </button>
                                <button x-show="editingTagId !== tag.id" @click="startMergeTag(tag)"
                                    :class="mergingTagId === tag.id ? 'text-primary' : 'text-outline-variant hover:text-primary'"
                                    class="transition-colors" title="Merge into another tag">
                                    <span class="material-symbols-outlined text-[20px]">merge</span>
                                </button>
                                <button @click="toggleTagFlag(tag.id, 'hiddenFromOthers')"
                                    :class="tag.hiddenFromOthers ? 'text-primary' : 'text-outline-variant hover:text-primary'"
                                    :title="tag.hiddenFromOthers ? 'Hidden from non-admins' : 'Visible to all'"
                                    class="transition-colors">
                                    <span class="material-symbols-outlined text-[20px]" x-text="tag.hiddenFromOthers ? 'visibility_off' : 'visibility'"></span>
                                </button>
                                <button @click="toggleTagFlag(tag.id, 'hidePeople')"
                                    :class="tag.hidePeople ? 'text-primary' : 'text-outline-variant hover:text-primary'"
                                    :title="tag.hidePeople ? 'People with this tag are hidden from non-admins' : 'People with this tag are visible'"
                                    class="transition-colors">
                                    <span class="material-symbols-outlined text-[20px]" x-text="tag.hidePeople ? 'person_off' : 'person'"></span>
                                </button>
                                <button @click="deleteTag(tag.id, tag.name)"
                                    class="text-on-surface-variant hover:text-error transition-colors">
                                    <span class="material-symbols-outlined text-[20px]">delete</span>
                                </button>
                            </div>
                        </div>
                        <!-- Merge survivor picker -->
                        <div x-show="mergingTagId === tag.id" class="flex flex-col gap-xs bg-surface-container-low rounded-lg p-sm">
                            <span class="text-xs text-on-surface-variant">Merge <span class="font-medium" x-text="tag.name"></span> into…</span>
                            <div class="flex flex-wrap gap-xs">
                                <template x-for="other in shepherdingTags.filter(t => t.id !== tag.id && !t.locked)" :key="other.id">
                                    <button @click="mergeTagInto(other.id)"
                                        class="tag-merge-option px-sm py-[2px] bg-surface-container text-on-surface hover:bg-primary hover:text-on-primary rounded-full font-label-md text-label-md transition-colors"
                                        x-text="other.name"></button>
                                </template>
                                <span x-show="shepherdingTags.length <= 1" class="text-xs italic text-on-surface-variant">No other tag to merge into.</span>
                            </div>
                            <button @click="cancelMergeTag()" class="self-start text-xs text-on-surface-variant hover:text-error transition-colors">Cancel</button>
                        </div>
                    </li>
                </template>
                <li x-show="shepherdingTags.length === 0" class="text-on-surface-variant italic text-sm px-sm py-md">
                    No tags yet. Create one above.
                </li>
            </ul>
        </div>

        <!-- ── Relationships tab ─────────────────────────────────────────────
             The one home for relationship vocabulary (ADR-0014). A type is a
             kind × priority structure; selecting one manages who holds it —
             the pairs of a Pairwise type, or the named groups of a Group type. -->
        <div x-show="activeTab === 'relationships'"
             class="bg-surface-container-lowest border border-outline-variant rounded-xl p-lg flex flex-col gap-md">

            <!-- The tab failed to load — say so plainly rather than showing an
                 empty panel that looks like "no types yet". -->
            <div x-show="relError" class="flex items-start gap-sm rounded-lg bg-error-container text-on-error-container p-md">
                <span class="material-symbols-outlined text-[20px] flex-shrink-0">error</span>
                <span class="font-body-md text-body-md" x-text="relError"></span>
            </div>

            <!-- New / edit Relationship Type -->
            <div class="flex items-center justify-between">
                <h2 class="font-title-md text-title-md text-on-surface">Relationship Types</h2>
                <button x-show="!showTypeForm" @click="startNewType()"
                    class="px-md py-xs font-label-md text-label-md bg-primary text-on-primary rounded-lg hover:bg-primary/90 transition-colors">
                    New Relationship Type
                </button>
            </div>

            <div x-show="showTypeForm" class="flex flex-col gap-sm bg-surface-container-low rounded-lg p-md">
                <input type="text" x-model="typeForm.name" placeholder="Type name (e.g. Discipleship, Bible Study)"
                       class="border border-outline-variant rounded-lg px-md py-sm font-body-md text-body-md bg-surface focus:outline-none focus:ring-2 focus:ring-primary/30" />

                <div class="flex flex-wrap gap-md">
                    <!-- Kind is fixed once the type exists: flipping it would orphan every instance. -->
                    <label class="flex flex-col gap-xs">
                        <span class="font-label-sm text-label-sm text-on-surface-variant">Kind</span>
                        <select x-model="typeForm.kind" :disabled="editingTypeId"
                            class="border border-outline-variant rounded-lg px-sm py-xs bg-surface font-body-md text-body-md disabled:opacity-50 disabled:cursor-not-allowed">
                            <option value="pairwise">Pairwise — connects two people</option>
                            <option value="group">Group — a roster of many</option>
                        </select>
                        <span x-show="editingTypeId" class="font-label-sm text-label-sm text-outline-variant">Kind cannot be changed after creation.</span>
                    </label>

                    <label class="flex items-center gap-xs self-end pb-xs">
                        <input type="checkbox" x-model="typeForm.priority" class="rounded border-outline-variant" />
                        <span class="font-label-md text-label-md text-on-surface">Prioritized (one side leads)</span>
                    </label>
                </div>

                <!-- The label fields depend on kind × priority. -->
                <div x-show="!typeForm.priority" class="flex flex-col gap-xs">
                    <input type="text" x-model="typeForm.label" placeholder="Label — the one symmetric name (e.g. Friend, Participant)"
                           class="border border-outline-variant rounded-lg px-md py-sm font-body-md text-body-md bg-surface focus:outline-none focus:ring-2 focus:ring-primary/30" />
                </div>
                <div x-show="typeForm.priority && typeForm.kind === 'pairwise'" class="flex flex-wrap gap-sm">
                    <input type="text" x-model="typeForm.holderLabel" placeholder="Holder Label (e.g. Discipler)"
                           class="flex-1 border border-outline-variant rounded-lg px-md py-sm font-body-md text-body-md bg-surface focus:outline-none focus:ring-2 focus:ring-primary/30" />
                    <input type="text" x-model="typeForm.counterpartLabel" placeholder="Counterpart Label (e.g. Disciplee)"
                           class="flex-1 border border-outline-variant rounded-lg px-md py-sm font-body-md text-body-md bg-surface focus:outline-none focus:ring-2 focus:ring-primary/30" />
                </div>
                <div x-show="typeForm.priority && typeForm.kind === 'group'" class="flex flex-wrap gap-sm">
                    <input type="text" x-model="typeForm.leaderLabel" placeholder="Leader Label (e.g. Leader)"
                           class="flex-1 border border-outline-variant rounded-lg px-md py-sm font-body-md text-body-md bg-surface focus:outline-none focus:ring-2 focus:ring-primary/30" />
                    <input type="text" x-model="typeForm.memberLabel" placeholder="Member Label (e.g. Member)"
                           class="flex-1 border border-outline-variant rounded-lg px-md py-sm font-body-md text-body-md bg-surface focus:outline-none focus:ring-2 focus:ring-primary/30" />
                </div>

                <div class="flex gap-sm">
                    <button @click="saveType()"
                        class="px-md py-xs font-label-md text-label-md bg-primary text-on-primary rounded-lg hover:bg-primary/90 transition-colors"
                        x-text="editingTypeId ? 'Save changes' : 'Create type'"></button>
                    <button @click="resetTypeForm()"
                        class="px-md py-xs font-label-md text-label-md text-on-surface-variant hover:text-error transition-colors">Cancel</button>
                </div>
            </div>

            <!-- Type list. Selecting a type opens its instances. -->
            <ul class="flex flex-col gap-xs">
                <template x-for="type in relTypes" :key="type.id">
                    <li class="group flex flex-col gap-xs rounded-lg border border-transparent hover:border-outline-variant transition-colors">
                        <div class="flex items-center justify-between gap-sm px-sm py-sm">
                            <button @click="selectType(type)" class="flex-grow text-left">
                                <span class="font-body-md text-on-surface" x-text="type.name"></span>
                                <span class="block font-label-sm text-label-sm text-on-surface-variant" x-text="typeSummary(type)"></span>
                            </button>
                            <div class="flex items-center gap-sm flex-shrink-0">
                                <span class="font-label-sm text-label-sm text-outline-variant"
                                      x-text="instanceCount(type.id) + (type.kind === 'group' ? ' group(s)' : ' pair(s)')"></span>
                                <button @click="startEditType(type)" class="text-outline-variant hover:text-primary transition-colors" title="Edit labels and priority">
                                    <span class="material-symbols-outlined text-[20px]">edit</span>
                                </button>
                                <button @click="deleteType(type)" class="text-on-surface-variant hover:text-error transition-colors" title="Delete type">
                                    <span class="material-symbols-outlined text-[20px]">delete</span>
                                </button>
                                <span class="material-symbols-outlined text-[20px] text-outline-variant"
                                      x-text="selectedTypeId === type.id ? 'expand_less' : 'expand_more'"></span>
                            </div>
                        </div>

                        <!-- ── Who holds this type ────────────────────────────── -->
                        <div x-show="selectedTypeId === type.id" class="bg-surface-container-low rounded-lg p-md flex flex-col gap-sm mx-sm mb-sm">

                            <!-- Pairwise: the pairs -->
                            <template x-if="type.kind === 'pairwise'">
                                <div class="flex flex-col gap-sm">
                                    <div class="flex flex-col gap-xs">
                                        <template x-for="pair in pairsForType(type.id)" :key="pair.id">
                                            <div class="flex items-center justify-between gap-sm px-sm py-xs bg-surface rounded">
                                                <span class="font-body-md text-body-md text-on-surface" x-text="pairSentence(pair, type)"></span>
                                                <button @click="removePair(pair)" class="text-on-surface-variant hover:text-error transition-colors flex-shrink-0">
                                                    <span class="material-symbols-outlined text-[18px]">close</span>
                                                </button>
                                            </div>
                                        </template>
                                        <span x-show="pairsForType(type.id).length === 0" class="text-xs italic text-on-surface-variant">Nobody holds this type yet.</span>
                                    </div>

                                    <!-- Add a pair. For a Prioritized type the first slot is the priority holder. -->
                                    <div class="flex flex-wrap gap-sm items-start">
                                        <div class="flex-1 min-w-[160px] relative">
                                            <input type="text" x-model="pairForm.holderName" @input="pairForm.holderId = null"
                                                   :placeholder="type.priority ? labelFor(type, 'holder') : 'Person'"
                                                   class="w-full border border-outline-variant rounded-lg px-sm py-xs font-body-md text-body-md bg-surface focus:outline-none focus:ring-2 focus:ring-primary/30" />
                                            <div x-show="!pairForm.holderId && personCandidates(pairForm.holderName, [pairForm.counterpartId]).length"
                                                 class="absolute z-10 mt-1 w-full bg-surface border border-outline-variant rounded-lg shadow-lg">
                                                <template x-for="p in personCandidates(pairForm.holderName, [pairForm.counterpartId])" :key="p.id">
                                                    <button @click="pickPairPerson('holder', p)"
                                                        class="block w-full text-left px-sm py-xs font-body-md text-body-md hover:bg-surface-container" x-text="p.name"></button>
                                                </template>
                                            </div>
                                        </div>
                                        <span class="pt-xs text-outline-variant" x-text="type.priority ? '→' : '↔'"></span>
                                        <div class="flex-1 min-w-[160px] relative">
                                            <input type="text" x-model="pairForm.counterpartName" @input="pairForm.counterpartId = null"
                                                   :placeholder="type.priority ? labelFor(type, 'counterpart') : 'Person'"
                                                   class="w-full border border-outline-variant rounded-lg px-sm py-xs font-body-md text-body-md bg-surface focus:outline-none focus:ring-2 focus:ring-primary/30" />
                                            <div x-show="!pairForm.counterpartId && personCandidates(pairForm.counterpartName, [pairForm.holderId]).length"
                                                 class="absolute z-10 mt-1 w-full bg-surface border border-outline-variant rounded-lg shadow-lg">
                                                <template x-for="p in personCandidates(pairForm.counterpartName, [pairForm.holderId])" :key="p.id">
                                                    <button @click="pickPairPerson('counterpart', p)"
                                                        class="block w-full text-left px-sm py-xs font-body-md text-body-md hover:bg-surface-container" x-text="p.name"></button>
                                                </template>
                                            </div>
                                        </div>
                                        <button @click="addPair()" :disabled="!pairForm.holderId || !pairForm.counterpartId"
                                            class="px-md py-xs font-label-md text-label-md bg-primary text-on-primary rounded-lg hover:bg-primary/90 transition-colors disabled:opacity-40 disabled:cursor-not-allowed">
                                            Add
                                        </button>
                                    </div>
                                </div>
                            </template>

                            <!-- Group: the named Relationship Groups -->
                            <template x-if="type.kind === 'group'">
                                <div class="flex flex-col gap-sm">
                                    <template x-for="group in groupsForType(type.id)" :key="group.id">
                                        <div class="flex flex-col gap-xs bg-surface rounded p-sm">
                                            <div class="flex items-center justify-between">
                                                <span class="font-medium font-body-md text-on-surface" x-text="group.name"></span>
                                                <button @click="deleteGroup(group)" class="text-on-surface-variant hover:text-error transition-colors">
                                                    <span class="material-symbols-outlined text-[18px]">delete</span>
                                                </button>
                                            </div>

                                            <!-- Leader (Prioritized groups only). May sit empty. -->
                                            <div x-show="type.priority" class="flex items-center gap-xs flex-wrap">
                                                <span class="font-label-sm text-label-sm text-on-surface-variant" x-text="labelFor(type, 'leader') + ':'"></span>
                                                <template x-if="group.leaderId">
                                                    <span class="flex items-center gap-xs px-sm py-[2px] bg-primary/10 text-primary rounded-full font-label-md text-label-md">
                                                        <span x-text="personName(group.leaderId)"></span>
                                                        <button @click="clearGroupLeader(group)" title="Stand down">
                                                            <span class="material-symbols-outlined text-[14px]">close</span>
                                                        </button>
                                                    </span>
                                                </template>
                                                <span x-show="!group.leaderId" class="text-xs italic text-on-surface-variant">none yet — pick from the roster below</span>
                                            </div>

                                            <!-- Roster -->
                                            <div class="flex flex-wrap gap-xs items-center">
                                                <template x-for="mid in group.memberIds" :key="mid">
                                                    <span class="flex items-center gap-xs px-sm py-[2px] bg-surface-container rounded-full font-label-md text-label-md">
                                                        <span x-text="personName(mid)"></span>
                                                        <button x-show="type.priority && !group.leaderId" @click="setGroupLeader(group, mid)"
                                                                :title="'Make ' + labelFor(type, 'leader')" class="text-outline-variant hover:text-primary">
                                                            <span class="material-symbols-outlined text-[14px]">arrow_upward</span>
                                                        </button>
                                                        <button @click="removeGroupMember(group, mid)" class="text-outline-variant hover:text-error">
                                                            <span class="material-symbols-outlined text-[14px]">close</span>
                                                        </button>
                                                    </span>
                                                </template>
                                                <span x-show="group.memberIds.length === 0" class="text-xs italic text-on-surface-variant">empty roster</span>
                                            </div>

                                            <!-- Add a member -->
                                            <div class="relative w-full max-w-[240px]">
                                                <input type="text" placeholder="Add someone…"
                                                       :value="memberPicker.groupId === group.id ? memberPicker.name : ''"
                                                       @input="memberPicker = { groupId: group.id, name: $event.target.value }"
                                                       class="w-full border border-outline-variant rounded-lg px-sm py-xs font-body-md text-body-md bg-surface focus:outline-none focus:ring-2 focus:ring-primary/30" />
                                                <div x-show="memberPicker.groupId === group.id && personCandidates(memberPicker.name, [group.leaderId, ...group.memberIds]).length"
                                                     class="absolute z-10 mt-1 w-full bg-surface border border-outline-variant rounded-lg shadow-lg">
                                                    <template x-for="p in personCandidates(memberPicker.name, [group.leaderId, ...group.memberIds])" :key="p.id">
                                                        <button @click="addGroupMember(group, p)"
                                                            class="block w-full text-left px-sm py-xs font-body-md text-body-md hover:bg-surface-container" x-text="p.name"></button>
                                                    </template>
                                                </div>
                                            </div>
                                        </div>
                                    </template>
                                    <span x-show="groupsForType(type.id).length === 0" class="text-xs italic text-on-surface-variant">No groups of this type yet.</span>

                                    <!-- New named group. A fresh group is leaderless and empty — both valid. -->
                                    <div class="flex gap-sm">
                                        <input type="text" x-model="groupForm.name" placeholder="New group name (e.g. Tuesday Bible Study)"
                                               @keydown.enter="createGroup()"
                                               class="flex-grow border border-outline-variant rounded-lg px-sm py-xs font-body-md text-body-md bg-surface focus:outline-none focus:ring-2 focus:ring-primary/30" />
                                        <button @click="createGroup()" :disabled="!groupForm.name.trim()"
                                            class="px-md py-xs font-label-md text-label-md bg-primary text-on-primary rounded-lg hover:bg-primary/90 transition-colors disabled:opacity-40 disabled:cursor-not-allowed">
                                            Create group
                                        </button>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </li>
                </template>
                <li x-show="relTypes.length === 0" class="text-on-surface-variant italic text-sm px-sm py-md">
                    No Relationship Types yet. Create one above.
                </li>
            </ul>
        </div>
    </main>

    <!-- Toast -->
    <div x-show="toast.show" x-cloak x-transition
         class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 px-lg py-sm rounded-lg shadow-lg font-label-md text-label-md"
         :class="toast.type === 'error' ? 'bg-error text-on-error' : 'bg-inverse-surface text-inverse-on-surface'">
        <span x-text="toast.message"></span>
    </div>

    <script src="shepherding-core.js"></script>
    <script src="shepherding-blur.js"></script>
    <script src="relationship-core.js"></script>
    <script src="relationship-group-core.js"></script>
    <script src="shepherding-relationships.js"></script>
    <script src="shepherding-tags.js"></script>
</body>
</html>
