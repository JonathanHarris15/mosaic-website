<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Services - Mosaic Services</title>

    <!-- Mobile shell: adapt this page when opened inside the Capacitor WebView
         (the native Services screen routes its "Inject service" action here). -->
    <script src="mobile-shell.js"></script>
    <link rel="stylesheet" href="mobile-shell.css" />
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            if (window.MOSAIC_SHELL === 'mobile') {
                var h = document.getElementById('shell-home-link');
                if (h) h.setAttribute('href', 'mobile.html#/home');
            }
        });
    </script>
    <!-- Google Fonts: Noto Serif & Work Sans -->



    <!-- Material Symbols -->

    <!-- Tailwind CSS -->
    <link rel="stylesheet" href="mosaic.css" />
    <link rel="stylesheet" href="fonts.css" />

    <style>
        /* Custom scrollbar for a cleaner look */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--surface-container-high);
            /* surface-variant */
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--outline-variant);
            /* outline-variant */
        }

        .cursor-edit {
            cursor: cell;
        }

        .saving-pulse {
            animation: pulse 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: .5; }
        }

        /* Sticky Table Header and Column */
        .sticky-header th {
            position: sticky;
            top: 0;
            z-index: 30;
            background-color: var(--surface-container-lowest) !important; /* Match sticky column background */
            border-bottom: 1px solid var(--outline-variant);
        }

        /* Specifically for the sticky actions header */
        .sticky-header th.sticky-column {
            z-index: 40;
            background-color: var(--surface-container-lowest) !important;
        }

        .sticky-column {
            position: sticky;
            right: 0;
            z-index: 20;
            background-color: var(--surface-container-lowest) !important;
        }

        .sticky-col-left {
            position: sticky;
            left: 0;
            z-index: 20;
            background-color: var(--surface-container-lowest) !important;
        }

        .sticky-header th.sticky-col-left {
            z-index: 40;
            background-color: var(--surface-container-lowest) !important;
        }

        /* Ensure dark mode also uses a consistent background */
        .dark .sticky-column, .dark .sticky-header th, .dark .sticky-col-left {
            background-color: var(--surface-container-lowest) !important;
            color: var(--on-surface) !important; /* Keep text dark for contrast on white bg */
        }
        
        [x-cloak] { display: none !important; }
        
        /* Remove specific hover highlight */
        tr:hover td.sticky-column, tr:hover td.sticky-col-left {
            background-color: var(--surface-container-lowest) !important;
        }

        .sticky-month-row td {
            position: sticky;
            top: 41px; /* Height of the thead */
            z-index: 25;
            background-color: var(--surface-container);
            border-top: 1px solid rgba(0,0,0,0.05);
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }

        /* Shadow only for service cells, not headers */
        td.sticky-column::before {
            content: '';
            position: absolute;
            top: 0;
            bottom: 0;
            left: -8px;
            width: 8px;
            background: linear-gradient(to right, transparent, rgba(0,0,0,0.05));
            pointer-events: none;
        }
        
        td.sticky-col-left::after {
            content: '';
            position: absolute;
            top: 0;
            bottom: 0;
            right: -8px;
            width: 8px;
            background: linear-gradient(to left, transparent, rgba(0,0,0,0.05));
            pointer-events: none;
        }

        .dark td.sticky-column::before {
            background: linear-gradient(to right, transparent, rgba(0,0,0,0.2));
        }
        
        .dark td.sticky-col-left::after {
            background: linear-gradient(to left, transparent, rgba(0,0,0,0.2));
        }

        /* Ensure parent row background applies to sticky column */
        tr:hover .sticky-column, tr:hover .sticky-col-left {
            background-color: inherit;
        }

        /* ── Planning view (MS-245) ──────────────────────────────────────────
           The liturgy columns are always in the markup and hidden by default,
           so turning the Planning view on is a class rather than a re-render.
           A re-render would take away the box somebody was mid-way through
           typing into. */
        .planning-col { display: none; }
        .planning-mode .planning-col { display: table-cell; }

        /* The Directory folds back to a rail so the table gets the page. */
        .planning-rail {
            width: 3.5rem !important;
            min-width: 3.5rem;
        }
        .planning-rail .rail-hidden { display: none; }

        /* Wide work wants the whole screen, not the reading column. */
        .planning-wide { max-width: none !important; }
    </style>
    <!-- Firebase SDKs -->
    <script src="vendor/firebase/firebase-app-compat.js"></script>
    <script src="vendor/firebase/firebase-auth-compat.js"></script>
    <script src="vendor/firebase/firebase-firestore-compat.js"></script>
    <script src="vendor/firebase/firebase-functions-compat.js"></script>

    <!-- Alpine.js -->
    <script defer src="vendor/alpine-3.15.12.min.js"></script>

    <!-- External Libraries -->
    <script src="vendor/mammoth-1.6.0.browser.min.js"></script>
    <script src="vendor/fuse-6.6.2.js"></script>

    <!-- On-device cache for the phone app (no-op on the web). Must load before
         auth.js, which builds the Firestore handle persistence attaches to. -->
    <script src="local-cache.js"></script>
    <script src="auth.js"></script>
    <script src="docx-importer.js"></script>
    <script src="bible-data.js"></script>
    <script src="verse-picker.js"></script>
    <script src="hymn-registry.js"></script>
    <link href="verse-picker.css" rel="stylesheet" />
</head>

<body
    class="bg-background text-on-background font-body-md text-body-md antialiased min-h-screen md:h-screen md:overflow-hidden overflow-x-hidden flex flex-col selection:bg-primary-fixed selection:text-on-primary-fixed"
    x-data="calendarPage()"
    x-init="init()"
    x-effect="document.body.style.overflow = showDirectory ? 'hidden' : ''"
    @close-directory.window="showDirectory = false"
    @prompt-add-person.window="promptAddPerson($event.detail.name, $event.detail.callback)">

    <!-- Person Selector Modal -->
    <div x-show="showPersonSelector" 
         class="fixed inset-0 z-[80] flex items-center justify-center p-4 bg-primary/20 backdrop-blur-sm"
         x-transition x-cloak>
        <div class="bg-surface-container-lowest border border-outline-variant rounded-2xl shadow-2xl max-w-sm w-full p-6"
             @click.away="showPersonSelector = false">
            
            <div class="flex items-center gap-3 mb-6 text-primary">
                <span class="material-symbols-outlined text-2xl">person_search</span>
                <h2 id="person-selector-title" class="font-headline-md text-lg" x-text="'Select ' + selectorRoleName"></h2>
            </div>

            <div x-data="personPicker(selectedPersonRef, $data, 'activeSuggestionsKey')" 
                 @click.away="open = false"
                 class="relative mb-8">
                <div class="flex items-center bg-surface-container-low rounded-lg border border-outline-variant px-3 py-2">
                    <input type="text" id="person-selector-input" name="person-selector-search" aria-labelledby="person-selector-title" placeholder="Search people..." x-model="query" @focus="onFocus($el)" @click="onFocus($el)" @mousedown.stop @input.debounce="onInput($el)" class="bg-transparent border-none p-0 w-full focus:ring-0 text-sm">
                    <div class="flex items-center gap-1">
                        <button x-show="query" @click="clear()" class="text-secondary hover:text-primary transition-colors cursor-pointer">
                            <span class="material-symbols-outlined text-[18px]">close</span>
                        </button>
                        <span class="material-symbols-outlined text-[18px] text-secondary">person</span>
                    </div>
                </div>
                <div x-show="open && (suggestions.length > 0 || results.length > 0 || query.length >= 2)" class="absolute z-[90] w-full mt-1 bg-white border border-outline-variant rounded-xl shadow-2xl max-h-60 overflow-y-auto left-0 custom-scrollbar">
                    <!-- Suggestions -->
                    <template x-if="suggestions.length > 0 && (query.length < 2 || query === selectedPersonRef.name)">
                        <div>
                            <div class="px-4 py-2 bg-surface-container-low text-[10px] font-bold text-primary uppercase tracking-wider border-b border-outline-variant/30">Suggestions (Longest Wait)</div>
                            <template x-for="p in suggestions" :key="p.id">
                                <button @click="select(p)" class="w-full text-left px-4 py-2 hover:bg-primary-fixed/30 flex flex-col transition-colors border-b last:border-0">
                                    <span class="font-label-md text-sm text-primary" x-text="p.name"></span>
                                    <span class="text-[9px] text-on-surface-variant font-medium uppercase" x-text="PastoralPrayerCore.lastPrayedLabel(p.lastPastoralPrayerDate)"></span>
                                </button>
                            </template>
                        </div>
                    </template>

                    <!-- Search Results -->
                    <template x-for="p in results" :key="p.id">
                        <button @click="select(p)" 
                                :class="p.isNew ? 'bg-primary-fixed/30 hover:bg-primary-fixed' : 'hover:bg-primary-fixed'"
                                class="w-full text-left px-4 py-2 transition-colors border-b last:border-0 flex flex-col">
                            <div class="flex items-center justify-between">
                                <p class="font-label-md text-sm" :class="p.isNew ? 'text-primary' : 'text-on-surface'" x-text="p.isNew ? '+ Add &quot;' + p.name + '&quot; as new person' : p.name"></p>
                                <span x-show="p.isNew" class="material-symbols-outlined text-[16px] text-primary">person_add</span>
                            </div>
                            <template x-if="!p.isNew">
                                <span class="text-[9px] text-on-surface-variant font-medium uppercase" x-text="PastoralPrayerCore.lastPrayedLabel(p.lastPastoralPrayerDate)"></span>
                            </template>
                        </button>
                    </template>
                </div>
            </div>

            <div class="flex justify-end gap-3">
                <button @click="showPersonSelector = false" 
                        class="px-4 py-2 rounded-full font-label-md text-sm text-secondary hover:bg-surface-container transition-colors">
                    Cancel
                </button>
                <button @click="savePersonSelection()" 
                        :disabled="saving"
                        class="px-6 py-2 rounded-full font-label-md text-sm bg-primary text-on-primary hover:bg-primary-container transition-colors flex items-center gap-2">
                    <span x-show="saving" class="w-4 h-4 border-2 border-on-primary/30 border-t-on-primary rounded-full animate-spin"></span>
                    <span x-text="saving ? 'Saving...' : 'Save Selection'"></span>
                </button>
            </div>
        </div>
    </div>

    <!-- Person Add Modal -->
    <div x-show="showPersonAddModal" 
         class="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-primary/20 backdrop-blur-sm"
         x-transition x-cloak>
        <div class="bg-surface-container-lowest border border-outline-variant rounded-2xl shadow-2xl max-w-md w-full p-6"
             @click.away="showPersonAddModal = false">
            <div class="flex items-center gap-3 mb-4 text-primary">
                <span class="material-symbols-outlined text-2xl">person_add</span>
                <h2 class="font-headline-md text-lg">Add New Person</h2>
            </div>
            <p class="font-body-md text-on-surface-variant mb-6 text-sm">
                You are adding <strong class="text-on-surface" x-text="personToAdd.name"></strong> to the database.
            </p>
            <div x-show="duplicateWarning" class="mb-6 p-4 bg-error-container text-on-error-container rounded-xl flex items-start gap-3">
                <span class="material-symbols-outlined text-[20px] shrink-0">warning</span>
                <div class="text-xs">
                    <p class="font-bold mb-1">Potential Duplicate</p>
                    <p>A person with this exact name already exists. Create anyway?</p>
                </div>
            </div>
            <div class="flex justify-end gap-3">
                <button @click="showPersonAddModal = false" class="px-4 py-2 rounded-full text-sm text-secondary">Cancel</button>
                <button @click="confirmAddPerson()" :disabled="saving" class="px-6 py-2 rounded-full text-sm bg-primary text-on-primary">Confirm & Add</button>
            </div>
        </div>
    </div>

    <!-- Inject Service Modal -->
    <div x-data="injectServiceModal()"
         @open-inject-modal.window="openModal()"
         x-show="show"
         class="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-primary/20 backdrop-blur-sm"
         x-transition x-cloak>
        <div class="bg-surface-container-lowest border border-outline-variant rounded-2xl shadow-2xl max-w-md w-full p-6"
             @click.away="close()">

            <div class="flex items-center gap-3 mb-4 text-primary">
                <span class="material-symbols-outlined text-2xl">playlist_add</span>
                <h2 class="font-headline-md text-lg">Inject a Service</h2>
            </div>

            <!-- Step: choose -->
            <template x-if="step === 'choose'">
                <div>
                    <p class="font-body-md text-on-surface-variant mb-4 text-sm">
                        Pick the Sunday to open up. That Sunday becomes a fresh blank service, and every
                        service on or after it moves one week later.
                    </p>

                    <label for="inject-date-select" class="block text-xs font-label-md uppercase tracking-wider text-on-surface-variant mb-1">Inject on</label>
                    <select id="inject-date-select" name="inject-date" x-model="selectedDate" @change="updateCount()"
                            class="w-full bg-surface-container border border-outline-variant rounded-xl px-3 py-2 font-body-md text-sm text-on-surface focus:outline-none focus:ring-1 focus:ring-primary mb-4">
                        <template x-for="s in sundays" :key="s.value">
                            <option :value="s.value" x-text="s.label"></option>
                        </template>
                    </select>

                    <div class="p-4 rounded-xl bg-surface-container text-sm text-on-surface-variant flex items-start gap-3 mb-6">
                        <span class="material-symbols-outlined text-[20px] shrink-0 text-secondary">move_down</span>
                        <p x-show="shiftCount > 0">
                            <strong class="text-on-surface" x-text="shiftCount"></strong>
                            existing service<span x-show="shiftCount !== 1">s</span> (this Sunday and later) will shift down one week.
                            Linked roles and pastoral-prayer records move with them.
                        </p>
                        <p x-show="shiftCount === 0">
                            No existing services on or after this Sunday — nothing to shift. A blank service slot opens here.
                        </p>
                    </div>

                    <div class="flex justify-end gap-3">
                        <button @click="close()" class="px-4 py-2 rounded-full font-label-md text-sm text-secondary hover:bg-surface-container transition-colors">Cancel</button>
                        <button @click="confirm()" :disabled="!selectedDate"
                                class="px-6 py-2 rounded-full font-label-md text-sm bg-primary text-on-primary hover:bg-primary-container transition-colors disabled:opacity-40">
                            Inject &amp; Shift
                        </button>
                    </div>
                </div>
            </template>

            <!-- Step: working -->
            <template x-if="step === 'working'">
                <div class="py-6 flex flex-col items-center text-center gap-3">
                    <span class="w-8 h-8 border-2 border-primary/30 border-t-primary rounded-full animate-spin"></span>
                    <p class="font-body-md text-on-surface-variant text-sm">Shifting services… please don't close this window.</p>
                </div>
            </template>

            <!-- Step: done -->
            <template x-if="step === 'done'">
                <div>
                    <div class="mb-6 p-4 bg-primary-fixed/30 text-on-surface rounded-xl flex items-start gap-3">
                        <span class="material-symbols-outlined text-[20px] shrink-0 text-primary">check_circle</span>
                        <div class="text-sm">
                            <p class="font-bold mb-1 text-on-surface">Done.</p>
                            <p x-show="result && result.services > 0">
                                Shifted <strong x-text="result.services"></strong> service<span x-show="result.services !== 1">s</span> down a week<span
                                    x-show="result && (result.involvements > 0 || result.prayers > 0)">, along with
                                    <strong x-text="result.involvements"></strong> role assignment<span x-show="result.involvements !== 1">s</span>
                                    and <strong x-text="result.prayers"></strong> pastoral-prayer record<span x-show="result.prayers !== 1">s</span></span>.
                                A blank service is ready on the chosen Sunday.
                            </p>
                            <!-- Event occurrences moved too (MS-152). Reported
                                 separately so it is visible that the rosters
                                 came with them, rather than being assumed. -->
                            <p x-show="result && result.occurrences > 0">
                                Also moved <strong x-text="result.occurrences"></strong> other event<span x-show="result.occurrences !== 1">s</span>
                                <span x-show="result.assignments > 0">, with <strong x-text="result.assignments"></strong> assignment<span x-show="result.assignments !== 1">s</span> intact</span>.
                            </p>
                            <p x-show="result && result.services === 0">A blank service slot is ready on the chosen Sunday.</p>
                        </div>
                    </div>
                    <div class="flex justify-end">
                        <button @click="finish()" class="px-6 py-2 rounded-full font-label-md text-sm bg-primary text-on-primary hover:bg-primary-container transition-colors">Refresh Calendar</button>
                    </div>
                </div>
            </template>

            <!-- Step: error -->
            <template x-if="step === 'error'">
                <div>
                    <div class="mb-6 p-4 bg-error-container text-on-error-container rounded-xl flex items-start gap-3">
                        <span class="material-symbols-outlined text-[20px] shrink-0">error</span>
                        <div class="text-sm">
                            <p class="font-bold mb-1">Injection failed</p>
                            <p x-text="errorMsg"></p>
                            <p class="mt-1 opacity-80">Some changes may have been applied — refresh and check the calendar before retrying.</p>
                        </div>
                    </div>
                    <div class="flex justify-end gap-3">
                        <button @click="show = false" class="px-4 py-2 rounded-full font-label-md text-sm text-secondary hover:bg-surface-container transition-colors">Close</button>
                        <button @click="finish()" class="px-6 py-2 rounded-full font-label-md text-sm bg-primary text-on-primary hover:bg-primary-container transition-colors">Refresh</button>
                    </div>
                </div>
            </template>

        </div>
    </div>

    <!-- Hidden File Input -->
    <input type="file" id="docx-file-input" accept=".docx" multiple class="hidden" />

    <header class="m-header m-header--sticky">
        <div class="m-header__inner">
            <div class="m-header__lead">
                <a id="shell-home-link" href="index.html" class="m-back">
                    <span class="material-symbols-outlined">chevron_left</span>
                    <span class="m-back__label">Home</span>
                </a>
                <div class="m-header__titles">
                    <h1 class="m-header__title">Services</h1>
                </div>
            </div>

            <div class="m-header__actions">
                <!-- Import Docx. Shown by script for the ranks that may use it. -->
                <button id="import-docx-btn" class="hidden m-btn m-btn--secondary m-btn--sm" title="Import from docx">
                    <span class="material-symbols-outlined">upload_file</span>
                    <span class="m-btn__label">Import</span>
                </button>

                <!-- Inject Service — opens up a chosen Sunday and shifts later services down -->
                <button id="inject-service-btn" onclick="window.openInjectModal()" class="hidden m-btn m-btn--secondary m-btn--sm" title="Insert a service on a Sunday and shift later services down a week">
                    <span class="material-symbols-outlined">playlist_add</span>
                    <span class="m-btn__label">Inject</span>
                </button>

            <!-- Persistent Controls -->
            <div class="hidden lg:flex items-center gap-lg">
                <!-- History Toggle -->
                <label class="flex items-center gap-3 cursor-pointer group" for="show-historic-checkbox">
                    <span class="font-label-md text-xs uppercase tracking-wider text-on-surface-variant group-hover:text-primary transition-colors">Show Historic</span>
                    <div class="relative inline-flex items-center">
                        <input type="checkbox" id="show-historic-checkbox" name="show-historic" x-model="showHistory" class="sr-only peer">
                        <div class="w-11 h-6 bg-surface-container border border-outline-variant rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-primary transition-colors"></div>
                    </div>
                </label>

                <div class="h-6 w-[1px] bg-surface-variant/50"></div>

                <!-- View Toggle -->
                <div class="inline-flex bg-surface-container/50 rounded-lg p-1 border border-outline-variant">
                    <button 
                        @click="view = 'list'"
                        :class="view === 'list' ? 'bg-primary text-on-primary shadow-sm' : 'text-on-surface-variant hover:text-primary'"
                        class="flex items-center gap-2 px-4 py-1.5 rounded-md font-label-md text-sm transition-all duration-200">
                        <span class="material-symbols-outlined text-[20px]">view_list</span>
                        List
                    </button>
                    <button 
                        @click="view = 'table'"
                        :class="view === 'table' ? 'bg-primary text-on-primary shadow-sm' : 'text-on-surface-variant hover:text-primary'"
                        class="flex items-center gap-2 px-4 py-1.5 rounded-md font-label-md text-sm transition-all duration-200">
                        <span class="material-symbols-outlined text-[20px]">table_chart</span>
                        Table
                    </button>
                </div>
            </div>
            </div>

            <div class="m-header__rule"></div>
            <!-- Auth UI is injected here by auth.js -->
            <div class="m-header__auth" id="auth-container"></div>
        </div>
    </header>

    <main :class="planning && view === 'table' ? 'planning-wide px-sm' : 'max-w-[1600px] px-margin'"
          class="flex-grow flex flex-col md:flex-row gap-margin pb-md pt-base overflow-hidden w-full mx-auto transition-all duration-300">
        <!-- Sidebar Navigation. In the Planning view it folds back to a rail
             against the left edge so the table gets the width. -->
        <aside :class="planning && view === 'table' ? 'planning-rail' : 'md:w-80'"
               class="hidden md:flex flex-shrink-0 flex-col md:overflow-hidden transition-all duration-300">
            <div class="flex-grow bg-surface-container-lowest border border-outline-variant rounded-xl p-md flex flex-col overflow-hidden"
                 :class="planning && view === 'table' ? 'px-1 items-center' : ''">
                <h2 class="font-headline-md text-primary mb-sm flex items-center justify-between flex-shrink-0"
                    :class="planning && view === 'table' ? 'w-full justify-center' : ''">
                    <div class="flex items-center gap-2">
                        <span class="material-symbols-outlined">explore</span>
                        <span :class="planning && view === 'table' ? 'rail-hidden' : ''">Directory</span>
                    </div>
                    <button onclick="window.jumpToUpcoming()"
                            :class="planning && view === 'table' ? 'rail-hidden' : ''"
                            class="p-1 text-secondary hover:text-primary rounded-full hover:bg-surface-container transition-colors" title="Jump to upcoming service">
                        <span class="material-symbols-outlined text-[20px]">event_repeat</span>
                    </button>
                </h2>
                <nav id="sidebar-nav" class="flex-grow space-y-xs overflow-y-auto pr-2 custom-scrollbar"
                     :class="planning && view === 'table' ? 'rail-hidden' : ''">
                    <!-- Nav links will be injected here -->
                </nav>
                <!-- The rail keeps one way back, so the Directory is never
                     lost behind a view somebody forgot they turned on. -->
                <button x-show="planning && view === 'table'" x-cloak
                        @click="planning = false"
                        class="p-2 text-secondary hover:text-primary rounded-full hover:bg-surface-container transition-colors"
                        title="Leave the Planning view">
                    <span class="material-symbols-outlined">chevron_right</span>
                </button>
            </div>
        </aside>

        <!-- Calendar Container -->
        <div class="flex-grow min-w-0 flex flex-col overflow-hidden pr-14 md:pr-0">
            <!-- Mobile/Small Controls (Hidden in layout) -->
            <div class="lg:hidden mb-md flex flex-wrap items-center justify-between gap-md p-md bg-surface-container-lowest border border-outline-variant rounded-xl shadow-sm flex-shrink-0">
                <!-- History Toggle -->
                <label class="flex items-center gap-3 cursor-pointer group" for="show-historic-mobile-checkbox">
                    <span class="font-label-md text-xs uppercase tracking-wider text-on-surface-variant group-hover:text-primary transition-colors">Show History</span>
                    <div class="relative inline-flex items-center">
                        <input type="checkbox" id="show-historic-mobile-checkbox" name="show-historic-mobile" x-model="showHistory" class="sr-only peer">
                        <div class="w-11 h-6 bg-surface-container border border-outline-variant rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-primary transition-colors"></div>
                    </div>
                </label>

                <!-- View Toggle -->
                <div class="inline-flex bg-surface-container rounded-lg p-1 border border-outline-variant">
                    <button 
                        @click="view = 'list'"
                        :class="view === 'list' ? 'bg-primary text-on-primary shadow-sm' : 'text-on-surface-variant hover:text-primary'"
                        class="flex items-center gap-2 px-3 py-1 rounded-md font-label-md text-xs transition-all duration-200">
                        <span class="material-symbols-outlined text-[18px]">view_list</span>
                        List
                    </button>
                    <button 
                        @click="view = 'table'"
                        :class="view === 'table' ? 'bg-primary text-on-primary shadow-sm' : 'text-on-surface-variant hover:text-primary'"
                        class="flex items-center gap-2 px-3 py-1 rounded-md font-label-md text-xs transition-all duration-200">
                        <span class="material-symbols-outlined text-[18px]">table_chart</span>
                        Table
                    </button>
                </div>
            </div>

            <div id="calendar-container" class="flex-grow overflow-hidden flex flex-col">
                <div x-show="view === 'list'" x-cloak id="list-view" class="flex-grow overflow-y-auto space-y-lg custom-scrollbar pr-2">
                    <!-- List items will be injected here -->
                    <div id="calendar-list-loading" class="flex justify-center items-center py-xl">
                        <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-primary"></div>
                    </div>
                </div>

                <div x-show="view === 'table'" x-cloak id="table-view"
                     :class="planning ? 'planning-mode' : ''"
                     class="flex-grow overflow-hidden flex flex-col">
                    <div id="calendar-table-container" class="flex-grow overflow-hidden flex flex-col">
                        <!-- Table will be injected here -->
                    </div>
                </div>
            </div>
        </div>

        <!-- The way into the Planning view: the table opened out to every
             liturgy slot, for writing many Sundays in one sitting. Only
             offered on the table, which is the only view it changes. -->
        <button x-show="view === 'table'" x-cloak
                @click="planning = !planning"
                :title="planning ? 'Back to the ordinary table' : 'Open every liturgy column'"
                :class="planning ? 'bg-primary text-on-primary' : 'bg-surface-container-lowest text-primary'"
                class="fixed bottom-6 right-6 z-40 flex items-center gap-2 pl-4 pr-5 py-3 rounded-full border border-outline-variant shadow-lg hover:shadow-xl transition-all font-label-md text-sm">
            <span class="material-symbols-outlined text-[20px]" x-text="planning ? 'close_fullscreen' : 'open_in_full'"></span>
            <span x-text="planning ? 'Close Planning view' : 'Planning view'"></span>
        </button>
    </main>

    <!-- Mobile Directory Modal -->
    <div x-show="showDirectory" 
         x-transition:enter="transition ease-out duration-300"
         x-transition:enter-start="opacity-0 translate-y-full"
         x-transition:enter-end="opacity-100 translate-y-0"
         x-transition:leave="transition ease-in duration-200"
         x-transition:leave-start="opacity-100 translate-y-0"
         x-transition:leave-end="opacity-0 translate-y-full"
         class="fixed inset-0 z-[100] bg-background flex flex-col md:hidden"
         style="display: none;">
        <!-- Modal Header -->
        <div class="flex-shrink-0 px-margin py-md border-b border-surface-variant flex justify-between items-center">
            <div class="flex items-center gap-2 text-primary">
                <span class="material-symbols-outlined">explore</span>
                <h2 class="font-headline-md text-sm uppercase tracking-wider">Directory</h2>
            </div>
            <button @click="showDirectory = false" class="p-2 -mr-2 text-on-surface-variant hover:text-primary">
                <span class="material-symbols-outlined">close</span>
            </button>
        </div>
        
        <!-- Modal Content (Scrollable Nav) -->
        <div class="flex-grow overflow-y-auto p-margin custom-scrollbar">
            <div class="flex items-center justify-between mb-4">
                <span class="text-xs text-on-surface-variant font-label-md uppercase tracking-widest">Available Services</span>
                <button onclick="window.jumpToUpcoming(); document.dispatchEvent(new CustomEvent('close-directory'))" 
                        class="text-xs text-primary font-label-md uppercase tracking-widest flex items-center gap-1">
                    <span class="material-symbols-outlined text-sm">event_repeat</span>
                    Jump to Upcoming
                </button>
            </div>
            <nav id="mobile-sidebar-nav" class="space-y-xs" @click="showDirectory = false">
                <!-- Nav links will be injected here by service-calendar.js -->
            </nav>
        </div>
        
        <!-- Modal Footer -->
        <div class="flex-shrink-0 p-margin border-t border-surface-variant bg-surface-container-low">
            <button @click="showDirectory = false" class="w-full bg-primary text-on-primary font-label-md py-4 rounded-xl shadow-lg hover:bg-primary-container transition-all active:scale-[0.98]">
                Return to Calendar
            </button>
        </div>
    </div>

    <!-- Mobile Floating Navigation -->
    <div class="md:hidden fixed bottom-6 right-6 flex flex-col gap-3 z-40">
        <!-- Scroll to Top -->
        <button @click="window.scrollTo({ top: 0, behavior: 'smooth' })" 
                class="w-12 h-12 bg-surface-container-highest text-primary border border-outline-variant rounded-xl shadow-lg flex items-center justify-center active:scale-95 transition-all">
            <span class="material-symbols-outlined">north</span>
        </button>
        <!-- Open Directory -->
        <button @click="showDirectory = true" 
                class="w-12 h-12 bg-primary text-on-primary rounded-xl shadow-lg flex items-center justify-center active:scale-95 transition-all">
            <span class="material-symbols-outlined">explore</span>
        </button>
        <!-- Jump to Upcoming -->
        <button onclick="window.jumpToUpcoming()" 
                class="w-12 h-12 bg-secondary text-on-secondary rounded-xl shadow-lg flex items-center justify-center active:scale-95 transition-all">
            <span class="material-symbols-outlined text-[20px]">event_repeat</span>
        </button>
    </div>

    <script src="date-utils.js"></script>
    <script src="pastoral-prayer-core.js"></script>
    <script src="prayer-suggestions.js"></script>
    <!-- Guide engine + store: lets navigateToGuide compute v2 completeness from
         the frozen snapshot (ADR-0008) instead of a hardcoded field list. -->
    <script src="guide-engine.js"></script>
    <!-- guide-store.js reads guide-seed at load time, and guide-seed reads
         guide-components. Same order service-builder.html already uses. -->
    <script src="guide-components.js"></script>
    <script src="guide-seed.js"></script>
    <script src="guide-store.js"></script>
    <script src="events-core.js"></script>
    <!-- The week-shift tool moves Event occurrences and their rosters too
         (MS-152); without these it would silently lose the week's roster. -->
    <script src="events-occurrence-core.js"></script>
    <script src="events-store.js"></script>
    <script src="service-calendar.js"></script>
</body>

</html>
