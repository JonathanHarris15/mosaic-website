<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Your Commitments — Mosaic</title>

    <link rel="stylesheet" href="mosaic.css" />
    <link rel="stylesheet" href="fonts.css" />
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0,0" />

    <style>
        [x-cloak] { display: none !important; }
        .press { transition: all 180ms cubic-bezier(0.2, 0, 0, 1); }
        .press:active { transform: scale(0.98); }

        /* The switch is a real control and has to show it has focus. The same
           steel-teal ring the rest of the app uses. */
        .cal-focus:focus-visible { outline: none; box-shadow: 0 0 0 3px rgba(93,148,169,.18); }

        /* Asked for less movement, given none. */
        @media (prefers-reduced-motion: reduce) {
            .press, .cal-focus, [class*="transition-"] { transition: none !important; }
        }
    </style>

    <script src="vendor/firebase/firebase-app-compat.js"></script>
    <script src="vendor/firebase/firebase-auth-compat.js"></script>
    <script src="vendor/firebase/firebase-firestore-compat.js"></script>
    <script src="vendor/firebase/firebase-functions-compat.js"></script>

    <script src="local-cache.js"></script>
    <script src="auth.js"></script>
    <script src="date-utils.js"></script>
    <script src="roles-core.js"></script>
    <script src="events-core.js"></script>
    <script src="events-occurrence-core.js"></script>
    <script src="events-store.js"></script>
    <script src="commitments-core.js"></script>
    <script src="person-photo-core.js"></script>
    <script src="trade-core.js"></script>
    <script src="trades-store.js"></script>
    <script src="trades-view.js"></script>
    <script src="commitments.js"></script>
    <script defer src="vendor/alpine-3.15.12.min.js"></script>
</head>

<body class="bg-background text-on-surface font-body-md antialiased"
      x-data="commitmentsPage()" x-cloak>

<main class="max-w-[760px] mx-auto px-4 sm:px-md pb-16">

    <a href="calendar.html"
       class="inline-flex items-center gap-1 mt-md text-on-surface-variant text-[11px] uppercase tracking-[.1em] hover:text-secondary">
        <span class="material-symbols-outlined text-[18px]">arrow_back</span> Calendar
    </a>

    <!-- ── The head ──────────────────────────────────────────────────────── -->
    <div class="mt-3 pb-[18px] border-b border-outline-variant">
        <h1 class="font-headline-lg text-[26px] sm:text-[30px] tracking-[.02em] text-primary m-0">Your Commitments</h1>
        <!-- The sentence counts what still wants YOU. It is the whole reason
             the unanswered are hoisted below rather than left in date order. -->
        <p x-show="headline"
           class="mt-2 font-serif text-[18px] leading-[1.45] text-on-surface"
           x-text="headline"></p>
    </div>

    <!-- ── Not signed in ─────────────────────────────────────────────────── -->
    <template x-if="!loading && !personId">
        <div class="py-16 text-center">
            <span class="material-symbols-outlined text-[42px] text-sand">account_circle</span>
            <p class="mt-4 font-serif text-[17px] text-on-surface-variant max-w-[34ch] mx-auto">
                Sign in and link your directory record to see what you are down for.
            </p>
        </div>
    </template>

    <div x-show="loading" class="py-16 text-center text-on-surface-variant text-[13px]">Loading…</div>

    <div x-show="error" x-text="error"
         class="mt-md rounded-lg border border-error bg-error-container text-on-error-container px-md py-3 text-[14px]"></div>

    <!-- ── Nothing on ────────────────────────────────────────────────────── -->
    <!-- Designed, not a blank list. Empty here is a fact about you, not a
         failure, so it points somewhere useful rather than apologising. -->
    <template x-if="isEmpty && personId">
        <div class="py-[72px] px-2 text-center">
            <span class="material-symbols-outlined text-[42px] text-sand">event_available</span>
            <div class="font-headline-lg text-[20px] tracking-[.02em] text-primary mt-4">Nothing On Your List</div>
            <p class="mt-2.5 mx-auto max-w-[34ch] font-serif text-[17px] leading-[1.5] text-on-surface-variant">
                You are not down for anything on the dates ahead.
            </p>
            <a href="cover.html"
               class="inline-flex items-center gap-1.5 mt-[22px] text-[11px] uppercase tracking-[.14em] text-secondary">
                See what needs covering <span class="material-symbols-outlined text-[16px]">chevron_right</span>
            </a>
        </div>
    </template>

    <!-- ── Wanting an answer ─────────────────────────────────────────────── -->
    <!--
         ⚠ HOISTED OUT OF DATE ORDER, on purpose. These are the only rows on the
         page that need anything from the person reading it, so they come first
         whatever their date. Everything settled drops below.
    -->
    <section x-show="hasUnanswered" class="mt-7">
        <div class="flex flex-col gap-3">
            <template x-for="row in unanswered" :key="row.key">
                <article class="bg-surface-container-lowest border border-outline-variant border-l-[3px] rounded-lg px-4 sm:px-[18px] py-4"
                         style="border-left-color: var(--gold);">

                    <div class="flex items-center gap-3 sm:gap-3.5">
                        <div class="w-[46px] shrink-0 text-center">
                            <div class="text-[9.5px] uppercase tracking-[.12em] text-on-surface-variant" x-text="row.mon"></div>
                            <div class="font-headline-lg text-[24px] text-primary leading-[1.1]" x-text="row.dayNum"></div>
                        </div>
                        <div class="min-w-0 flex-grow">
                            <div class="text-[17px] font-semibold text-on-surface leading-[1.3]" x-text="row.roleName"></div>
                            <div class="mt-[3px] text-[13px] text-on-surface-variant">
                                <span x-text="row.eventName"></span> ·
                                <span x-text="row.weekday"></span> <span x-text="row.longDate"></span>
                            </div>
                        </div>
                    </div>

                    <!--
                         ⚠ THE TWO BUTTONS ARE IDENTICAL AND MUST STAY THAT WAY.
                         Same border, same size, same weight, equal width, and
                         neither one filled. Making Confirm the prettier of the
                         two would collect agreements people cannot keep — and a
                         yes somebody cannot keep costs the rota more than a no
                         given in August.
                    -->
                    <div class="mt-4 flex gap-2.5">
                        <button type="button" class="press flex-1 min-h-[44px] flex items-center justify-center gap-[7px]
                                       border border-primary rounded-lg bg-surface-container-lowest text-primary
                                       text-[11.5px] uppercase tracking-[.12em] disabled:opacity-50"
                                :disabled="busy === row.key" @click="confirm(row)">
                            <span class="material-symbols-outlined text-[18px]">check</span> Confirm
                        </button>
                        <button type="button" class="press flex-1 min-h-[44px] flex items-center justify-center gap-[7px]
                                       border border-primary rounded-lg bg-surface-container-lowest text-primary
                                       text-[11.5px] uppercase tracking-[.12em] disabled:opacity-50"
                                :disabled="busy === row.key" @click="decline(row)">
                            <span class="material-symbols-outlined text-[18px]">close</span> Decline
                        </button>
                    </div>
                </article>
            </template>
        </div>
    </section>

    <!-- ── Settled ───────────────────────────────────────────────────────── -->
    <!-- Quieter, denser, one container. These are answered; they are here to be
         glanced at, not worked through. -->
    <section x-show="hasSettled" class="mt-[34px]">
        <div class="h-px bg-outline-variant mb-3.5"></div>
        <!-- ⚠ ONE CARD PER COMMITMENT. These used to be rows in a single block,
             and the controls under a declined one read as belonging to the list
             rather than to the date above them. A card draws the boundary the
             eye needs: everything inside it is about that Event and nothing
             else. -->
        <div class="flex flex-col gap-2.5">
            <template x-for="row in settled" :key="row.key">
                <div class="bg-surface-container-lowest border border-outline-variant rounded-lg overflow-hidden">
                    <!-- ⚠ ON A PHONE THE CHIP AND CHANGE DROP UNDER THE NAME.
                         Held on one line they squeeze the Role's name into a
                         column of single words — "Setup / & / Tear" — and the
                         chip lands on top of it. The date, the name and the
                         answer are three things; on a narrow screen they get
                         three lines. From `sm` up nothing moves. -->
                    <div class="flex items-start sm:items-center gap-3 sm:gap-3.5 px-4 sm:px-md py-3.5"
                         :class="row.isLiturgical ? 'bg-surface-container-low' : ''">

                        <div class="w-[42px] sm:w-[46px] shrink-0 text-center">
                            <div class="text-[9px] uppercase tracking-[.12em] text-on-surface-variant" x-text="row.mon"></div>
                            <div class="font-headline-lg text-[18px] text-on-surface" x-text="row.dayNum"></div>
                        </div>

                        <div class="min-w-0 flex-grow flex flex-col sm:flex-row sm:items-center gap-2 sm:gap-3.5">
                            <div class="min-w-0 sm:flex-grow">
                                <!--
                                     ⚠ A LITURGICAL ROLE READS AS SETTLED THROUGH TYPE
                                     ALONE — serif italic, no controls, a quieter ground.
                                     It was decided this page carries NO copy explaining
                                     why; being on the printed booklet IS the commitment
                                     (ADR-0019), and a sentence saying so would make the
                                     one row nobody can act on the loudest on the page.
                                -->
                                <div class="text-on-surface leading-[1.3]"
                                     :class="row.isLiturgical
                                        ? 'font-serif italic text-[18px]'
                                        : 'text-[15.5px]'"
                                     x-text="row.roleName"></div>
                                <div class="mt-0.5 text-[12.5px] text-on-surface-variant" x-text="row.eventName"></div>
                            </div>

                            <div class="shrink-0 flex items-center gap-3">
                                <span class="inline-flex items-center px-[9px] py-1 rounded-md text-[10.5px] uppercase tracking-[.1em] whitespace-nowrap"
                                      :class="row.chipClass" x-text="row.chipLabel"></span>
                                <button x-show="!row.isLiturgical" type="button" @click="change(row)"
                                        class="press py-1 text-[10.5px] uppercase tracking-[.1em] text-secondary whitespace-nowrap">Change</button>
                            </div>
                        </div>
                    </div>
                    <div x-show="row.isDeclined" class="px-4 sm:px-[18px] py-3.5 border-t border-outline-variant bg-surface-container-low/40">
                        <!-- ⚠ ON A PHONE THE CONTROLS STACK. Side by side they
                             push "Closed invite" off the right edge, so the one
                             word telling you the state of the place is the word
                             you cannot read. -->
                        <div class="flex flex-col sm:flex-row sm:flex-wrap sm:items-center gap-3 sm:gap-x-3 sm:gap-y-2">
                            <!-- No date and no Role name here: the row directly
                                 above says both. They were only ever needed
                                 because this strip used to sit detached at the
                                 foot of the list, where it had to name what it
                                 was talking about. -->
                            <div x-show="swapsOn(row).length" class="flex flex-wrap gap-2">
                                <template x-for="swap in swapsOn(row)" :key="swap.key">
                                    <span class="text-[11.5px] px-2 py-[3px] rounded-md border border-outline-variant
                                                 text-on-surface-variant" x-text="swap.headline"></span>
                                </template>
                            </div>

                            <span class="hidden sm:block sm:flex-grow"></span>

                            <button type="button" :disabled="busy || invitesLeft(row) <= 0"
                                    @click="openAsk(row)"
                                    class="press w-full sm:w-auto min-h-[44px] sm:min-h-[38px] px-3.5 rounded-lg
                                           border border-outline-variant
                                           text-on-surface text-[11px] uppercase tracking-[.12em] disabled:opacity-40">
                                Ask somebody
                            </button>

                            <!-- The escalation, and the retreat. Reads as what it
                                 does to the reach of the place, not as a setting. -->
                            <!-- ⚠ A SWITCH, NOT TWO BUTTONS THAT SWAP PLACES.
                                 This is a standing state — "can the church see
                                 this one" — and a button whose label changes on
                                 press makes you read it twice to find out what
                                 you just did. A switch shows the state and the
                                 control in one thing.

                                 It is labelled by what it turns on, not by the
                                 act: "On the open list", never "Put it on the
                                 open list". -->
                            <!-- On a phone it becomes a settings row: the state
                                 named on the left, the switch out at the right
                                 where a thumb is. On `sm` up it goes back to
                                 sitting beside the button. -->
                            <label x-show="coverable[row.occurrenceId] !== false"
                                   class="flex items-center gap-2.5 cursor-pointer select-none
                                          w-full sm:w-auto min-h-[32px] flex-row-reverse justify-between
                                          sm:flex-row sm:justify-start"
                                   :class="busy ? 'opacity-50 pointer-events-none' : ''">
                                <button type="button" role="switch"
                                        :aria-checked="(!row.quiet).toString()"
                                        :disabled="busy"
                                        @click="setReach(row, !row.quiet)"
                                        class="cal-focus relative shrink-0 w-[38px] h-[22px] rounded-full
                                               transition-colors duration-150"
                                        :class="row.quiet ? 'bg-outline-variant' : 'bg-secondary'">
                                    <span class="absolute top-[3px] w-4 h-4 rounded-full bg-surface
                                                 shadow-sm transition-all duration-150"
                                          :class="row.quiet ? 'left-[3px]' : 'left-[19px]'"></span>
                                </button>
                                <!-- The label names the STATE, and both states
                                     get a name. "On the open list" with the
                                     switch off would leave the reader working
                                     out that off means the opposite of the only
                                     words on screen — and the opposite of "on
                                     the open list" is not obvious: it could mean
                                     nobody can help, when in fact the people you
                                     ask still can.

                                     That is a different thing from a BUTTON
                                     whose label changes on press. This one
                                     changes because the state changed, which is
                                     what it is there to report. -->
                                <span class="text-[12px] text-on-surface-variant"
                                      x-text="row.quiet ? 'Closed invite' : 'On the open list'"></span>
                            </label>
                        </div>
                    </div>
                </div>
            </template>

            <!-- ── A place you declined, and what is being done about it ──── -->
            <!--
                 ⚠ THE CONVERSATION LIVES ON THE COMMITMENT, not in a section of
                 its own. "Who have I asked about the 14th" is a question about
                 the 14th, and answering it two screens away from the 14th is how
                 a member's page turns into a control panel.

                 It appears only on the declined ones — which is why it is worth
                 the room: it is never more than one or two rows.
            -->
        </div>

        <!-- Declining is not the end of it: the place stays yours until
             somebody takes it (ADR-0018 §5), and saying so is what stops a
             decline reading as "handled". -->
        <p x-show="settled.some(r => r.isDeclined)"
           class="mt-3 text-[12.5px] leading-[1.55] text-on-surface-variant">
            A place you declined stays yours until somebody else takes it — you will keep
            seeing the Event until then.
        </p>
    </section>


    <!-- ══ Swaps (MS-190, MS-216) ═════════════════════════════════════════ -->
    <!--
         ⚠ WHOSE MOVE IT IS, NOT WHO STARTED IT. Who opened a conversation is a
         fact about the past and tells a reader nothing about what to do now. An
         invitation somebody sent me and an offer somebody made me both need an
         answer today, so they sit together — even though I began neither.

         And it sits BELOW the commitments, not above them. This is still a page
         about what you are down for; the negotiating is what you do when one of
         them does not work.
    -->
    <section x-show="hasSwaps" class="mt-10">
        <h2 class="font-headline-lg text-[20px] tracking-[.02em] text-primary">Swaps</h2>

        <!-- ── Waiting on you ──────────────────────────────────────────── -->
        <template x-if="needsYou.length">
            <div class="mt-3">
                <div class="text-[11px] uppercase tracking-[.14em] text-warning">Waiting on you</div>
                <div class="mt-2 flex flex-col gap-2.5">
                    <template x-for="swap in needsYou" :key="swap.key">
                        <div class="rounded-lg border-l-4 border-l-warning border border-outline-variant
                                    bg-surface-container-lowest p-[18px]">
                            <div class="flex items-center gap-3">
                                <!-- The person asking, not an avatar for its own
                                     sake: this row is one half of a conversation
                                     and knowing whose is most of the answer. -->
                                <span class="shrink-0 w-9 h-9 rounded-full overflow-hidden
                                             bg-surface-container flex items-center justify-center">
                                    <img x-show="personById(swap.otherId) && personById(swap.otherId).photoUrl"
                                         :src="personById(swap.otherId) && personById(swap.otherId).photoUrl"
                                         alt="" loading="lazy" class="w-full h-full"
                                         :style="photoStyle(personById(swap.otherId))" />
                                    <span x-show="!(personById(swap.otherId) && personById(swap.otherId).photoUrl)"
                                          class="font-headline-lg text-[13px] text-on-surface-variant"
                                          x-text="initialsOf(personById(swap.otherId))"></span>
                                </span>
                                <div class="text-[15px] text-on-surface" x-text="swap.headline"></div>
                            </div>
                            <p class="mt-1 font-serif text-[15.5px] leading-[1.45] text-on-surface-variant"
                               x-text="swap.detail"></p>
                            <div class="mt-1 text-[12px] text-on-surface-variant">
                                <span x-text="swap.eventName"></span> ·
                                <span x-text="roleNameFor(swap.roleName)"></span> ·
                                <span x-text="longDateOf(swap.date)"></span>
                            </div>

                            <div class="mt-3.5 flex flex-wrap gap-2">
                                <!-- Replying and refusing are the same weight,
                                     for the same reason Confirm and Decline are:
                                     a screen that makes yes prettier than no
                                     collects agreements people cannot keep. -->
                                <button x-show="swap.can.offer" type="button"
                                        @click="openReply(swap)"
                                        class="press min-h-[44px] px-[18px] rounded-lg border border-outline-variant
                                               text-on-surface text-[11.5px] uppercase tracking-[.12em]">
                                    Answer
                                </button>
                                <button x-show="swap.can.accept" type="button"
                                        @click="openChoose(swap)"
                                        class="press min-h-[44px] px-[18px] rounded-lg border border-outline-variant
                                               text-on-surface text-[11.5px] uppercase tracking-[.12em]">
                                    See what they offered
                                </button>
                                <button x-show="swap.can.refuse" type="button"
                                        :disabled="busy" @click="refuseSwap(swap)"
                                        class="press min-h-[44px] px-[18px] rounded-lg border border-outline-variant
                                               text-on-surface text-[11.5px] uppercase tracking-[.12em]">
                                    No
                                </button>
                            </div>
                        </div>
                    </template>
                </div>
            </div>
        </template>

        <!-- ── What ended without you (MS-212) ─────────────────────────── -->
        <!--
             ⚠ THIS BLOCK IS THE WHOLE POINT OF THE CLEANUP. Sarah offers Bob
             two of her Saturdays; somebody else takes his place first, so her
             offer is killed in the same transaction — correctly. Without this
             it simply VANISHES off her page, and what she learns is that the
             app loses what you put into it. She goes back to texting, and so
             does everybody she tells.

             It asks nothing, so it sits BELOW the things that need an answer —
             but above what she is merely waiting on, because it changes what
             she believes is true.

             Clearing it is a WRITE, not a local dismissal: the other person is
             usually being told the same thing and has their own to clear.
        -->
        <template x-if="noticeRows.length">
            <div class="mt-6">
                <div class="text-[11px] uppercase tracking-[.14em] text-on-surface-variant">What changed</div>
                <div class="mt-2 flex flex-col gap-2">
                    <template x-for="swap in noticeRows" :key="swap.key">
                        <div class="flex flex-col md:flex-row md:items-center gap-2 md:gap-4
                                    rounded-lg border border-outline-variant border-dashed
                                    bg-surface-container-low/40 px-[18px] py-3.5">
                            <div class="flex-grow min-w-0">
                                <div class="text-[14.5px] text-on-surface" x-text="swap.headline"></div>
                                <p class="font-serif text-[14.5px] leading-[1.45] text-on-surface-variant mt-[2px]"
                                   x-text="swap.detail"></p>
                                <div class="text-[12px] text-on-surface-variant mt-[3px]">
                                    <span x-text="swap.eventName"></span> ·
                                    <span x-text="longDateOf(swap.date)"></span>
                                </div>
                            </div>
                            <button type="button" :disabled="busy"
                                    @click="clearNotice(swap)"
                                    class="press shrink-0 self-start md:self-auto min-h-[40px] px-4 rounded-lg border border-outline-variant
                                           text-on-surface-variant text-[11px] uppercase tracking-[.12em]">
                                Got it
                            </button>
                        </div>
                    </template>
                </div>
            </div>
        </template>

        <!-- ── Waiting on them ─────────────────────────────────────────── -->
        <!-- Quiet and dense. Nothing here asks anything of the reader; it is
             here so they know it is still going, and can take it back. -->
        <template x-if="waitingOnThem.length">
            <div class="mt-6">
                <div class="text-[11px] uppercase tracking-[.14em] text-on-surface-variant">Waiting on them</div>
                <div class="mt-2 bg-surface-container-lowest border border-outline-variant rounded-lg overflow-hidden">
                    <template x-for="swap in waitingOnThem" :key="swap.key">
                        <div class="flex flex-col md:flex-row md:items-center gap-2 md:gap-4
                                    px-[18px] py-3.5 border-b border-outline-variant last:border-b-0">
                            <div class="flex-grow min-w-0">
                                <div class="text-[14.5px] text-on-surface" x-text="swap.headline"></div>
                                <div class="text-[12px] text-on-surface-variant mt-[2px]">
                                    <span x-text="roleNameFor(swap.roleName)"></span> ·
                                    <span x-text="longDateOf(swap.date)"></span>
                                </div>
                            </div>
                            <button x-show="swap.can.withdraw" type="button"
                                    :disabled="busy" @click="withdrawSwap(swap)"
                                    class="press shrink-0 self-start md:self-auto min-h-[40px] px-4 rounded-lg border border-outline-variant
                                           text-on-surface-variant text-[11px] uppercase tracking-[.12em]">
                                Take it back
                            </button>
                        </div>
                    </template>
                </div>
            </div>
        </template>
    </section>

</main>


<!-- ══ Who shall I ask? (MS-214) ══════════════════════════════════════════ -->
<!--
     ⚠ IT OFFERS EVERYBODY, INCLUDING PEOPLE WITH NO ACCOUNT — with a warning.
     They cannot answer in the app today, but MS-189 will text exactly those
     people, and a picker that hid them would have to be unpicked. Withdraw is
     what makes an unanswerable ask harmless: ask them, chase them yourself,
     take it back.

     ⚠ SOMEBODY A TAG HIDES IS ABSENT, NOT GREYED (ADR-0021 §1). A disabled row
     saying why they cannot help still prints the name the tag exists to hide.
-->
<template x-if="asking">
    <div class="fixed inset-0 z-50 flex items-end md:items-center justify-center md:p-6 bg-primary/40">
        <div class="w-full max-w-[460px] max-h-[86vh] flex flex-col bg-surface-container-lowest
                    border border-outline-variant rounded-t-2xl md:rounded-2xl">
            <div class="p-5 border-b border-outline-variant">
                <div class="font-headline-lg text-[18px] tracking-[.02em] text-primary">Who could take it?</div>
                <p class="mt-1.5 text-[13px] text-on-surface-variant">
                    <span x-text="asking.roleName"></span>, <span x-text="asking.longDate"></span>.
                    You can ask <span x-text="invitesLeft(asking)"></span> more.
                </p>
                <input type="search" x-model="search" placeholder="Search by name"
                       class="mt-3 w-full min-h-[44px] px-3 rounded-lg border border-outline-variant
                              bg-surface text-[15px] text-on-surface" />
            </div>

            <div class="flex-grow overflow-y-auto">
                <template x-for="person in askable" :key="person.id">
                    <button type="button" :disabled="busy || invitesLeft(asking) <= 0"
                            @click="ask(person)"
                            class="w-full text-left px-5 py-3 flex items-center gap-3.5
                                   border-b border-outline-variant last:border-b-0
                                   disabled:opacity-50 hover:bg-surface-container-low">

                        <!-- ⚠ A FACE, NOT A DECORATION. This is a directory of
                             names you half-know, and a face is how somebody
                             actually decides who to ask. It also gives each row
                             something of its own: most of the congregation has
                             no account yet, so that warning is on nearly every
                             line, and a column of identical grey text is
                             unreadable.

                             The crop is the Person's own framing, so a face sits
                             here exactly as it does everywhere else in the app. -->
                        <span class="shrink-0 w-10 h-10 rounded-full overflow-hidden
                                     bg-surface-container flex items-center justify-center">
                            <img x-show="person.photoUrl" :src="person.photoUrl" alt=""
                                 loading="lazy" class="w-full h-full"
                                 :style="photoStyle(person)" />
                            <span x-show="!person.photoUrl"
                                  class="font-headline-lg text-[14px] text-on-surface-variant"
                                  x-text="initialsOf(person)"></span>
                        </span>

                        <span class="min-w-0 flex-grow">
                            <span class="block text-[15px] text-on-surface"
                                  x-text="nameOf(person.id)"></span>
                            <!-- Shortened to a chip now the face carries the
                                 recognising. The full sentence was the whole
                                 row, fifteen times over. -->
                            <span x-show="unreachable(person)"
                                  class="inline-flex items-center mt-[3px] px-[7px] py-[2px] rounded
                                         bg-surface-container text-[10.5px] uppercase tracking-[.1em]
                                         text-on-surface-variant">
                                No account
                            </span>
                        </span>
                    </button>
                </template>
                <p x-show="!askable.length" class="px-5 py-8 text-center text-[13px] text-on-surface-variant">
                    Nobody left to ask here.
                </p>
            </div>

            <div class="p-4 border-t border-outline-variant">
                <button type="button" @click="asking = null"
                        class="press w-full min-h-[44px] rounded-lg border border-outline-variant
                               text-on-surface-variant text-[11.5px] uppercase tracking-[.12em]">Done</button>
            </div>
        </div>
    </div>
</template>

<!-- ══ What shall I put up? ═══════════════════════════════════════════════ -->
<!--
     ⚠ "JUST TAKE IT" IS ITS OWN BUTTON, not an empty selection. It settles there
     and then — no waiting, no acceptance — and hiding an instant, irreversible
     act behind "submit with nothing ticked" is a trap. So it says what it does.
-->
<template x-if="replying">
    <div class="fixed inset-0 z-50 flex items-end md:items-center justify-center md:p-6 bg-primary/40">
        <div class="w-full max-w-[460px] max-h-[86vh] flex flex-col bg-surface-container-lowest
                    border border-outline-variant rounded-t-2xl md:rounded-2xl">
            <div class="p-5 border-b border-outline-variant">
                <div class="font-headline-lg text-[18px] tracking-[.02em] text-primary"
                     x-text="replying.headline"></div>
                <p class="mt-1.5 font-serif text-[15.5px] leading-[1.45] text-on-surface">
                    Pick any of your own dates you would hand over — or just take theirs.
                </p>
            </div>

            <div class="flex-grow overflow-y-auto">
                <template x-for="row in offerable" :key="row.key">
                    <button type="button" @click="togglePick(row)"
                            class="w-full text-left px-5 py-3 flex items-center gap-3
                                   border-b border-outline-variant last:border-b-0">
                        <span class="material-symbols-outlined text-[20px]"
                              :class="picked.includes(row.key) ? 'text-secondary' : 'text-outline'"
                              x-text="picked.includes(row.key) ? 'check_box' : 'check_box_outline_blank'"></span>
                        <span class="min-w-0">
                            <span class="block text-[15px] text-on-surface" x-text="row.roleName"></span>
                            <span class="block text-[12px] text-on-surface-variant"
                                  x-text="row.eventName + ' · ' + row.longDate"></span>
                        </span>
                    </button>
                </template>
                <p x-show="!offerable.length" class="px-5 py-8 text-center text-[13px] text-on-surface-variant">
                    You have nothing else on to offer — but you can still just take it.
                </p>
            </div>

            <div class="p-4 border-t border-outline-variant flex flex-col gap-2">
                <button type="button" :disabled="busy || !picked.length"
                        @click="sendOffer(replying, false)"
                        class="press w-full min-h-[44px] rounded-lg border border-outline-variant
                               text-on-surface text-[11.5px] uppercase tracking-[.12em] disabled:opacity-40">
                    Offer <span x-text="picked.length ? picked.length : ''"></span>
                </button>
                <button type="button" :disabled="busy" @click="sendOffer(replying, true)"
                        class="press w-full min-h-[44px] rounded-lg border border-outline-variant
                               text-on-surface text-[11.5px] uppercase tracking-[.12em]">
                    Just take it
                </button>
                <button type="button" @click="replying = null"
                        class="min-h-[40px] text-on-surface-variant text-[11px] uppercase tracking-[.12em]">
                    Not now
                </button>
            </div>
        </div>
    </div>
</template>

<!-- ══ Which of theirs? ═══════════════════════════════════════════════════ -->
<template x-if="choosing">
    <div class="fixed inset-0 z-50 flex items-end md:items-center justify-center md:p-6 bg-primary/40">
        <div class="w-full max-w-[460px] bg-surface-container-lowest border border-outline-variant
                    rounded-t-2xl md:rounded-2xl">
            <div class="p-5 border-b border-outline-variant">
                <div class="font-headline-lg text-[18px] tracking-[.02em] text-primary"
                     x-text="choosing.headline"></div>
                <p class="mt-1.5 font-serif text-[15.5px] leading-[1.45] text-on-surface">
                    Take one of theirs and they take your <span x-text="choosing.roleName"></span>.
                    Both are confirmed straight away.
                </p>
            </div>
            <div>
                <template x-for="put in choosing.offered" :key="put.occurrenceId + put.roleSlug">
                    <button type="button" :disabled="busy" @click="take(choosing, put)"
                            class="w-full text-left px-5 py-4 border-b border-outline-variant
                                   last:border-b-0 disabled:opacity-50 hover:bg-surface-container-low">
                        <!-- ⚠ THE ROLE'S NAME, NOT ITS SLUG. An offered place
                             carries only ids; rendering one raw puts
                             `setup_teardown` on a member's screen, which this
                             project has already shipped once. -->
                        <div class="text-[15px] text-on-surface"
                             x-text="roleNameFor(put.roleSlug)"></div>
                        <div class="text-[12px] text-on-surface-variant"
                             x-text="longDateOf(put.date)"></div>
                    </button>
                </template>
            </div>
            <div class="p-4 border-t border-outline-variant">
                <button type="button" @click="choosing = null"
                        class="press w-full min-h-[44px] rounded-lg border border-outline-variant
                               text-on-surface-variant text-[11.5px] uppercase tracking-[.12em]">Not now</button>
            </div>
        </div>
    </div>
</template>

<!-- ══ Who should know? (MS-213) ══════════════════════════════════════════ -->
<!--
     ⚠ ASKED AT THE MOMENT OF DECLINING, because that is the only moment anybody
     is thinking about it. Asked later it is a setting nobody visits.

     Neither option is styled as the recommendation. Which one is right depends
     entirely on the Event, and the app does not know.
-->
<template x-if="declining">
    <div class="fixed inset-0 z-50 flex items-center justify-center p-6 bg-primary/40">
        <div class="w-full max-w-[430px] bg-surface-container-lowest border border-outline-variant
                    rounded-2xl p-6">
            <div class="font-headline-lg text-[18px] tracking-[.02em] text-primary">Who should know?</div>
            <p class="mt-2.5 font-serif text-[16px] leading-[1.5] text-on-surface">
                You are giving up <span x-text="declining.roleName"></span> on
                <span x-text="declining.longDate"></span>.
            </p>
            <div class="mt-[22px] flex flex-col gap-2.5">
                <button type="button" @click="declineWith(declining, false)"
                        class="press w-full text-left min-h-[44px] px-4 py-3 rounded-lg
                               border border-outline-variant">
                    <span class="block text-[14.5px] text-on-surface">Put it on the open list</span>
                    <span class="block text-[12px] text-on-surface-variant mt-[2px]">
                        Anybody who could help will see it.
                    </span>
                </button>
                <button type="button" @click="declineWith(declining, true)"
                        class="press w-full text-left min-h-[44px] px-4 py-3 rounded-lg
                               border border-outline-variant">
                    <span class="block text-[14.5px] text-on-surface">Only the people I ask</span>
                    <span class="block text-[12px] text-on-surface-variant mt-[2px]">
                        It stays off the open list. You can put it on later.
                    </span>
                </button>
                <button type="button" @click="declining = null"
                        class="min-h-[40px] text-on-surface-variant text-[11px] uppercase tracking-[.12em]">
                    Cancel
                </button>
            </div>
        </div>
    </div>
</template>

<div x-show="toast" x-transition x-cloak x-text="toast"
     class="fixed left-1/2 -translate-x-1/2 bottom-7 z-50 bg-primary text-on-primary
            px-5 py-3 rounded-lg text-[13px] shadow-lg"></div>

</body>
</html>
