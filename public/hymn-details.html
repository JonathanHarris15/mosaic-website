<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Hymn Details - Mosaic Church</title>
    <link rel="stylesheet" href="mosaic.css" />
    <link rel="stylesheet" href="fonts.css" />



    <style>
        /* Custom scrollbar for a cleaner look */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--surface-variant);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--outline-variant);
        }
    </style>

    <!-- Firebase SDKs -->
    <script src="vendor/firebase/firebase-app-compat.js"></script>
    <script src="vendor/firebase/firebase-auth-compat.js"></script>
    <script src="vendor/firebase/firebase-firestore-compat.js"></script>
    <script src="auth.js"></script>

</head>
<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col">
    <!-- Top Navigation Area -->
    <!-- No __title: the hymn's own name is the head of the page below, where it
         sits with its writers, its metre and its tune. The seal has left the
         header. -->
    <header class="m-header" style="--m-header-max: 56rem">
        <div class="m-header__inner">
            <div class="m-header__lead">
                <a href="hymn-directory.html" class="m-back">
                    <span class="material-symbols-outlined">chevron_left</span>
                    <span class="m-back__label">Hymn Directory</span>
                </a>
            </div>
            <div class="m-header__rule"></div>
            <div class="m-header__auth" id="auth-container"></div>
        </div>
    </header>

    <main class="flex-1 max-w-4xl w-full mx-auto px-gutter py-lg flex flex-col" id="hymn-details-container">
        <!-- Hymn details will be rendered here by hymn-details.js -->
        <div class="flex justify-center items-center h-full">
            <div class="flex flex-col items-center gap-4">
                <span class="material-symbols-outlined text-[48px] text-outline animate-pulse">hourglass_empty</span>
                <p class="text-on-surface-variant font-body-md text-body-md">Loading hymn details...</p>
            </div>
        </div>
    </main>

    <script src="hymn-details.js"></script>
</body>
</html>
