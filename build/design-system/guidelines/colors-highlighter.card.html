<!-- @dsCard group="Colors" viewport="700x300" name="Highlighter" subtitle="Note Module pens — outside the brand on purpose" -->
<!DOCTYPE html><html><head><meta charset="utf-8"/>
<link rel="stylesheet" href="../styles.css"/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"/>
<style>
  body { margin:0; padding:18px; background:var(--background); font-family:var(--font-sans); color:var(--on-surface); }
  .r { display:flex; flex-wrap:wrap; gap:14px; align-items:center; }
  .sw { display:flex; flex-direction:column; width:150px; border-radius:var(--radius); overflow:hidden; border:1px solid var(--outline-variant); }
  .sw .t { padding:16px 12px; font-size:12px; font-weight:600; }
  .sw .b { padding:7px 12px; font-size:10.5px; background:var(--surface-container-lowest); color:var(--on-surface-variant); display:flex; justify-content:space-between; gap:6px; }
  .sw .b code { font-family:ui-monospace,monospace; }
</style></head><body>
<div class="r">
  <div class="sw"><div class="t" style="background:var(--highlight-yellow);color:var(--on-surface)">highlight-yellow</div><div class="b"><code>--highlight-yellow</code><code>#FEF08A</code></div></div>
  <div class="sw"><div class="t" style="background:var(--highlight-green);color:var(--on-surface)">highlight-green</div><div class="b"><code>--highlight-green</code><code>#BBF7D0</code></div></div>
  <div class="sw"><div class="t" style="background:var(--highlight-blue);color:var(--on-surface)">highlight-blue</div><div class="b"><code>--highlight-blue</code><code>#BFDBFE</code></div></div>
  <div class="sw"><div class="t" style="background:var(--highlight-red);color:var(--on-surface)">highlight-red</div><div class="b"><code>--highlight-red</code><code>#FECACA</code></div></div>
  <div class="sw"><div class="t" style="background:var(--highlight-orange);color:var(--on-surface)">highlight-orange</div><div class="b"><code>--highlight-orange</code><code>#FED7AA</code></div></div>
  <div class="sw"><div class="t" style="background:var(--highlight-purple);color:var(--on-surface)">highlight-purple</div><div class="b"><code>--highlight-purple</code><code>#F0ABFC</code></div></div>
</div>
</body></html>
