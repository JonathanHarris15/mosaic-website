<!-- @dsCard group="Colors" viewport="700x300" name="Brand" subtitle="The seal's own colours" -->
<!DOCTYPE html><html><head><meta charset="utf-8"/>
<link rel="stylesheet" href="../styles.css"/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"/>
<style>
  body { margin:0; padding:18px; background:var(--background); font-family:var(--font-sans); color:var(--on-surface); }
  .r { display:flex; flex-wrap:wrap; gap:14px; align-items:center; }
  .sw { display:flex; flex-direction:column; width:150px; border-radius:var(--radius); overflow:hidden; border:1px solid var(--outline-variant); }
  .sw .t { padding:16px 12px; font-size:12px; font-weight:600; }
  .sw .b { padding:7px 12px; font-size:10.5px; background:var(--surface-container-lowest); color:var(--on-surface-variant); display:flex; justify-content:space-between; gap:6px; }
  .sw .b code { font-family:ui-monospace,monospace; }
</style></head><body>
<div class="r">
  <div class="sw"><div class="t" style="background:var(--navy);color:var(--on-primary)">navy</div><div class="b"><code>--navy</code><code>#182F57</code></div></div>
  <div class="sw"><div class="t" style="background:var(--navy-900);color:var(--on-primary)">navy-900</div><div class="b"><code>--navy-900</code><code>#0E1C36</code></div></div>
  <div class="sw"><div class="t" style="background:var(--navy-800);color:var(--on-primary)">navy-800</div><div class="b"><code>--navy-800</code><code>#14264A</code></div></div>
  <div class="sw"><div class="t" style="background:var(--ocean);color:var(--on-primary)">ocean</div><div class="b"><code>--ocean</code><code>#3E6181</code></div></div>
  <div class="sw"><div class="t" style="background:var(--steel);color:var(--on-primary)">steel</div><div class="b"><code>--steel</code><code>#5D94A9</code></div></div>
  <div class="sw"><div class="t" style="background:var(--sand);color:var(--on-surface)">sand</div><div class="b"><code>--sand</code><code>#C2B79D</code></div></div>
  <div class="sw"><div class="t" style="background:var(--gold);color:var(--on-surface)">gold</div><div class="b"><code>--gold</code><code>#B89B6A</code></div></div>
</div>
</body></html>
