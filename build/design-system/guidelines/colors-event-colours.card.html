<!-- @dsCard group="Colors" viewport="700x300" name="Event colours" subtitle="The eight an editor can paint an Event" -->
<!DOCTYPE html><html><head><meta charset="utf-8"/>
<link rel="stylesheet" href="../styles.css"/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"/>
<style>
  body { margin:0; padding:18px; background:var(--background); font-family:var(--font-sans); color:var(--on-surface); }
  .r { display:flex; flex-wrap:wrap; gap:14px; align-items:center; }
  .sw { display:flex; flex-direction:column; width:150px; border-radius:var(--radius); overflow:hidden; border:1px solid var(--outline-variant); }
  .sw .t { padding:16px 12px; font-size:12px; font-weight:600; }
  .sw .b { padding:7px 12px; font-size:10.5px; background:var(--surface-container-lowest); color:var(--on-surface-variant); display:flex; justify-content:space-between; gap:6px; }
  .sw .b code { font-family:ui-monospace,monospace; }
</style></head><body>
<div class="r">
  <div class="sw"><div class="t" style="background:var(--event-steel);color:var(--on-primary)">event-steel</div><div class="b"><code>--event-steel</code><code>#5D94A9</code></div></div>
  <div class="sw"><div class="t" style="background:var(--event-ocean);color:var(--on-primary)">event-ocean</div><div class="b"><code>--event-ocean</code><code>#3E6181</code></div></div>
  <div class="sw"><div class="t" style="background:var(--event-navy);color:var(--on-primary)">event-navy</div><div class="b"><code>--event-navy</code><code>#182F57</code></div></div>
  <div class="sw"><div class="t" style="background:var(--event-green);color:var(--on-primary)">event-green</div><div class="b"><code>--event-green</code><code>#4B8A6B</code></div></div>
  <div class="sw"><div class="t" style="background:var(--event-gold);color:var(--on-surface)">event-gold</div><div class="b"><code>--event-gold</code><code>#B89B6A</code></div></div>
  <div class="sw"><div class="t" style="background:var(--event-amber);color:var(--on-primary)">event-amber</div><div class="b"><code>--event-amber</code><code>#B8862E</code></div></div>
  <div class="sw"><div class="t" style="background:var(--event-plum);color:var(--on-primary)">event-plum</div><div class="b"><code>--event-plum</code><code>#7A5578</code></div></div>
  <div class="sw"><div class="t" style="background:var(--event-rose);color:var(--on-primary)">event-rose</div><div class="b"><code>--event-rose</code><code>#B0697C</code></div></div>
</div>
</body></html>
