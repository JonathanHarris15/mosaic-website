<!-- @dsCard group="Layout" viewport="700x170" name="PickList" subtitle="The list half of a SplitView: rows you choose between, one of them current, each carrying a colour dot and two lines of " -->
<!DOCTYPE html><html><head><meta charset="utf-8"/>
<link rel="stylesheet" href="../styles.css"/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"/>
<style>
  body { margin:0; padding:18px; background:var(--background); font-family:var(--font-sans); color:var(--on-surface); }
  .r { display:flex; flex-wrap:wrap; gap:14px; align-items:center; }
  .sw { display:flex; flex-direction:column; width:150px; border-radius:var(--radius); overflow:hidden; border:1px solid var(--outline-variant); }
  .sw .t { padding:16px 12px; font-size:12px; font-weight:600; }
  .sw .b { padding:7px 12px; font-size:10.5px; background:var(--surface-container-lowest); color:var(--on-surface-variant); display:flex; justify-content:space-between; gap:6px; }
  .sw .b code { font-family:ui-monospace,monospace; }
</style></head><body>
<div class="r">
  <div><div class="m-picklist"><button class="m-picklist__item m-picklist__item--current"><span class="m-picklist__dot" style="background: var(--event-navy)"></span><span class="m-picklist__main"><span class="m-picklist__name">Sunday Service</span><span class="m-picklist__line">Every Sunday at 10:30 am</span><span class="m-picklist__meta">5 roles · next 17 Aug</span></span></button></div></div>
</div>
</body></html>
