<!-- @dsCard group="Display" viewport="700x240" name="RuleRow" subtitle="One rule, read back as a sentence in serif, with whatever it is made of underneath" -->
<!DOCTYPE html><html><head><meta charset="utf-8"/>
<link rel="stylesheet" href="../styles.css"/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"/>
<style>
  body { margin:0; padding:18px; background:var(--background); font-family:var(--font-sans); color:var(--on-surface); }
  .r { display:flex; flex-wrap:wrap; gap:14px; align-items:center; }
  .sw { display:flex; flex-direction:column; width:150px; border-radius:var(--radius); overflow:hidden; border:1px solid var(--outline-variant); }
  .sw .t { padding:16px 12px; font-size:12px; font-weight:600; }
  .sw .b { padding:7px 12px; font-size:10.5px; background:var(--surface-container-lowest); color:var(--on-surface-variant); display:flex; justify-content:space-between; gap:6px; }
  .sw .b code { font-family:ui-monospace,monospace; }
</style></head><body>
<div class="r">
  <div><li class="m-rule-row"><div class="m-rule-row__line"><span class="material-symbols-outlined m-rule-row__icon">sell</span><span class="m-rule-row__text">Must be tagged "Sound Trained"</span></div></li></div>
  <div><li class="m-rule-row m-rule-row--private"><div class="m-rule-row__line"><span class="material-symbols-outlined m-rule-row__icon">lock</span><span class="m-rule-row__text">This rule uses a tag an elder keeps private. It still applies — ask an elder if it needs changing.</span></div></li></div>
</div>
</body></html>
